<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あさの こない むら</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: spooky but friendly night village for 6-8 year olds; short lines, big buttons
   IDEA: an old paper gamebook with tear-out props (hole sheets, colour lenses) laid over a block-world scene
   PICTURE: the scene window; ghosts, hidden letters and props are separate layers over a swappable background
   COLOUR and TYPE: night indigo field, paper story panel, lantern gold accent; DotGothic16 signs, Zen Maru Gothic story
   LAYOUT: one column: header, scene, settings drawer, story panel with items and choices */
:root{color-scheme:dark;--night:#141833;--night2:#0b0e22;--paper:#fff6dc;--ink:#2a2118;--gold:#ffd447;--edge:#06070f;
--grass:#4f9a34;--grass-d:#35701f;--stone:#8d949c;--blue:#2f6fb0;--lava:#c8432c;
--fd:"DotGothic16","Hiragino Maru Gothic ProN","BIZ UDGothic",sans-serif;
--fb:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDGothic",sans-serif;--ts:20px;--tiny:.3}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--night2);background-image:linear-gradient(rgba(255,255,255,.03) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.25) 2px,transparent 2px);background-size:32px 32px;color:var(--ink);font-family:var(--fb);font-weight:500;padding:12px;overflow-x:clip}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--paper)}
h1{font-family:var(--fd);font-weight:400;font-size:24px;line-height:1.2;margin:0;flex:1 1 auto}
.ends{display:flex;gap:5px}
.ends i{width:16px;height:16px;border:2px solid var(--edge);background:#3a3550;display:block}
.ends i.on{background:var(--gold)}
.hbtn{font-family:var(--fd);font-size:17px;min-height:44px;background:var(--gold);color:var(--ink);border:3px solid var(--edge);padding:0 12px}
.hbtns{display:flex;gap:8px}
body.lefty .hbtns{flex-direction:row-reverse}
#musbtn{position:relative;min-width:48px;font-size:22px}
#pauseTrigger{min-width:48px;font-size:20px}
.homelink{align-self:center;font-family:var(--fd);font-size:.85em;color:#6b5a3a;padding:6px 10px}
#musbtn.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;background:var(--lava);transform:rotate(-35deg)}
.hbtn.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #fff,0 0 22px 8px var(--gold)}}
/* scene */
#stage{position:relative;aspect-ratio:16/10;border:4px solid var(--edge);overflow:hidden;background:#0d1030;container-type:inline-size;user-select:none;-webkit-user-select:none}
#flip{position:absolute;inset:0;transition:transform .5s}
#stage.flip #flip{transform:scaleX(-1)}
#stage.gray #flip{filter:grayscale(1) contrast(2.4)}
.bg,.bg>*{position:absolute;inset:0;width:100%;height:100%}
.bg img{object-fit:cover}
.lay{position:absolute;inset:0}
.dark{position:absolute;inset:0;background:#02030c;pointer-events:none;transition:opacity .7s}
.tg{position:absolute;overflow:hidden}
.tg .base,.tg .rev{position:absolute;inset:0}
.txt{font-size:2.6cqw;line-height:1.9;padding:3% 5%;color:#2a2118}
.mag{font-size:1.05cqw;line-height:1.7;color:#2a2118;padding:6% 7%}
.mag p{margin:0}
.tiny{display:flex;align-items:center;justify-content:center;background:#efe4c4;border:.3cqw solid #6b4423}
.tiny span{font-size:2cqw;white-space:nowrap;transform:scale(var(--tiny));transition:transform .4s;font-weight:700;color:#3a2a18}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);background:#f6edd2;border:.4cqw solid #6b4423}
.grid b{display:flex;align-items:center;justify-content:center;font-size:4cqw;font-weight:700;color:#3a2a18;border:1px solid rgba(107,68,35,.15)}
.mir{display:inline-block;transform:scaleX(-1)}
.mirror{display:inline-block;transform:scaleX(-1)}
.ghost{position:absolute;transition:opacity .8s;animation:bob 3s ease-in-out infinite}
.ghost svg,.ghost img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 1.2cqw rgba(200,220,255,.55))}
.ghost.crowd{pointer-events:none;animation-duration:4.5s}
@keyframes bob{50%{translate:0 -1.2cqw}}
.hot{position:absolute;border:.4cqw dashed rgba(255,212,71,.85);background:rgba(255,212,71,.08);padding:0;display:flex;align-items:flex-start;justify-content:center}
.hot span{white-space:nowrap;font-family:var(--fd);font-size:2.3cqw;background:var(--gold);color:var(--ink);padding:0 .8cqw;border:.25cqw solid var(--edge);translate:0 -55%}
.hot.book{border:none;background:none;align-items:stretch}
.hot.book span{translate:none;width:100%;display:flex;align-items:center;justify-content:center;font-size:4cqw;background:transparent;border:none;color:#fff6dc;text-shadow:0 .2cqw 0 #000}
.hot.book rt{font-size:.45em;color:#ffe9a8}
.hot[disabled]{cursor:default;border-color:transparent;background:none}
.sign{position:absolute;font-family:var(--fd);font-size:6cqw;background:#9b6a35;color:#fff6dc;border:.6cqw solid #4a2f14;padding:0 2cqw;line-height:1.4}
.memo{position:absolute;inset:12% 10% 22%;background:#c9a46a;border:1cqw solid #5b3a18;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--fd);font-size:4cqw;line-height:1.7;color:#2a1a0a}
.flash{position:absolute;left:10%;right:10%;top:36%;text-align:center;font-family:var(--fd);font-size:4.4cqw;color:#fffbe0;text-shadow:0 0 2cqw #9fd8ff,0 0 1cqw #fff;opacity:0;pointer-events:none}
.flash.on{opacity:1}
.flowers{position:absolute;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(6,1fr);border:.4cqw solid #2b4a1c}
#tool{position:absolute;touch-action:none;cursor:grab;z-index:9}
#tool.mag{border-radius:50%;border:1cqw solid #6b4423;background:rgba(255,255,240,.94);overflow:hidden;box-shadow:0 1cqw 2cqw rgba(0,0,0,.5)}
#tool.mag .lin{position:absolute;left:0;top:0;transform-origin:0 0}
#tool.red{background:rgba(230,40,40,.28);border:.8cqw solid #7a1010}
#tool.blue{background:rgba(40,90,240,.28);border:.8cqw solid #10307a}
#tool.sheet{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);border:.4cqw solid #1a120b;box-shadow:0 1cqw 2cqw rgba(0,0,0,.5)}
#tool.sheet i{background:#4a3424;border:1px solid #2a1a0e}
#tool.sheet i.h{background:transparent;border:.35cqw solid #ffd447;border-radius:.6cqw}
#tool.sheet.snap i.h{box-shadow:0 0 0 .4cqw #fff,inset 0 0 1.5cqw #ffd447}
#tool.sheet .tag{position:absolute;right:-.4cqw;top:-4.5cqw;font-family:var(--fd);font-size:2.4cqw;background:var(--gold);padding:0 1cqw;border:.3cqw solid #1a120b}
/* settings drawer */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.mbg{position:absolute;inset:0;background:rgba(4,5,14,.9)}
#set{position:relative;width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#262a4a;border:4px solid var(--edge);color:var(--paper);padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{font-size:26px;line-height:1;min-width:52px;min-height:52px;background:var(--gold);color:var(--ink);border:3px solid var(--edge)}
#set h2{font-family:var(--fd);font-weight:400;font-size:20px;margin:0}
.row{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.row>label,.row>span.k{width:8.5em;font-size:17px;font-weight:700}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{min-width:44px;min-height:44px;font-size:16px;font-weight:700;background:#4a4f78;color:var(--paper);border:3px solid var(--edge);padding:0 10px}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.row input{font-size:18px;font-family:var(--fb);padding:6px 8px;border:3px solid var(--edge);width:9em;min-height:44px}
.small{font-size:15px;min-height:44px;background:#4a4f78;color:var(--paper);border:3px solid var(--edge);padding:0 12px}
.small.warn{background:var(--lava)}
/* panel */
.panel{background:var(--paper);border:4px solid var(--edge);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:var(--ts)}
.chap{font-family:var(--fd);font-size:.75em;align-self:flex-start;background:#262a4a;color:var(--paper);padding:0 8px}
.story{line-height:2.2;min-height:calc(var(--ts)*2.2*3 + 12px);cursor:pointer}
.pg{display:flex;flex-direction:column;gap:4px}
.pg p{margin:0}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pager button{font-family:var(--fd);font-size:.9em;min-height:48px;min-width:6.5em;background:#e7dcb8;border:3px solid var(--edge);padding:0 12px}
.pager button.nx{background:var(--gold)}
.pager button[disabled]{opacity:.35;cursor:default}
.pager span{font-family:var(--fd);font-size:.85em;color:#6b5a3a}
.panel{position:relative}
.bubs{position:absolute;left:12px;right:12px;top:38px;z-index:5;display:flex;flex-direction:column;gap:6px}
.bubs>*{box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer;position:relative}
.bubs>*::after{content:"×";position:absolute;right:8px;top:2px;font-weight:700;opacity:.5}
.bubs .whisper{background:#efeaff;border:3px solid #9a8fd0;padding:4px 30px 4px 12px}
.ring{position:absolute;width:6%;aspect-ratio:1;border:.6cqw solid rgba(255,236,170,.9);border-radius:50%;translate:-50% -50%;pointer-events:none;z-index:7;animation:ring 3.2s ease-out forwards}
@keyframes ring{from{scale:.3;opacity:1}to{scale:9;opacity:0}}
.story p{margin:0}
.say{background:#e8e0ff;border:3px solid #514a7a;padding:4px 30px 4px 12px;line-height:2.1;margin:0}
.say b{font-family:var(--fd);font-weight:400;margin-right:6px}
.whisper{color:#5b4f88;font-style:italic;border-left:5px solid #9a8fd0;padding-left:10px;margin:0;line-height:2.1}
.found{background:#fff0b0;border:3px dashed #b08a1a;padding:4px 30px 4px 12px;line-height:2.1;margin:0}
ruby{ruby-position:over}
rt{font-size:.5em;font-weight:700;color:#7a4a1e;user-select:none}
body.nofuri rt{display:none}
body.gray main{filter:grayscale(1)}
body.lefty .choice{text-align:right}
body.lefty .items{flex-direction:row-reverse}
.row input[type=range]{width:min(320px,60vw);min-height:44px;padding:0;border:0;accent-color:var(--gold)}
.dim{position:absolute;pointer-events:none;transition:opacity .4s}
.dots{position:absolute;pointer-events:none}
.dots i{position:absolute;width:.7cqw;height:.7cqw;background:#e8f0ff;box-shadow:0 0 .4cqw #fff}
.hotaru{position:absolute;left:3%;top:5%;width:6%;background:none;border:0;padding:0;z-index:8;animation:fly 5s ease-in-out infinite}
.hotaru svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 1.5cqw #d8ff6a)}
.hotaru.call{animation:fly 5s ease-in-out infinite,blink .6s steps(2) infinite}
@keyframes fly{50%{translate:1.5cqw 1.2cqw}}
@keyframes blink{50%{opacity:.35}}
.story.typing{cursor:pointer}
.items{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.items:empty{display:none}
.chip{font-family:var(--fd);font-size:.85em;min-height:44px;background:#e7dcb8;border:3px solid var(--edge);padding:0 10px;touch-action:none}
.chip[aria-pressed=true]{background:var(--gold);box-shadow:0 0 0 3px #fff inset}
.chip.key{cursor:default}
.items .lbl{font-size:.75em;font-weight:700;color:#6b5a3a}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{font-size:1.02em;font-weight:700;line-height:2;text-align:left;background:var(--grass);color:#fff;border:4px solid var(--edge);box-shadow:inset 0 -6px 0 var(--grass-d),inset 0 4px 0 rgba(255,255,255,.25);padding:4px 16px 10px}
.choice rt{color:#eaffd9}
.choice.back{background:var(--stone);box-shadow:inset 0 -6px 0 #5d646c,inset 0 4px 0 rgba(255,255,255,.25)}
.choice.go{background:var(--blue);box-shadow:inset 0 -6px 0 #1f4f80,inset 0 4px 0 rgba(255,255,255,.25)}
.choice.warn{background:#7a3a8a;box-shadow:inset 0 -6px 0 #4f2060,inset 0 4px 0 rgba(255,255,255,.25)}
.choice[disabled]{opacity:.5;cursor:default}
.choice:active{transform:translateY(2px)}
form.ask{display:flex;gap:8px;flex-wrap:wrap}
form.ask input{font-size:22px;font-family:var(--fb);padding:6px 10px;border:4px solid var(--edge);flex:1 1 10em;min-height:52px}
form.ask button{font-size:20px;font-weight:700;background:var(--grass);color:#fff;border:4px solid var(--edge);padding:0 18px;min-height:52px}
.endt{font-family:var(--fd);font-size:1.3em;background:var(--gold);border:3px solid var(--edge);padding:2px 12px;align-self:flex-start}
.endt.bad{background:#262a4a;color:var(--paper)}
.book h3{font-family:var(--fd);font-weight:400;font-size:1em;margin:6px 0 0;background:#e7dcb8;padding:0 8px}
.book ul{margin:0;padding-left:1.2em;line-height:2.1}
.toast{position:fixed;left:50%;bottom:18px;translate:-50% 0;background:var(--gold);color:var(--ink);font-family:var(--fd);font-size:18px;border:3px solid var(--edge);padding:6px 14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.note{color:#b9b4d6;font-size:13px;line-height:1.7;margin:0}
@media (max-width:480px){h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){.ring{display:none}.ghost,.hbtn.glow,.hotaru{animation:none}.choice:active{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>あさの こない むら</h1>
    <div class="ends" id="ends" aria-label="みつけた おわりかた"></div>
    <div class="hbtns"><button type="button" class="hbtn" id="musbtn" aria-label="おんがく" aria-pressed="true">♪</button>
    <button type="button" class="hbtn" id="bookbtn">てちょう</button>
    <button type="button" class="hbtn" id="setbtn">せってい</button>
    <button type="button" class="hbtn" id="pauseTrigger" aria-label="いちじ停止">⏸</button></div>
  </header>
  <div id="stage" role="img" aria-label="ばめんの え"><div id="flip"></div></div>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>
<div class="modal" id="setwrap" hidden><div class="mbg" id="setbg"></div><section id="set" role="dialog" aria-modal="true" aria-label="せってい"></section></div>
<div class="toast" id="toast"></div>

<script>
{
const $=s=>document.querySelector(s);
/* ===== 絵の差し替え: ここにファイル名や data: URI を書くと、仮の絵の代わりに表示されます ===== */
const ASSETS={bg:{gate:'',panya_e:'',panya:'',hatake:'',tree:'',lib_out:'',hiroba_e:'',hiroba:'',board:'',paper:'',ido:'',koya:'',lib:'',diary:'',shelf:'',book:'',map:'',mori:'',mori_r:'',sign:'',tower:'',wall:'',top:'',morning:'',night:''},
  ghost:{kakashi:'',chibi:'',nop:'',ao:'',meda:'',twin:'',crowd:'',hotaru:''},bgm:'',bgmEve:'',sfx:{bell:'',thud:'',door:''}};

const KEY='asa-no-konai-mura-v4';
const DEF={bright:50,vol:2,furi:1,size:1,gray:0,flip:0,speed:1,music:1};
const fresh=()=>({node:'intro',ch:0,name:'',orig:'',un:{},items:[],clues:[],memos:[],f:{},everDark:false,book:0,reply:'',path:'',end:'',say:null,sheet:null});
let S=fresh(),SET={...DEF},META={ends:[],fails:0,snaps:{},ack:true};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){S=Object.assign(fresh(),d.S);SET=Object.assign({...DEF},d.SET);META=Object.assign(META,d.META)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({S,SET,META}))}catch(e){}};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function miss(n){const a=[...n];if(!a.length)return 'ぬ';
  const D='かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとどはばひびふぶへべほぼ';const R='あいうえおなにぬねのまみむめもやゆよらりるれろわをん';
  let i=D.indexOf(a[0]);if(i>=0)a[0]=D[i%2?i-1:i+1];else{i=R.indexOf(a[0]);a[0]=i>=0?R[(i+1)%R.length]:(a[0]==='ぬ'?'ね':'ぬ')}return a.join('')}
function T(s){return String(s).replace(/\{\{name\}\}/g,esc(S.orig||'きみ')).replace(/\{\{bad\}\}/g,esc(miss(S.orig||'きみ')))
  .replace(/\{([^|{}]+)\|([^{}]*)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\[(.)\]/g,'<span class="mir">$1</span>')}
const P=s=>String(s).split('\n').map(l=>'<p>'+T(l)+'</p>').join('');
const kata=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/\s/g,'');
const has=i=>S.items.includes(i);
function give(i){if(!has(i))S.items.push(i)}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600)}
const CLUE={k1:'のっぺらおばけは、だまって かねの とうを ゆびさしていた。',
 k2:'しおりの ページに ほしの シートを あてたら「りんたろう」と よめた。',
 k3:'けいじばんの ルールの うち 2つだけ、もじが ひとつ ぎゃくむきだった。',
 k4:'たてふだの メモ「ちびの すがたで みんなを だます。 なまえどろぼう」',
 k5:'{七|なな}ばんめの {本|ほん}「かねつきは かおを なくした。おおきくて こわいけど、やさしい。」'};
function clue(k){if(!S.clues.includes(k)){S.clues.push(k);toast('てちょうに メモした')}}
function memo(id,t){if(!S.memos.some(m=>m[0]===id)){S.memos.push([id,t]);toast('てちょうに メモした')}}

/* ===== sound: a soft tick, scaled by the volume setting ===== */
let AC,bgm=null;const volG=()=>[0,.25,.5,.75,1][SET.vol]*.55;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
const bgmMode=()=>S.ch<1?'eve':'night';
function bgmStart(){if(bgm||!SET.music)return;try{const A=ac();const mode=bgmMode();
 const src=mode==='eve'?ASSETS.bgmEve:ASSETS.bgm;if(src){const el=new Audio(src);el.loop=true;el.volume=volG();el.play().catch(()=>{});bgm={el,mode};return}
 if(mode==='eve'){const master=A.createGain();master.gain.value=volG()*.8;master.connect(A.destination);const sc=[392,440,523.3,587.3,659.3,523.3,440];let k=0;
  const timer=setInterval(()=>{const t=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.value=sc[k++%sc.length]*(k%4===0?.5:1);
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(master);o.start(t);o.stop(t+1.7)},700);
  bgm={master,osc:[],timer,mode};return}
 const master=A.createGain();master.gain.value=0;master.gain.linearRampToValueAtTime(volG(),A.currentTime+3);master.connect(A.destination);
 const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.connect(master);
 const osc=[[55,'sawtooth',.035],[55.7,'sawtooth',.035],[82.4,'sine',.05]].map(([f,t,v])=>{const o=A.createOscillator(),g=A.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g).connect(lp);o.start();return o});
 const lfo=A.createOscillator(),lg=A.createGain();lfo.frequency.value=.06;lg.gain.value=140;lfo.connect(lg).connect(lp.frequency);lfo.start();osc.push(lfo);
 const timer=setInterval(()=>{const t=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.value=[220,233.1,174.6,207.7,164.8,155.6][Math.floor(Math.random()*6)];

function pickTool(id){if(tool&&tool.id===id){tool=null}else{const d=toolDims(id);tool={id,...d,x:50-d.w/2,y:50-d.h/2}}renderStage();applyLook();renderPanel()}
function pct(e){const r=$('#stage').getBoundingClientRect();let x=(e.clientX-r.left)/r.width*100;if(SET.flip)x=100-x;return{x,y:(e.clientY-r.top)/r.height*100}}
function moveTo(cx,cy){tool.x=Math.max(-tool.w/2,Math.min(100-tool.w/2,cx-tool.w/2));tool.y=Math.max(-tool.h/2,Math.min(100-tool.h/2,cy-tool.h/2));updateTool()}
function updateTool(){const el=$('#tool');if(!el||!tool)return;const n=node();const ts=n.targets?n.targets():[];tool.snap=null;
 if(tool.id==='star'||tool.id==='moon'){const g=ts.find(t=>t.k==='grid'&&Math.abs(tool.x-t.x)<6&&Math.abs(tool.y-t.y)<8);if(g){tool.x=g.x;tool.y=g.y;tool.snap=g}}
 Object.assign(el.style,{left:tool.x+'%',top:tool.y+'%',width:tool.w+'%',height:tool.h+'%'});
 const cx=tool.x+tool.w/2,cy=tool.y+tool.h/2,inside=t=>cx>=t.x&&cx<=t.x+t.w&&cy>=t.y&&cy<=t.y+t.h;
 if(tool.id==='mag'){const lin=el.querySelector('.lin');const t=ts.find(t=>t.k==='mag'&&inside(t));
  if(!t){lin.innerHTML='';lin._t=null}else{const r=$('#stage').getBoundingClientRect(),k=3,tw=r.width*t.w/100,th=r.height*t.h/100,lw=r.width*tool.w/100,lh=r.height*tool.h/100;
   if(lin._t!==t.id){lin.innerHTML=t.html;lin._t=t.id}const px=(cx-t.x)/t.w*tw,py=(cy-t.y)/t.h*th;
   Object.assign(lin.style,{width:tw+'px',height:th+'px',transform:`translate(${lw/2-px*k}px,${lh/2-py*k}px) scale(${k})`});seen(t)}}
 if(tool.id==='red'||tool.id==='blue')ts.filter(t=>t.k===tool.id).forEach(t=>{const rev=$('#stage').querySelector(`[data-t="${t.id}"] .rev`);if(!rev)return;
  const x1=Math.max(tool.x,t.x),x2=Math.min(tool.x+tool.w,t.x+t.w),y1=Math.max(tool.y,t.y),y2=Math.min(tool.y+tool.h,t.y+t.h);
  rev.style.clipPath=x2>x1&&y2>y1?`inset(${(y1-t.y)/t.h*100}% ${(t.x+t.w-x2)/t.w*100}% ${(t.y+t.h-y2)/t.h*100}% ${(x1-t.x)/t.w*100}%)`:'inset(50% 50% 50% 50%)';
  if(inside(t))seen(t)});
 el.classList.toggle('snap',!!tool.snap);
 if(tool.id==='star'||tool.id==='moon'){const msg=tool.snap?'あなから みえる もじ「'+(tool.id==='star'?STAR:MOON).map(i=>GRIDS[tool.snap.id][i]).join(' ')+'」':null;
  if(msg&&msg!==S.sheet){S.sheet=msg;sheetFound(tool.id,tool.snap.id);renderPanel()}}}
function sheetFound(sh,g){if(sh==='star'&&g==='dgrid')clue('k2');if(sh==='moon'&&g==='bgrid')memo('moon','けいじばんの うらに つきの シート「ふたりの うち ひとりは うそ」')}
function seen(t){const key='seen_'+t.id;if(S.f[key])return;S.f[key]=1;if(t.on)t.on();renderPanel();save()}

/* events */
const stage=$('#stage');let drag=null;
stage.addEventListener('pointerdown',e=>{const t=e.target.closest('#tool');if(!t)return;e.preventDefault();const p=pct(e);drag={dx:p.x-(tool.x+tool.w/2),dy:p.y-(tool.y+tool.h/2),id:e.pointerId};t.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag||!tool)return;const p=pct(e);moveTo(p.x-drag.dx,p.y-drag.dy)});
const endDrag=()=>{if(drag){drag=null;save()}};
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('click',e=>{if(e.target.closest('.hotaru')){tick();hotaruCall=false;S.say=sayLine('hotaru',nextHint());renderStage();applyLook();renderPanel();save();return}
 const g=e.target.closest('.ghost[data-g]');if(g){const gh=curGhosts()[+g.dataset.g];if(vis(gh.th)!==1)return;tick();S.say=sayLine(gh.id,gh.say);if(gh.on)gh.on();renderPanel();save();return}
 const b=e.target.closest('.hot.book');if(b&&!b.disabled){tick();S.f.pick=+b.dataset.b;go('bookask');return}
 const h=e.target.closest('.hot[data-h]');if(h){tick();const o=node().hot()[+h.dataset.h];if(o.go)go(o.go);else{const was=S.node;o.fn();if(S.node===was)render()}}});
/* drag straight from an item chip */
let chipDrag=null;
$('#panel').addEventListener('pointerdown',e=>{const c=e.target.closest('.chip[data-tool]');if(!c)return;e.preventDefault();chipDrag={id:c.dataset.tool,x:e.clientX,y:e.clientY,moved:false}});
addEventListener('pointermove',e=>{if(!chipDrag)return;if(!chipDrag.moved&&Math.hypot(e.clientX-chipDrag.x,e.clientY-chipDrag.y)<12)return;
 if(!chipDrag.moved){chipDrag.moved=true;if(!tool||tool.id!==chipDrag.id)pickTool(chipDrag.id)}const p=pct(e);if(tool)moveTo(p.x,p.y)});
addEventListener('pointerup',e=>{if(!chipDrag)return;const d=chipDrag;chipDrag=null;if(!d.moved){tick();pickTool(d.id)}else save()});
$('#panel').addEventListener('click',e=>{const c=e.target.closest('.choice[data-c]');if(c&&!c.disabled){tick();const o=$('#panel')._cs[+c.dataset.c];if(o.go)go(o.go);else o.fn();return}
 if(e.target.closest('#closebook')){bookOpen=false;renderPanel();return}
 const bub=e.target.closest('[data-bub]');if(bub){const k=bub.dataset.bub;if(k==='say')S.say=null;else if(k==='sheet')S.sheet=null;else BUBOFF.add(k);renderPanel();save();return}
 if(e.target.closest('#pprev')){turn(-1);return}if(e.target.closest('#pnext')){turn(1);return}
 if(e.target.closest('.story')){if(document.querySelector('.pg.typing'))typeDone();else turn(1)}});
$('#panel').addEventListener('submit',e=>{e.preventDefault();const v=$('#askin').value.trim();if(!v){$('#askin').focus();return}tick();const f=node().form;
 if(f==='name'){S.orig=S.name=v;go('gate')}else if(f==='give')finish(S.f.giveTo,v);else if(f==='newname'){S.f.newname=v;if(!META.ends.includes('e1'))META.ends.push('e1');endWith('e2')}});
$('#bookbtn').addEventListener('click',()=>{tick();bookOpen=!bookOpen;renderPanel();if(bookOpen)$('#panel').scrollIntoView({block:'nearest'})});
function openSet(){tick();$('#setwrap').hidden=false;wipeArm=false;META.ack=true;renderSet();renderHeader();save();const x=$('#setx');if(x)x.focus()}
function closeSet(){$('#setwrap').hidden=true;tick();$('#setbtn').focus()}
$('#setbtn').addEventListener('click',openSet);$('#setbg').addEventListener('click',closeSet);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#setwrap').hidden)closeSet()});
$('#set').addEventListener('input',e=>{if(e.target.id==='brin')setVal('bright',+e.target.value,true)});
$('#set').addEventListener('change',e=>{if(e.target.id==='brin'){tick();save()}});
$('#musbtn').addEventListener('click',()=>{setVal('music',SET.music?0:1)});
document.addEventListener('pointerdown',()=>{lastAct=Date.now();if(SET.music&&!bgm)bgmStart()},true);
/* the firefly: generic help after a minute without progress; never says which setting goes where */
const HINTS=['くらくて みえにくい? せっていで あかるさを かえられるよ。','もちものは、えの うえに うごかして つかえるよ。','いろんな せっていや ボタンを ためして みよう。','てちょうを よみかえすと、なにか わかるかも。','ほかの ばしょにも、もういちど いって みよう。','けいじばんの ルールを、よく よんで みよう。'];
function nextHint(){const i=(S.f.hintI||0)%HINTS.length;S.f.hintI=i+1;return HINTS[i]}
let lastAct=Date.now(),hotaruCall=false;
setInterval(()=>{if(hotaruCall||!S.f.hotaruOn||S.node==='end'||!$('#setwrap').hidden||Date.now()-lastAct<60000)return;hotaruCall=true;S.say=sayLine('hotaru',nextHint());lastAct=Date.now();renderStage();applyLook();renderPanel();save()},5000);
/* chapter 3: setting names glitch for a moment */
setInterval(()=>{if($('#setwrap').hidden||S.ch<3||Math.random()<.5)return;const ks=[...document.querySelectorAll('#set .row .k')];if(!ks.length)return;const k=ks[Math.floor(Math.random()*ks.length)],o=k.textContent;
 k.textContent=[...o].map(c=>Math.random()<.5?'ゃ゛ゞぬ▒#ゐゑ'[Math.floor(Math.random()*8)]:c).join('');setTimeout(()=>{if(k.isConnected)k.textContent=o},260)},2400);
$('#set').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='setx'){closeSet();return}
 if(b.dataset.k){setVal(b.dataset.k,+b.dataset.v);return}
 if(b.id==='nmset'){const v=$('#nmin').value.trim();if(v){S.name=v;tick();toast('なまえを かえた');save();renderSet()}return}
 if(b.id==='chback'){restart(S.ch);closeSet();return}
 if(b.id==='wipe'){if(!wipeArm){wipeArm=true;renderSet();return}try{localStorage.removeItem(KEY)}catch(e){}S=fresh();SET={...DEF};META={ends:[],fails:0,snaps:{},ack:true};wipeArm=false;bgmStop();tool=null;bookOpen=false;$('#setwrap').hidden=true;render()}});
/* the flash in the tower: how long it stays depends on the text speed setting */
setInterval(()=>{const f=document.getElementById('flash');if(!f)return;const d=[3000,350,110][SET.speed];f.classList.add('on');
 setTimeout(()=>{f.classList.remove('on');if(SET.speed===0&&S.node==='tower'&&!S.f.flash){S.f.flash=1;memo('flash','とうの いりぐちで ひかった もじ「とうの かべは あおい めで みよ」');renderPanel();save()}},d)},4200);
addEventListener('resize',()=>{if(tool)updateTool()});
render();
}
</script>
<script>window.PAUSE_UI_CONFIG = { trigger: '#pauseTrigger' };</script>
<script src="../pause-ui.js"></script>
</body>
