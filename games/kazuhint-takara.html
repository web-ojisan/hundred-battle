<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お宝ハンター</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  /* layout: one screen. score chips on top, one turn line and one hint line, the square dig field fills the rest */
  --sea:#12454f; --sea-deep:#0b3138; --sand:#f0cf85; --sand-edge:#c79c4c; --soil:#5f4126;
  --ink:#fff7e6; --ink-dim:#a9c7c9; --dark:#2b1d0e;
  --p0:#ef5a3c; --p1:#3d9cf0; --p2:#ffd23f; --p3:#56c271; --p4:#b673ff;
  --display:"Dela Gothic One","Zen Maru Gothic",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-weight:700;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;max-width:900px;margin:0 auto}
h1,.turn,.big{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,7vw,54px);line-height:1.15}
h1 span{color:var(--p2)}
button{font-family:inherit;font-weight:900;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn{border:0;border-radius:18px;background:var(--sand);color:var(--dark);font-size:clamp(20px,4.5vw,28px);
  padding:16px 28px;box-shadow:0 6px 0 var(--sand-edge)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sand-edge)}
.btn:disabled{opacity:.4;cursor:default}
.small{border:2px solid var(--ink-dim);background:none;color:var(--ink-dim);border-radius:12px;font-size:14px;padding:6px 10px;white-space:nowrap}

/* setup / pass screens */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:22px;min-height:0;overflow:auto}
.pick{display:flex;gap:10px;flex-wrap:wrap}
.pick button{border:3px solid var(--ink-dim);background:none;border-radius:16px;font-size:22px;padding:10px 20px;color:var(--ink)}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--sea-deep);border-color:var(--ink)}
ol.rules{margin:0;padding-left:1.4em;font-size:clamp(17px,3.6vw,22px);line-height:1.7;max-width:30em}
ol.rules li{margin-bottom:6px}
.pass{align-items:center;text-align:center}
.pass .gem{width:min(34vw,180px)}
.big{font-size:clamp(28px,7vw,52px);line-height:1.25}
.sub{font-size:clamp(18px,4vw,24px);color:var(--ink-dim);margin:0}

/* play */
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;border-radius:14px;padding:6px 12px;background:var(--sea-deep);
  border:3px solid transparent;font-size:clamp(15px,3.4vw,20px)}
.chip i{width:.9em;height:.9em;border-radius:50%;background:var(--c);display:block}
.chip b{font-family:var(--display);font-weight:400;font-size:1.3em;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.chip.on{border-color:var(--c)}
/* のこりの たから: チップの 2だんめに その色の 宝石を ならべる。ほられた分は りんかくだけ */
.chip{display:grid;grid-template-columns:auto auto auto;justify-content:start;column-gap:8px;row-gap:2px}
.left{grid-column:1/-1;display:flex;gap:4px;align-items:center;min-height:18px;font-size:11px;color:var(--ink-dim);white-space:nowrap}
.left .gem{width:18px;flex:none}
.gem.gone{opacity:.7}
.gem.gone svg path{stroke:#8fb0b3}
.gem.gone svg path:first-child{fill:transparent}
.chip.sup{grid-template-columns:auto auto;color:var(--ink-dim);font-size:clamp(12px,2.6vw,15px);align-content:center}
.chip.sup .gem{width:24px;flex:none}
.band.gone{top:38%;background:#22363b;color:#fff;border-color:var(--c);font-size:clamp(24px,6vw,48px)}
.band.gone em{font-style:normal;color:var(--c)}
.turn{font-size:clamp(22px,5.4vw,36px);line-height:1.2}
.turn em{font-style:normal;color:var(--c)}
.hint{margin:0;font-size:clamp(17px,4vw,24px);min-height:1.5em;color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.field{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.board{--n:6;width:min(100cqw,100cqh);aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),1fr);
  gap:calc(min(100cqw,100cqh)*.012);font-size:calc(min(100cqw,100cqh)/var(--n)*.52)}
/* 砂浜のタイル: 砂つぶの点々 + さざ波もよう。--sx/--sy/--wx/--wy でマスごとに模様をずらす */
.cell{border:0;padding:0;border-radius:16%;box-shadow:inset 0 -.16em 0 var(--sand-edge),inset 0 .06em 0 rgba(255,255,255,.5);
  background:
   radial-gradient(circle,rgba(122,86,32,.36) 0 .028em,transparent .034em) var(--sx,0em) var(--sy,0em)/.47em .41em,
   radial-gradient(circle,rgba(255,255,255,.65) 0 .024em,transparent .03em) var(--sy,.1em) var(--sx,.2em)/.61em .53em,
   radial-gradient(circle,rgba(160,116,48,.28) 0 .02em,transparent .026em) .13em .29em/.29em .37em,
   repeating-radial-gradient(circle at var(--wx,-30%) var(--wy,130%),transparent 0 .3em,rgba(190,146,66,.22) .3em .345em,transparent .345em .42em),
   linear-gradient(165deg,#f8e0a3,#eccb7d 70%,#e6c070);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;
  font-family:var(--display);font-weight:400;font-size:inherit;line-height:1;aspect-ratio:1;min-width:0}
.cell{position:relative}
.mark{position:absolute;top:6%;right:6%;width:26%;height:26%;border-radius:50%;background:var(--c);border:.05em solid var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.5)}
body{transition:box-shadow .3s}
.turnfx{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow:hidden}
.turnfx div{width:100%;padding:28px 16px;text-align:center;background:var(--c);color:var(--dark);font-family:var(--display);
  font-size:clamp(34px,9vw,72px);line-height:1.2;box-shadow:0 0 0 100vmax rgba(11,49,56,.6);opacity:0;
  animation:sweep 1.3s both cubic-bezier(.2,.9,.3,1)}
@keyframes sweep{0%{opacity:0;transform:translateX(-100%)}18%,78%{opacity:1;transform:none}100%{opacity:0;transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){@keyframes sweep{0%,100%{opacity:0}18%,78%{opacity:1}}}
.gem.super{width:80%}
.pop{position:fixed;left:50%;top:42%;z-index:11;pointer-events:none;font-family:var(--display);font-size:clamp(70px,22vw,170px);
  line-height:1;color:var(--c);text-shadow:0 5px 0 var(--dark),0 0 30px rgba(0,0,0,.6);animation:pop .95s both}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#ef2d2d;animation:flash .6s both}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
#app.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}
  @keyframes pop{0%,100%{opacity:0;transform:translate(-50%,-50%)}20%,70%{opacity:1;transform:translate(-50%,-50%)}}}
.cell.dug{box-shadow:inset 0 .12em 0 rgba(0,0,0,.3);cursor:default;
  background:
   linear-gradient(118deg,transparent 47%,rgba(0,0,0,.3) 47% 49.5%,transparent 49.5%) 10% 16%/46% 40% no-repeat,
   linear-gradient(64deg,transparent 47%,rgba(0,0,0,.26) 47% 49.5%,transparent 49.5%) 88% 84%/40% 36% no-repeat,
   linear-gradient(150deg,transparent 47%,rgba(0,0,0,.2) 47% 49.5%,transparent 49.5%) 84% 12%/26% 24% no-repeat,
   radial-gradient(circle at 50% 40%,#6e4c2d,#4f3520)}
.cell.found{background:var(--sea-deep);box-shadow:inset 0 .12em 0 rgba(0,0,0,.35);cursor:default}
.cell.last{outline:3px solid var(--ink);outline-offset:-3px}
.cell.ring{animation:ring 1.1s .3s ease-out both}
@keyframes ring{0%,100%{filter:none}25%,60%{filter:brightness(1.4) drop-shadow(0 0 .12em #fff)}}
.n0{color:#b79d7c}.n1{color:#9be7ff}.n2{color:#b8f28b}.n3{color:#ffd166}.n4{color:#ff9b85}
.gem{display:block;width:62%}
.cell.multi .gem{width:44%}
@media (prefers-reduced-motion:reduce){.cell.ring{animation:none}.btn:active{transform:none}}
/* 席の向きへ画面ごと回す。#rot が回転し、#app は中でいつも通りレイアウトする */
body{overflow:hidden}
#rot{position:fixed;left:50%;top:50%;width:100vw;height:100vh;height:100dvh;
  transform:translate(-50%,-50%) rotate(0deg);transition:transform .7s cubic-bezier(.3,.9,.3,1)}
#rot.side{width:100vh;width:100dvh;height:100vw}
@media (prefers-reduced-motion:reduce){#rot{transition:none}}
.seats{flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:96px 1fr 96px;grid-template-rows:96px 1fr 96px;
  grid-template-areas:". t ." "l c r" ". b ."}
.seat{position:relative;border:3px dashed var(--ink-dim);background:rgba(255,255,255,.06);border-radius:16px;color:var(--ink);font-size:22px}
.seat span{position:absolute;left:50%;top:50%;white-space:nowrap;display:flex;gap:6px;align-items:center}
.seat i{width:.9em;height:.9em;border-radius:50%;display:block}
.seatc{display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;min-height:0;overflow:auto}
/* タイトルロゴ */
.logo{display:flex;align-items:center;gap:.15em;font-size:clamp(46px,11vw,100px);line-height:1.1;color:var(--p2);
  -webkit-text-stroke:.14em var(--dark);paint-order:stroke fill;text-shadow:0 .09em 0 var(--dark);transform:rotate(-3deg);margin:0 0 4px}
.logo .gem.super{width:.95em;flex:none;animation:twinkle 1.6s infinite alternate ease-in-out}
@keyframes twinkle{from{transform:rotate(-8deg) scale(.95)}to{transform:rotate(8deg) scale(1.08);filter:drop-shadow(0 0 .12em #fff)}}
.subttl{margin:0;font-size:clamp(17px,3.6vw,24px);background:var(--sea-deep);border:2px solid var(--sand-edge);color:var(--sand);padding:4px 16px;border-radius:99px}
.btn.alt{background:none;color:var(--ink);box-shadow:none;border:3px solid var(--ink-dim)}
.btn.alt:active{transform:none;box-shadow:none}
/* あそびかた(図解)。--d は出てくるまでの待ち時間。図をおすと もういちど再生 */
.howt{color:var(--p2);font-size:clamp(24px,5.5vw,40px)}
.howc{font-size:clamp(18px,4vw,26px);min-height:3.1em;line-height:1.5}
.hdots{display:flex;gap:8px}
.hdots i{width:12px;height:12px;border-radius:50%;background:var(--sea-deep);display:block}
.hdots i.on{background:var(--p2)}
.cell.hl{background:#fff1b8;outline:.07em solid #fff;outline-offset:-.07em;box-shadow:inset 0 -.16em 0 var(--sand-edge),0 0 .5em var(--p2);animation:hlin .45s both;animation-delay:var(--d)}
@keyframes hlin{from{background:var(--sand);outline-color:transparent;box-shadow:inset 0 -.16em 0 var(--sand-edge),0 0 0 transparent;transform:scale(.88)}}
.cell.no{filter:brightness(.7);animation:noin .3s both;animation-delay:var(--d)}
@keyframes noin{from{filter:none}}
.cell.no::after{content:"✕";color:#7a1e12;font-family:var(--body);font-weight:900;font-size:.9em;animation:fadein .3s both;animation-delay:var(--d)}
@keyframes fadein{from{opacity:0;transform:scale(1.8)}}
.cell.mine{outline:.06em dashed var(--p0);outline-offset:-.1em}
.cell.mine .gem{animation:fadein .4s both;animation-delay:var(--d)}
.scores{display:flex;flex-direction:column;gap:12px;width:min(100%,660px)}
.srow{display:flex;align-items:center;gap:16px;background:var(--sea-deep);border-radius:16px;padding:10px 16px;font-size:clamp(16px,3.4vw,23px);animation:slidein .4s both;animation-delay:var(--d)}
@keyframes slidein{from{opacity:0;transform:translateX(-24px)}}
.cell.mini{width:64px;flex:none;font-size:40px;background:var(--sea);box-shadow:none}
.pt{font-family:var(--display);font-weight:400;font-size:1.5em;min-width:2.2em;color:var(--p2)}
.pt.neg{color:#ff7a6e}
@media (prefers-reduced-motion:reduce){.logo .gem.super,.cell.hl,.cell.no,.cell.no::after,.cell.mine .gem,.srow{animation:none}}
/* ヒントの ✕: たからが ないと わかった マス。ほることは できる */
.cell.xed{filter:brightness(.9)}
.cell.xed::after{content:"✕";color:rgba(122,30,18,.55);font-family:var(--body);font-weight:900;font-size:.8em;pointer-events:none}
.cell.xnew::after{animation:fadein .3s var(--d) both}
.hintrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hintrow>span{font-size:clamp(16px,3.4vw,20px);color:var(--ink-dim)}
.hintrow .pick button{font-size:18px;padding:8px 14px}
/* ---- かざり・エフェクト ---- */
.deco{position:absolute;width:30%;height:30%;left:var(--x);top:var(--y);transform:rotate(var(--r));pointer-events:none;filter:drop-shadow(0 .03em 0 rgba(90,60,20,.35))}
.deco svg{display:block;width:100%;height:100%}
.grain{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:#e9c877;pointer-events:none;z-index:4;
  animation:grainfly .6s var(--dl,0s) cubic-bezier(.1,.7,.3,1) both}
@keyframes grainfly{from{transform:none;opacity:1}to{transform:translate(var(--gx),var(--gy)) scale(.5);opacity:0}}
.grain.star{border-radius:0;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);animation:starfly .9s var(--dl,.12s) cubic-bezier(.1,.7,.3,1) both}
@keyframes starfly{from{transform:scale(.2);opacity:1}70%{opacity:1}to{transform:translate(var(--gx),var(--gy)) rotate(320deg) scale(1);opacity:0}}
.cell.justdug{z-index:3;animation:digpress .32s both}
@keyframes digpress{0%{transform:scale(1.08);filter:brightness(1.7)}45%{transform:scale(.84)}100%{transform:none}}
.cell.justdug .num{display:block;animation:numup .5s .16s both cubic-bezier(.2,1.7,.4,1)}
@keyframes numup{from{opacity:0;transform:translateY(45%) scale(.3)}}
.shovel{position:absolute;width:95%;right:-30%;top:-50%;pointer-events:none;z-index:5;animation:stab .45s both}
.shovel svg{display:block;width:100%}
@keyframes stab{0%{opacity:0;transform:translate(35%,-35%) rotate(8deg)}30%{opacity:1;transform:none}55%{opacity:1;transform:translate(-7%,7%) rotate(-4deg)}100%{opacity:0;transform:translate(14%,-14%)}}
.cell.justdug .gem{animation:gemburst .75s .1s both cubic-bezier(.2,1.5,.4,1)}
@keyframes gemburst{from{transform:scale(0) rotate(-220deg)}60%{transform:scale(1.35) rotate(12deg);filter:drop-shadow(0 0 .2em #fff)}to{transform:none}}
.cell.justdug.sad .gem{animation:gemsad 1.1s .1s both}
@keyframes gemsad{0%{transform:scale(0)}22%{transform:scale(1.1)}45%,80%{transform:translateY(14%) rotate(26deg);filter:saturate(.4) brightness(.75)}100%{transform:none}}
.gem.dropin{animation:gemdrop .5s both}
@keyframes gemdrop{0%{transform:translateY(-150%) scale(.7);opacity:0}50%{transform:translateY(4%) scale(1.12,.86);opacity:1}72%{transform:translateY(-14%)}100%{transform:none}}
.gem.popout{animation:gempop .32s both ease-in}
@keyframes gempop{to{transform:translateY(-90%) rotate(50deg) scale(.3);opacity:0}}
.glint{position:absolute;right:8%;top:6%;font-size:.5em;line-height:1;color:#fff;text-shadow:0 0 .3em #fff;pointer-events:none;animation:glint .6s .25s both}
@keyframes glint{0%{transform:scale(0) rotate(-40deg);opacity:0}45%{transform:scale(1.5);opacity:1}100%{transform:scale(0) rotate(60deg);opacity:0}}
.cell.sink{animation:sandshut .65s both}
@keyframes sandshut{55%{filter:brightness(.82)}80%{filter:brightness(1.25)}}
.cell.sink .gem{animation:gemsink .55s both ease-in}
@keyframes gemsink{30%{transform:translateY(-12%) scale(1.05)}100%{transform:translateY(40%) scale(.15);opacity:0}}
.chip b{display:inline-block}
.chip b.bump{animation:bump .55s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.8);color:var(--p2)}}
.fx{position:absolute;inset:0;z-index:11;pointer-events:none;overflow:hidden}
.fx.dim{background:rgba(11,49,56,.55);animation:dimfade var(--t,1.5s) both}
@keyframes dimfade{0%,100%{opacity:0}12%,80%{opacity:1}}
.gflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#fff,#ffe58a 40%,rgba(255,210,63,0) 75%);animation:gflash .7s both}
@keyframes gflash{from{opacity:.95}to{opacity:0}}
.pts{position:absolute;left:0;top:0;z-index:13;pointer-events:none;font-family:var(--display);font-size:clamp(80px,24vw,190px);line-height:1;color:var(--c);
  -webkit-text-stroke:.07em var(--dark);paint-order:stroke fill;text-shadow:0 .06em 0 var(--dark),0 0 .35em rgba(255,255,255,.55);white-space:nowrap}
.conf{position:absolute;top:-4%;left:var(--l);width:var(--w);height:calc(var(--w)*.6);background:var(--c);animation:conf var(--d) var(--dl) linear both}
@keyframes conf{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),var(--fall)) rotate(var(--r))}}
.band{position:absolute;left:0;right:0;top:16%;padding:14px 16px;text-align:center;background:linear-gradient(90deg,#ffb224,#ffe58a 50%,#ffb224);color:var(--dark);
  font-family:var(--display);font-size:clamp(30px,8vw,64px);line-height:1.2;border-top:5px solid #fff;border-bottom:5px solid #fff;animation:sweep var(--t,1.4s) both cubic-bezier(.2,.9,.3,1)}
.rays{position:absolute;left:50%;top:42%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;
  background:repeating-conic-gradient(rgba(255,255,255,0) 0 6deg,rgba(255,240,170,.75) 6deg 12deg,rgba(255,157,225,.55) 12deg 16deg,rgba(125,243,255,.55) 16deg 20deg,rgba(255,255,255,0) 20deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.7) 22%,transparent 55%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.7) 22%,transparent 55%);animation:rays var(--t,2.4s) linear both}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.25)}14%{opacity:1;transform:rotate(20deg) scale(1)}82%{opacity:1}100%{opacity:0;transform:rotate(170deg) scale(1.1)}}
.biggem{position:absolute;left:50%;top:42%;width:min(46vmin,340px);margin-left:calc(min(46vmin,340px)/-2);margin-top:calc(min(46vmin,340px)/-2);animation:biggem var(--t,2.4s) both}
.biggem .gem{width:100%;animation:gemshine .5s ease-in-out infinite alternate}
@keyframes gemshine{from{filter:drop-shadow(0 0 10px #fff) brightness(1)}to{filter:drop-shadow(0 0 34px #fff) drop-shadow(0 0 60px #ff9de1) brightness(1.25)}}
/* 神秘のダイヤ: 逆まわりの光、ひろがる光の輪 */
.rays.r2{background:repeating-conic-gradient(rgba(255,255,255,0) 0 10deg,rgba(255,255,255,.7) 10deg 13deg,rgba(255,255,255,0) 13deg 24deg);animation-name:rays2}
@keyframes rays2{0%{opacity:0;transform:rotate(0) scale(.25)}14%{opacity:1;transform:rotate(-25deg) scale(1)}82%{opacity:1}100%{opacity:0;transform:rotate(-200deg) scale(1.1)}}
.halo{position:absolute;left:50%;top:42%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border-radius:50%;border:6px solid #fff;box-shadow:0 0 30px #fff,inset 0 0 30px #ffe58a;animation:halo 1.1s .15s ease-out both}
.halo.h2{animation-delay:.75s;border-color:#ff9de1}
@keyframes halo{from{transform:scale(.2);opacity:1}to{transform:scale(4.2);opacity:0}}
/* 神秘のダイヤ(ハデ版)の 追加パーツ */
.fx.mystic{background:radial-gradient(circle at 50% 42%,rgba(60,20,90,.55),rgba(11,49,56,.75))}
.halo.h3{animation-delay:1.5s;border-color:#7df3ff}
.edge{position:absolute;inset:0;box-shadow:inset 0 0 0 10px #fff,inset 0 0 60px 24px #ff9de1,inset 0 0 120px 40px #7df3ff;animation:edge 3.3s both}
@keyframes edge{0%,100%{opacity:0}10%,30%,50%,70%,85%{opacity:1}20%,40%,60%{opacity:.55}}
.band.rainbow{background:linear-gradient(90deg,#ff9de1,#ffe58a,#7df3ff,#b673ff,#ff9de1,#ffe58a,#7df3ff);background-size:300% 100%;animation:sweep var(--t,3.1s) both cubic-bezier(.2,.9,.3,1),slide 1.2s linear infinite;
  font-size:clamp(36px,9.5vw,80px);text-shadow:0 0 .25em #fff}
@keyframes slide{to{background-position:-150% 0}}
.band.rainbow span{display:inline-block;animation:letter .6s both cubic-bezier(.2,1.8,.4,1),wig .5s 1s ease-in-out infinite alternate}
@keyframes letter{from{transform:translateY(-120%) rotate(-30deg) scale(.3);opacity:0}}
@keyframes wig{from{transform:translateY(0)}to{transform:translateY(-10%)}}
.fw{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c),0 0 20px var(--c);opacity:0;animation:fw 1s var(--dl) cubic-bezier(.1,.7,.3,1) both}
@keyframes fw{0%{opacity:1;transform:scale(.3)}60%{opacity:1}100%{opacity:0;transform:translate(var(--fx),calc(var(--fy) + 30px)) scale(.6)}}
.grain2{position:absolute;top:-6%;left:var(--l);width:var(--w);height:var(--w);background:linear-gradient(135deg,#fff,#ff9de1 50%,#7df3ff);clip-path:polygon(22% 8%,78% 8%,100% 36%,50% 96%,0 36%);
  filter:drop-shadow(0 0 6px #fff);animation:conf var(--d) var(--dl) linear both}
/* 盤面で 見つかったあとも キラキラし続ける */
.cell.found .gem.super{animation:supglow 1.4s ease-in-out infinite alternate}
@keyframes supglow{from{filter:drop-shadow(0 0 .04em #fff)}to{filter:drop-shadow(0 0 .22em #fff) drop-shadow(0 0 .4em #ff9de1) brightness(1.15)}}
.cell.justdug .gem.super{animation:gemburst .75s .1s both cubic-bezier(.2,1.5,.4,1),supglow 1.4s .9s ease-in-out infinite alternate}
.sp{position:absolute;left:var(--l);top:var(--tp);font-size:.34em;line-height:1;color:#fff;text-shadow:0 0 .4em #fff,0 0 .8em #7df3ff;pointer-events:none;animation:tw 1.5s var(--dl) infinite}
.chip.sup .gem:not(.gone){animation:supglow 1.4s ease-in-out infinite alternate}
@keyframes biggem{0%{transform:scale(0) rotate(-180deg);opacity:0}12%{transform:scale(1.25) rotate(8deg);opacity:1}20%{transform:scale(1)}40%{transform:scale(1.12) rotate(-6deg)}55%{transform:scale(1) rotate(360deg)}70%{transform:scale(1.15) rotate(354deg)}85%{transform:scale(1.05) rotate(364deg);opacity:1}100%{transform:scale(1.8) rotate(360deg);opacity:0}}
.tw{position:absolute;left:var(--l);top:var(--tp);font-size:var(--w);line-height:1;color:#fff;text-shadow:0 0 .4em #fff,0 0 .8em #ffe58a;animation:tw .7s var(--dl) both}
@keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.cell.found .gem.super,.sp,.chip.sup .gem:not(.gone),.cell.xnew::after,.cell.justdug,.cell.justdug .num,.cell.justdug .gem,.gem.dropin,.cell.ring,.chip b.bump{animation:none}}
a.small{text-decoration:none;display:inline-block}
.homebar{display:flex;justify-content:flex-end}
</style>
</head>
<body>
<div id="rot"><div id="app"></div></div>
<span id="pauseTrigger" hidden></span>
<script>
const P=[{name:'あか',c:'var(--p0)'},{name:'あお',c:'var(--p1)'},{name:'きいろ',c:'var(--p2)'},{name:'みどり',c:'var(--p3)'},{name:'むらさき',c:'var(--p4)'}];
function per(){return S.n>=5?2:3;}
let S, ringAt=-1, askReset=false, ac;
const app=document.getElementById('app');

function fresh(n){return {phase:'setup',n:n||3,size:6,cur:0,hides:[],pick:[],open:[],score:[],msg:'',last:-1,seat:[],hp:0};}
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='on') e.addEventListener('click',v);
    else if(k==='html') e.innerHTML=v;
    else if(k==='style') e.style.cssText=v;
    else if(v===true) e.setAttribute(k,'');
    else if(v!==false&&v!=null) e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{if(k!=null) e.append(k);});
  return e;
}
function gem(p){
  if(p==='S') return el('span',{class:'gem super',html:'<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ff9de1"/><stop offset="1" stop-color="#7df3ff"/></linearGradient></defs><path d="M7 3h10l5 6-10 12L2 9z" fill="url(#sg)" stroke="#2b1d0e" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 9h20M7 3l5 6 5-6M12 9v12" fill="none" stroke="#2b1d0e" stroke-width="1.1" stroke-linejoin="round" opacity=".45"/><path d="M4.5.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#fff" stroke="#2b1d0e" stroke-width=".6" stroke-linejoin="round"/></svg>'});
  return el('span',{class:'gem',html:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l5 6-10 12L2 9z" fill="'+P[p].c+'" stroke="#2b1d0e" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 9h20M7 3l5 6 5-6M12 9v12" fill="none" stroke="#2b1d0e" stroke-width="1.1" stroke-linejoin="round" opacity=".55"/></svg>'});
}
function beep(fs){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime;
    fs.forEach((f,j)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.16,t+j*.11);g.gain.exponentialRampToValueAtTime(.001,t+j*.11+.2);
      o.connect(g);g.connect(ac.destination);o.start(t+j*.11);o.stop(t+j*.11+.22);
    });
  }catch(e){}
}
function neighbors(i){
  const n=S.size,r=Math.floor(i/n),c=i%n,out=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    const rr=r+dr,cc=c+dc;
    if(rr>=0&&rr<n&&cc>=0&&cc<n)out.push(rr*n+cc);
  }
  return out;
}
function ownersAt(i){const o=[];S.hides.forEach((h,p)=>{if(h.includes(i))o.push(p);});return o;}
function has(i){return i===S.super||ownersAt(i).length>0;}
function count(i){return neighbors(i).filter(has).length;}
function allFound(){
  for(let i=0;i<S.size*S.size;i++) if(has(i)&&!S.open[i]) return false;
  return true;
}
function pop(text,color,bad){
  const e=el('div',{class:'pop',style:'--c:'+color},text);
  rot.append(e);
  setTimeout(()=>e.remove(),1000);
  if(bad){
    const f=el('div',{class:'flash'});
    rot.append(f);
    setTimeout(()=>f.remove(),650);
    app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');
    setTimeout(()=>app.classList.remove('shake'),500);
  }
}

function home(direct){
  return direct?el('a',{class:'small',href:'../index.html'},'← ゲームせんたくにもどる')
    :el('button',{class:'small',type:'button',id:'home',on:()=>document.getElementById('pauseTrigger').dispatchEvent(new Event('pointerdown'))},'🏠 ゲームせんたく');
}
function homebar(){return el('div',{class:'homebar'},home());}

/* あそびかた: g は盤面。数字=ほった数字 / h=ひかる / H=✕のあとでひかる / x=✕ / m=じぶんのたから / .=すな */
const HOW=[
 {t:'すうじの いみ',n:3,g:['hhh','h1h','hhh'],c:'すうじは、まわりの 8マスに たからの マスが いくつ あるか。「1」なら、ひかった どこかに 1マス!'},
 {t:'0は あんぜん',n:3,g:['xxx','x0x','xxx'],c:'「0」なら、まわりは ぜんぶ ハズレ。ほらなくて いいよ。'},
 {t:'くみあわせて しぼる',n:4,g:['xxxH','x01H','xxxH','....'],c:'「0」の まわりに ✕ を つける。すると「1」の たからは、のこった 3マスの どこか!'},
 {t:'はしっこは しぼりやすい',n:3,g:['1h.','hh.','...'],c:'かどの「1」は、まわりが 3マスだけ。'},
 {t:'じぶんの たからも かぞえる',n:3,g:['xxx','x1m','xxx'],c:'となりに じぶんの たからが あるなら、その「1」は それ。ほかは ぜんぶ ハズレ!'},
 {t:'てんすう',score:true,c:'たからが ぜんぶ みつかったら おわり。てんすうの おおい ひとの かち!'}
];
function howBoard(pg){
  const b=el('div',{class:'board',style:'--n:'+pg.n}),cells=pg.g.join('');
  const nx=(cells.match(/x/g)||[]).length,x0=cells.indexOf('m')>=0?1.1:.5;
  let xi=0,hi=0;
  for(const ch of cells){
    let c;
    if(ch>='0'&&ch<='9')c=el('div',{class:'cell dug n'+ch},ch);
    else if(ch==='x')c=el('div',{class:'cell no',style:'--d:'+(x0+.09*xi++).toFixed(2)+'s'});
    else if(ch==='h')c=el('div',{class:'cell hl',style:'--d:'+(.4+.1*hi++).toFixed(2)+'s'});
    else if(ch==='H')c=el('div',{class:'cell hl',style:'--d:'+(x0+.09*nx+.5).toFixed(2)+'s'});
    else if(ch==='m')c=el('div',{class:'cell mine',style:'--d:.3s'},gem(0));
    else c=el('div',{class:'cell'});
    b.append(c);
  }
  return el('div',{class:'field',id:'howfield',on:()=>render()},b);
}
function howScores(){
  const row=(i,gems,pt,text)=>el('div',{class:'srow',style:'--d:'+(.2+.35*i).toFixed(2)+'s'},
    el('div',{class:'cell mini'+(gems.length>1?' multi':'')},gems.map(gem)),
    el('b',{class:'pt'+(pt.charAt(0)==='−'?' neg':'')},pt),el('span',null,text));
  return el('div',{class:'field',id:'howfield',on:()=>render()},el('div',{class:'scores'},
    row(0,[1],'+1','ともだちの たから。もう 1かい ほれる'),
    row(1,[1,3],'+3','たからが かさなっていたら ボーナス!'),
    row(2,[0],'−1','じぶんの たから(かさなっていても)。こうたい'),
    row(3,['S'],'+3','神秘のダイヤ! もう 1かい ほれる')));
}

/* ---- かざり・エフェクト ---- */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let fxDig=null,fxPick=-1,fxUnpick=-1,busyHide=false;
/* ヒント: 0=なし 1=やさしい(0の まわり) 2=しっかり(すうじの ぶんが みつかった ところも)。端末に保存 */
const HINTS=[['なし','✕は つかない。じぶんで かんがえよう'],['やさしい','「0」の まわりに ✕ が つく'],['しっかり','たからが ないと わかった マスに ✕ が つく']];
let HINT=2,xPrev=new Set();
try{const v=localStorage.getItem('otakara-hint');if(v==='0'||v==='1'||v==='2')HINT=+v;}catch(e){}
function setHint(v){HINT=v;try{localStorage.setItem('otakara-hint',String(v));}catch(e){}}
/* みんなに 見えている 情報(ほった すうじ と みつかった たから)だけから、たからが ない マスを 出す */
function xCells(){
  const out=new Set();
  if(!HINT)return out;
  for(let i=0;i<S.size*S.size;i++){
    if(!S.open[i]||has(i))continue;
    const nb=neighbors(i),k=count(i),found=nb.filter(j=>S.open[j]&&has(j)).length;
    if(k===0||(HINT===2&&found===k))nb.forEach(j=>{if(!S.open[j])out.add(j);});
  }
  return out;
}
const DECO=[
 '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-5 0-9-4-9-9 0-4 4-8 9-8s9 4 9 8c0 5-4 9-9 9z" fill="#fff4e0" stroke="#c98f5a" stroke-width="1.4"/><path d="M12 21V5M12 21L6 7M12 21l6-14M12 21L3.500 12M12 21l8.500-9" stroke="#c98f5a" stroke-width="1" fill="none"/></svg>',
 '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.600 6.600 7 .500-5.400 4.500 1.800 6.900L12 16.800 6 20.500l1.800-6.900L2.400 9.100l7-.500z" fill="#ff8a5c" stroke="#b5522c" stroke-width="1.3" stroke-linejoin="round"/></svg>',
 '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9" cy="14" rx="6" ry="4.500" fill="#b9b3a6" stroke="#7d776b" stroke-width="1.2"/><ellipse cx="17" cy="10" rx="3.500" ry="2.800" fill="#d1ccc0" stroke="#7d776b" stroke-width="1.1"/></svg>'
];
const SHOVEL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3l7 7" stroke="#6b4a2a" stroke-width="2.4" stroke-linecap="round"/><path d="M17.500 6.500L9 15" stroke="#8a6238" stroke-width="2.6" stroke-linecap="round"/><path d="M9.500 11.500l3 3c-1 4-4 6.500-9 7 .500-5 3-8 6-10z" fill="#c9d3d6" stroke="#4d5a5e" stroke-width="1.3" stroke-linejoin="round"/></svg>';
const hsh=(i,k)=>{const v=Math.sin(i*12.9898+k*78.233)*43758.5453;return v-Math.floor(v);};
/* マスごとの砂もようのずれ */
function sandVars(i){return '--sx:'+(hsh(i,1)*.5).toFixed(2)+'em;--sy:'+(hsh(i,2)*.5).toFixed(2)+'em;--wx:'+Math.round(-60+hsh(i,3)*220)+'%;--wy:'+Math.round(hsh(i,4)<.5?-40-hsh(i,5)*40:140+hsh(i,5)*40)+'%';}
/* 貝がら・ヒトデ・小石。たからの場所とは関係なく、ゲームごとにランダム */
function makeDeco(n){const a=[];for(let i=0;i<n;i++)a.push(Math.random()<.2?{t:Math.floor(Math.random()*3),x:Math.round(6+Math.random()*58),y:Math.round(6+Math.random()*56),r:Math.round(Math.random()*360)}:null);return a;}
function decoEl(i){const d=S.deco&&S.deco[i];return d?el('i',{class:'deco',style:'--x:'+d.x+'%;--y:'+d.y+'%;--r:'+d.r+'deg',html:DECO[d.t]}):null;}
function bits(n,cls,spread,colors,size){
  const a=[];
  for(let j=0;j<n;j++){
    const ang=Math.random()*6.283,d=spread*(.6+Math.random()*.6);
    a.push(el('i',{class:cls,style:'--gx:'+(Math.cos(ang)*d).toFixed(2)+'em;--gy:'+(Math.sin(ang)*d-.25).toFixed(2)+'em;--s:'+(size*(.7+Math.random()*.6)).toFixed(2)+'em;'+(colors?'background:'+colors[j%colors.length]:'')}));
  }
  return a;
}
/* 画面上の要素の中心を、回転している #rot の中の座標になおす */
function loc(e){
  const r=e.getBoundingClientRect(),cx=r.left+r.width/2-innerWidth/2,cy=r.top+r.height/2-innerHeight/2,a=-rotDeg*Math.PI/180;
  return{x:cx*Math.cos(a)-cy*Math.sin(a)+rot.offsetWidth/2,y:cx*Math.sin(a)+cy*Math.cos(a)+rot.offsetHeight/2};
}
function fxLayer(cls,ms,kids,style){const e=el('div',{class:'fx '+cls,style:style||''},kids||[]);rot.append(e);setTimeout(()=>e.remove(),ms);return e;}
function bumpScore(p){const b=document.querySelectorAll('.chip b')[p];if(!b)return;b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
/* 「+1」がマスから飛び出し、まんなかで弾んで、その人のスコアへ飛んでいく */
function flyPoints(text,color,i,p,big){
  const cell=document.querySelectorAll('.board .cell')[i],chip=document.querySelectorAll('.chip')[p];
  if(!cell||!chip||!rot.animate){pop(text,color);bumpScore(p);return;}
  const a=loc(cell),b=loc(chip),c={x:rot.offsetWidth/2,y:rot.offsetHeight*.42};
  const e=el('div',{class:'pts',style:'--c:'+color},text);rot.append(e);
  const at=(q,sc)=>'translate('+q.x.toFixed(1)+'px,'+q.y.toFixed(1)+'px) translate(-50%,-50%) scale('+sc+')';
  const an=e.animate([
    {transform:at(a,.15),opacity:0,offset:0},
    {transform:at(c,1.3),opacity:1,offset:.2},
    {transform:at(c,.92),opacity:1,offset:.31},
    {transform:at(c,1.1),opacity:1,offset:.42},
    {transform:at(c,1),opacity:1,offset:.5},
    {transform:at(c,1),opacity:1,offset:.72},
    {transform:at(b,.16),opacity:.9,offset:1}],{duration:big>1?big:big?1700:1200,easing:'ease-in-out',fill:'forwards'});
  an.onfinish=()=>{e.remove();bumpScore(p);beep([1319]);};
}
function confetti(n){
  const cols=['#ef5a3c','#3d9cf0','#ffd23f','#56c271','#b673ff','#ffffff'],a=[],H=rot.offsetHeight;
  for(let j=0;j<n;j++)a.push(el('i',{class:'conf',style:'--l:'+Math.round(Math.random()*100)+'%;--w:'+Math.round(10+Math.random()*12)+'px;--c:'+cols[j%cols.length]+
    ';--d:'+(1+Math.random()*.9).toFixed(2)+'s;--dl:'+(Math.random()*.35).toFixed(2)+'s;--dx:'+Math.round(-90+Math.random()*180)+'px;--fall:'+Math.round(H*1.12)+'px;--r:'+Math.round(360+Math.random()*900)+'deg'}));
  return a;
}
function twinkles(n,big){
  const a=[],cols=['#fff','#fff','#ffe58a','#ff9de1','#7df3ff'];
  for(let j=0;j<n;j++)a.push(el('i',{class:'tw',style:'--l:'+Math.round(3+Math.random()*94)+'%;--tp:'+Math.round(3+Math.random()*90)+'%;--w:'+Math.round(big?26+Math.random()*70:22+Math.random()*40)+
    'px;--dl:'+(Math.random()*(big?1.7:1.1)).toFixed(2)+'s;color:'+cols[j%cols.length]},j%3?'✦':'✧'));
  return a;
}
/* 花火: あちこちで 少しずつ 時間をずらして はじける */
function fireworks(n){
  const cols=['#ffe58a','#ff9de1','#7df3ff','#ffffff','#b673ff','#56c271'],a=[];
  for(let k=0;k<n;k++){
    const x=Math.round(10+Math.random()*80),y=Math.round(12+Math.random()*62),dl=(.25+k*.42+Math.random()*.15).toFixed(2),c=cols[k%cols.length],R0=90+Math.random()*90;
    for(let j=0;j<16;j++){
      const ang=j/16*6.283+Math.random()*.2,d=R0*(.75+Math.random()*.4);
      a.push(el('i',{class:'fw',style:'left:'+x+'%;top:'+y+'%;--c:'+(j%4?c:'#fff')+';--dl:'+dl+'s;--fx:'+Math.round(Math.cos(ang)*d)+'px;--fy:'+Math.round(Math.sin(ang)*d)+'px'}));
    }
  }
  return a;
}
/* 小さな ダイヤの 雨 */
function gemRain(n){
  const a=[],H=rot.offsetHeight;
  for(let j=0;j<n;j++)a.push(el('i',{class:'grain2',style:'--l:'+Math.round(Math.random()*100)+'%;--w:'+Math.round(18+Math.random()*26)+'px;--d:'+(1.3+Math.random()*1.1).toFixed(2)+'s;--dl:'+(.2+Math.random()*1.5).toFixed(2)+
    's;--dx:'+Math.round(-60+Math.random()*120)+'px;--fall:'+Math.round(H*1.15)+'px;--r:'+Math.round(-360+Math.random()*720)+'deg'}));
  return a;
}
function shakeApp(){app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),500);}
/* ほった結果ごとの演出。render のあと(マスができてから)に呼ぶ */
function celebrate(f){
  if(f.kind==='miss')return;
  if(f.kind==='own'){pop(f.text,'#ff5a4d',true);return;}
  if(reduce){pop(f.text,f.color);bumpScore(f.p);return;}
  if(f.kind==='bonus'){
    fxLayer('dim',1700,[el('div',{class:'gflash'}),el('div',{class:'band'},'おおあたり!')].concat(confetti(44)),'--t:1.6s');
    shakeApp();
  }else if(f.kind==='super'){
    /* 神秘のダイヤ: 光の筋・光の輪・花火・ダイヤの雨・虹色のふち。約3.3秒 */
    fxLayer('dim mystic',3350,[el('div',{class:'gflash'}),el('div',{class:'rays'}),el('div',{class:'rays r2'}),
      el('div',{class:'halo'}),el('div',{class:'halo h2'}),el('div',{class:'halo h3'}),el('div',{class:'edge'}),
      el('div',{class:'biggem'},gem('S')),
      el('div',{class:'band rainbow',style:'--t:3.1s'},[...'神秘のダイヤ!'].map((ch,j)=>el('span',{style:'animation-delay:'+(.25+j*.07).toFixed(2)+'s'},ch)))]
      .concat(fireworks(6),gemRain(22),twinkles(60,true),confetti(46)),'--t:3.3s');
    shakeApp();setTimeout(shakeApp,520);setTimeout(shakeApp,1250);
    beep([1047,1319,1568,2093,1568,2093,2637]);setTimeout(()=>beep([2093,2637,3136,2637,3136]),950);setTimeout(()=>beep([1568,2093,2637,3136]),1900);
  }
  flyPoints(f.text,f.color,f.i,f.p,f.kind==='super'?2700:f.kind!=='hit');
}

/* 席と回転: 0=てまえ 1=ひだり 2=むこう 3=みぎ */
const rot=document.getElementById('rot');
const SIDE_DEG=[0,90,180,-90];
let SEAT=[], faceP=0, rotDeg=0;
function setRot(target){
  rotDeg+=((target-rotDeg)%360+540)%360-180;
  rot.style.transform='translate(-50%,-50%) rotate('+rotDeg+'deg)';
  rot.classList.toggle('side',Math.abs(target)===90);
}
function face(p){faceP=p;setRot(SIDE_DEG[S.seat[p]]||0);}
function seatView(go){
  const p=S.seat.length,pl=P[p];
  const sb=(side,area)=>el('button',{class:'seat',type:'button',id:'seat'+side,style:'grid-area:'+area,'aria-label':['てまえ','ひだり','むこう','みぎ'][side],
    on:()=>{S.seat.push(side);beep([660]);if(S.seat.length>=S.n){SEAT=S.seat.slice();go();}else render();}},
    el('span',{style:'transform:translate(-50%,-50%) rotate('+SIDE_DEG[side]+'deg)'},
      S.seat.map((s,q)=>s===side?el('i',{style:'background:'+P[q].c}):null),'ここ'));
  return el('div',{class:'seats'},sb(2,'t'),sb(1,'l'),sb(3,'r'),sb(0,'b'),
    el('div',{class:'seatc',style:'grid-area:c'},
      el('p',{class:'big',style:'color:'+pl.c},pl.name+' さんの せきは どこ?'),
      el('p',{class:'sub'},'タブレットを まんなかに おいて、じぶんが すわる がわを おしてね'),
      (SEAT.length===S.n&&p===0)?el('button',{class:'btn',type:'button',id:'sameseat',on:()=>{S.seat=SEAT.slice();go();}},'まえと おなじ せき'):null,
      el('button',{class:'small',type:'button',id:'seatback',on:()=>{S.seat=[];S.phase='setup';render();}},'もどる')));
}

/* actions */
function begin(){
  const n=S.n;
  S.size=n>=4?7:6;
  S.hides=[];S.score=[];
  for(let p=0;p<n;p++){S.hides.push([]);S.score.push(0);}
  S.open=new Array(S.size*S.size).fill(false);
  S.finder=new Array(S.size*S.size).fill(-1);
  S.deco=makeDeco(S.size*S.size);xPrev=new Set();
  S.cur=0;S.pick=[];S.msg='';S.last=-1;S.phase='pass';
  beep([523]);render();
}
function togglePick(i){
  if(busyHide)return;
  const k=S.pick.indexOf(i);
  if(k>=0){S.pick.splice(k,1);fxUnpick=i;beep([392]);}
  else if(S.pick.length<per()){S.pick.push(i);fxPick=i;beep([880,660]);}
  render();
}
/* 「かくした!」: たからが砂にしずんでから、つぎの人へ */
function hideDone(){
  if(busyHide)return;
  if(reduce){hideFinish();return;}
  busyHide=true;beep([392,330,262]);
  document.querySelectorAll('.board .cell').forEach(c=>{if(c.querySelector('.gem'))c.classList.add('sink');});
  setTimeout(()=>{busyHide=false;hideFinish();},700);
}
function hideFinish(){
  S.hides[S.cur]=S.pick.slice();S.pick=[];S.cur++;
  if(S.cur<S.n)S.phase='pass';
  else{
    const empty=[];
    for(let i=0;i<S.size*S.size;i++) if(!ownersAt(i).length) empty.push(i);
    S.super=empty[Math.floor(Math.random()*empty.length)];
    S.cur=0;S.phase='ready';
  }
  beep([523,784]);render();
}
function dig(i){
  if(S.phase!=='play'||S.open[i])return;
  S.open[i]=true;S.last=i;ringAt=-1;askReset=false;
  const p=S.cur,owners=ownersAt(i);
  if(!S.finder)S.finder=[];
  S.finder[i]=p;
  let pass=true,bad=false,fx={i:i,p:p,kind:'miss',color:P[p].c,text:''};
  if(i===S.super){
    S.score[p]+=3;pass=false;
    S.msg='神秘のダイヤ! 3てん。もう 1かい ほれるよ';
    beep([523,659,784,1047,1319,1568]);fx.kind='super';fx.text='+3';fx.color='#fff';
  }else if(owners.length){
    const others=owners.filter(q=>q!==p).length;
    if(owners.includes(p)){
      /* じぶんの たからが 入っていたら、ともだちの たからと かさなっていても −1 で こうたい */
      bad=true;fx.kind='own';
      const head=others?'じぶんの たからも はいっていた!':'じぶんの たからを ほっちゃった!';
      if(S.score[p]>0){S.score[p]-=1;S.msg=head+' 1てん へった。こうたい';fx.text='−1';}
      else{S.msg=head+' こうたい';fx.text='ブブー';}
      beep([233,175,131]);
    }else if(others>=2){
      const g=others+1;S.score[p]+=g;pass=false;
      S.msg='おおあたり! '+others+'こ かさなって ボーナス。'+g+'てん。もう 1かい ほれるよ';
      beep([523,659,784,1047]);fx.kind='bonus';fx.text='+'+g;
    }else{
      S.score[p]+=1;pass=false;
      S.msg='あたり! 1てん。もう 1かい ほれるよ';beep([659,880,1047]);fx.kind='hit';fx.text='+1';
    }
  }else{
    const k=count(i);
    S.msg=k?'ハズレ。まわりの 8マスで、たからの マスは '+k+'つ':'ハズレ。まわりの 8マスに、たからの マスは ない';
    ringAt=i;beep([150,300+k*60]);
  }
  if(allFound()){S.phase='end';beep([523,659,784,1047,1319]);}
  else if(pass)S.cur=(S.cur+1)%S.n;
  fxDig=fx;
  render();
  celebrate(fx);
  /* ほりつくされた色が あれば、発見の演出の あとに 帯を 出し、こうたいの 帯は その あとに まわす */
  const gone=owners.filter(q=>leftOf(q)===0);
  let wait=0;
  if(gone.length&&S.phase==='play'){
    wait={hit:1100,bonus:1650,super:3300,own:950}[fx.kind]||0;
    if(reduce)showGone(gone);else setTimeout(()=>showGone(gone),wait);
    wait+=1500;
  }
  if(S.phase==='play'&&pass)showTurn(S.cur,Math.max(wait,bad?1150:800));
}
function showTurn(p,delay){
  document.querySelectorAll('.turnfx').forEach(e=>e.remove());
  const band=el('div',{style:'--c:'+P[p].c+';animation-delay:'+delay+'ms'},'つぎは '+P[p].name+' さん!');
  const fx=el('div',{class:'turnfx','aria-live':'polite'},band);
  rot.append(fx);
  setTimeout(()=>{beep([440,587,784]);face(p);},delay);
  setTimeout(()=>fx.remove(),delay+1350);
}

/* views */
function leftOf(p){return S.hides[p].filter(i=>!S.open[i]).length;}
function chips(){
  const end=S.phase==='end',supGone=!!S.open[S.super];
  const sg=gem('S');if(supGone)sg.classList.add('gone');
  return el('div',{class:'chips'},P.slice(0,S.n).map((pl,p)=>{
    const tot=S.hides[p].length,l=leftOf(p);
    return el('div',{class:'chip'+(S.phase==='play'&&p===S.cur?' on':''),style:'--c:'+pl.c},
      el('i'),pl.name,el('b',null,String(S.score[p])),
      end?null:el('span',{class:'left','aria-label':'のこりの たから '+l+'こ'},
        l?Array.from({length:tot},(_,k)=>{const g=gem(p);if(k>=l)g.classList.add('gone');return g;}):'ほりつくされた…'));
  }),end?null:el('div',{class:'chip sup',id:'supchip'},sg,supGone?'みつかった':'あと 1こ'));
}
/* その色の さいごの 1こが ほられたときの 帯 */
function showGone(list){
  const kids=[];list.forEach((q,j)=>{if(j)kids.push(' と ');kids.push(el('em',{style:'color:'+P[q].c},P[q].name));});
  kids.push(' の たからは ほりつくされた…');
  fxLayer('',1700,[el('div',{class:'band gone',style:'--c:'+P[list[0]].c+';--t:1.6s'},kids)]);
  beep([392,330,262,196]);
}
function board(mode){
  const b=el('div',{class:'board',style:'--n:'+S.size});
  const ring=ringAt>=0?neighbors(ringAt):[];
  const xs=mode==='play'?xCells():new Set();let xn=0;
  for(let i=0;i<S.size*S.size;i++){
    let c;
    const fd=fxDig&&fxDig.i===i?fxDig:null;
    if(mode==='hide'){
      const on=S.pick.includes(i),g=on?gem(S.cur):fxUnpick===i?gem(S.cur):null;
      if(g&&fxPick===i)g.classList.add('dropin');
      if(g&&!on)g.classList.add('popout');
      c=el('button',{class:'cell',style:sandVars(i),type:'button','aria-label':'マス '+(i+1)+(on?' たから あり':''),on:()=>togglePick(i)},
        on?null:decoEl(i),g,
        fxPick===i&&!reduce?[el('i',{class:'glint'},'✦')].concat(bits(8,'grain',.9,null,.1).map(x=>{x.style.setProperty('--dl','.22s');return x;})):null);
    }else{
      const sup=i===S.super,owners=ownersAt(i),shown=S.open[i]||(mode==='end'&&has(i));
      if(!shown){
        const x=xs.has(i),nw=x&&!xPrev.has(i);
        c=el('button',{class:'cell'+(ring.includes(i)?' ring':'')+(x?' xed':'')+(nw?' xnew':''),style:sandVars(i)+(nw?';--d:'+(.4+.07*xn++).toFixed(2)+'s':''),type:'button',
          'aria-label':'マス '+(i+1)+(x?' たから なし':''),disabled:mode==='end',on:()=>dig(i)},decoEl(i));
      }else if(owners.length||sup){
        c=el('div',{class:'cell found'+(owners.length>1?' multi':'')+(i===S.last?' last':'')+(fd?' justdug'+(fd.kind==='own'?' sad':''):'')},sup?gem('S'):owners.map(gem),
          sup?[[8,10,0],[72,6,.5],[80,66,1],[6,70,.25],[42,-4,.8]].map(q=>el('i',{class:'sp',style:'--l:'+q[0]+'%;--tp:'+q[1]+'%;--dl:'+q[2]+'s'},'✦')):null,
          (S.finder&&S.finder[i]>=0)?el('span',{class:'mark',style:'--c:'+P[S.finder[i]].c,title:P[S.finder[i]].name+' さんが みつけた'}):null,
          fd&&!reduce?bits(10,'grain',1.3,null,.11).concat(fd.kind==='own'?[]:bits(fd.kind==='hit'?10:16,'grain star',fd.kind==='hit'?2.1:3,['#ffd23f','#fff',fd.color],.3),[el('i',{class:'shovel',html:SHOVEL})]):null);
      }else{
        const k=count(i);
        c=el('div',{class:'cell dug n'+Math.min(k,4)+(i===S.last?' last':'')+(ring.includes(i)?' ring':'')+(fd?' justdug':'')},el('span',{class:'num'},String(k)),
          fd&&!reduce?bits(12,'grain',1.4,null,.12).concat([el('i',{class:'shovel',html:SHOVEL})]):null);
      }
    }
    b.append(c);
  }
  if(mode==='play')xPrev=xs;
  return el('div',{class:'field'},b);
}
function render(){
  app.textContent='';
  setRot((S.phase==='play'||S.phase==='boom')?(SIDE_DEG[S.seat[faceP]]||0):0);
  const pl=P[S.cur];
  document.body.style.boxShadow=S.phase==='play'?'inset 0 0 0 8px '+pl.c:'none';
  if(S.phase==='setup'){
    app.append(el('div',{class:'center'},
      el('h1',{class:'logo'},gem('S'),'お宝ハンター'),
      el('p',{class:'subttl'},'すうじが ヒントの たからさがし'),
      el('div',{class:'pick',role:'group','aria-label':'あそぶ にんずう'},[2,3,4,5].map(n=>
        el('button',{type:'button',id:'n'+n,'aria-pressed':String(S.n===n),on:()=>{S.n=n;render();}},n+'にん'))),
      el('div',{class:'hintrow'},el('span',null,'ヒント'),
        el('div',{class:'pick',role:'group','aria-label':'ヒント'},HINTS.map((h,v)=>
          el('button',{type:'button',id:'hint'+v,'aria-pressed':String(HINT===v),on:()=>{setHint(v);render();}},h[0]))),
        el('span',{id:'hintdesc'},HINTS[HINT][1])),
      el('div',{class:'row',style:'justify-content:flex-start'},
        el('button',{class:'btn',type:'button',id:'start',on:()=>{S.seat=[];S.phase='seat';beep([523]);render();}},'はじめる'),
        el('button',{class:'btn alt',type:'button',id:'how',on:()=>{S.hp=0;S.phase='how';beep([523]);render();}},'あそびかた')),
      el('p',{class:'sub'},'たからを '+per()+'つずつ かくして、すうじを ヒントに ほりあてよう。じぶんの ばんには、がめんが じぶんの せきを むくよ。'),
      home(true)));
  }else if(S.phase==='how'){
    const pg=HOW[S.hp],lastPg=S.hp===HOW.length-1;
    app.append(
      el('div',{class:'top'},
        el('p',{class:'turn',style:'flex:1'},'あそびかた '+(S.hp+1)+' / '+HOW.length),
        el('button',{class:'small',type:'button',id:'howclose',on:()=>{S.phase='setup';render();}},'とじる')),
      el('p',{class:'big howt'},pg.t),
      pg.score?howScores():howBoard(pg),
      el('p',{class:'hint howc'},pg.c),
      el('div',{class:'row'},
        el('button',{class:'btn alt',type:'button',id:'howback',disabled:S.hp===0,on:()=>{S.hp--;beep([523]);render();}},'◀ まえへ'),
        el('div',{class:'hdots'},HOW.map((_,i)=>el('i',{class:i===S.hp?'on':''}))),
        el('button',{class:'btn',type:'button',id:'hownext',on:()=>{if(lastPg)S.phase='setup';else S.hp++;beep([660]);render();}},lastPg?'とじる':'つぎへ ▶')));
  }else if(S.phase==='seat'){
    app.append(homebar(),seatView(begin));
  }else if(S.phase==='pass'){
    app.append(homebar(),el('div',{class:'center pass'},
      gem(S.cur),
      el('p',{class:'big',style:'color:'+pl.c},pl.name+' さんの ばん'),
      el('p',{class:'sub'},'ほかの ひとは うしろを むいてね'),
      el('button',{class:'btn',type:'button',id:'go',on:()=>{S.phase='hide';beep([523]);render();}},'たからを かくす')));
  }else if(S.phase==='hide'){
    const left=per()-S.pick.length;
    app.append(
      homebar(),
      el('p',{class:'turn',style:'--c:'+pl.c,html:'<em>'+pl.name+'</em> さん、たからを '+per()+'つ かくそう'}),
      el('div',{class:'row'},
        el('p',{class:'hint'},left?'あと '+left+'つ。マスを おしてね':'もういちど おすと とりけせるよ'),
        el('button',{class:'btn',type:'button',id:'done',disabled:left>0,on:hideDone},'かくした!')),
      board('hide'));
  }else if(S.phase==='ready'){
    app.append(homebar(),el('div',{class:'center pass'},
      el('p',{class:'big'},'みんな あつまれ!'),
      el('p',{class:'sub'},'タブレットを まんなかに おいてね'),
      el('button',{class:'btn',type:'button',id:'go',on:()=>{S.phase='play';S.msg='すきな マスを ほってみよう';render();showTurn(S.cur,0);}},'スタート')));
  }else{
    const end=S.phase==='end';
    let head;
    if(end){
      const max=Math.max.apply(null,S.score),w=[];
      S.score.forEach((s,p)=>{if(s===max)w.push(p);});
      head=w.length===1
        ?el('p',{class:'turn',style:'--c:'+P[w[0]].c,html:'<em>'+P[w[0]].name+'</em> さんの かち! '+max+'てん'})
        :el('p',{class:'turn'},'ひきわけ! '+w.map(p=>P[p].name).join(' と ')+' が '+max+'てん');
    }else{
      head=el('p',{class:'turn',style:'--c:'+pl.c,html:'<em>'+pl.name+'</em> さんの ばん'});
    }
    app.append(
      el('div',{class:'top'},chips(),
        home(end),
        end?null:el('button',{class:'small',type:'button',id:'reset',on:()=>{if(askReset){askReset=false;S=fresh(S.n);}else askReset=true;render();}},askReset?'ほんとに やめる?':'さいしょから')),
      head,
      el('div',{class:'row'},
        el('p',{class:'hint'},end?'たからが ぜんぶ みつかったよ':S.msg),
        end?el('button',{class:'btn',type:'button',id:'again',on:()=>{S=fresh(S.n);render();}},'もういちど あそぶ'):null),
      board(end?'end':'play'));
  }
  fxDig=null;fxPick=-1;fxUnpick=-1; // エフェクトは1回の描画で使い切る
}
S=fresh(3);
render();
</script>
<script>window.PAUSE_UI_CONFIG = { trigger: '#pauseTrigger' };</script>
<script src="../pause-ui.js"></script>
</body>
