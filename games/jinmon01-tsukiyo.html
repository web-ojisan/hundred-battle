<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尋問 月夜の番頭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 一画面の法廷。上=状況、中央=証言台の人物、下=生成りの紙に書かれた発言と操作。朱は「矛盾」の印だけに使う。 */
:root{
  color-scheme:dark;
  --ink:#151a2d;      /* 藍墨の地 */
  --panel:#222a46;    /* 一段明るい藍 */
  --line:#3a4468;
  --paper:#f3ecdc;    /* 生成りの紙 */
  --sumi:#1e1b17;     /* 紙の上の墨 */
  --shu:#d1432b;      /* 朱印 */
  --matcha:#55793a;   /* 証言のしるし */
  --gold:#d9b25f;     /* 名札 */
  --muted:#a3acc6;--wood:#5b422b;--wood-hi:#7a5a3a;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* HUD */
header{display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
.ttl{display:flex;align-items:baseline;gap:10px}
.ttl small{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted)}
.ttl b{display:block;font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 舞台 */
#stage{flex:1;min-height:270px;position:relative;overflow:hidden;display:flex;flex-direction:column}
/* 上のコマ=法廷を見上げる引きの絵、下のコマ=証言台の寄り。間の帯で別カメラに見せる */
#upper{flex:58;position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 48px),linear-gradient(#161c36,#252e52);}
.gutter{flex:0 0 7px;background:var(--ink);border-top:1px solid rgba(243,236,220,.55);border-bottom:1px solid rgba(243,236,220,.55)}
#lower{flex:42;min-height:120px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 100%,#3b4674,#1f2747 70%);}
/* 裁判長まわりの飾り: 月の丸窓、行灯、柱、幕。話者の明暗とは別の層 */
.deco{position:absolute;inset:0}
.deco i{position:absolute;display:block}
.valance{top:0;left:0;right:0;height:16px;background:radial-gradient(circle at 50% 0,#4a2f63 0 11px,transparent 12px) 0 6px/24px 16px repeat-x,linear-gradient(#4a2f63 0 7px,transparent 7px);border-top:2px solid var(--gold);z-index:1}
.pillar{top:0;bottom:0;width:5%;background:linear-gradient(90deg,#2c2015,#6d4f33 45%,#3b2a1b);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.pillar::before{content:"";position:absolute;left:-18%;right:-18%;top:16px;height:9px;background:var(--gold);border-radius:2px;opacity:.8}
.pl{left:19%}.pr{right:19%}
.moon{left:50%;top:calc(17% + 34px);width:32%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:
   repeating-linear-gradient(90deg,transparent 0 24%,rgba(58,42,27,.75) 24% 26%),
   repeating-linear-gradient(0deg,transparent 0 24%,rgba(58,42,27,.75) 24% 26%),
   radial-gradient(circle at 50% 45%,#fff3c9,#e7c873 70%,#c79f45);
  border:6px solid #6d4f33;box-shadow:0 0 0 2px var(--gold),0 0 34px rgba(240,214,140,.45);filter:brightness(.72);transition:filter .25s}
#upper:has(#judge.on) .moon{filter:none}
.andon{top:21%;width:7.5%;height:38px;border-radius:5px;background:linear-gradient(#fff0b8,#f0b455);border-top:5px solid #2a1e14;border-bottom:5px solid #2a1e14;box-shadow:0 0 18px rgba(255,214,120,.75)}
.andon::before{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:60px;margin-bottom:5px;background:#2a1e14}
.al{left:27%}.ar{right:27%}

.seat{position:absolute;display:flex;flex-direction:column;align-items:center;transition:transform .25s}
/* 話していない人は人物だけ暗く。机は飾りが読める明るさを残す */
.seat .bust{filter:brightness(.45) saturate(.6);transition:filter .25s}
.seat .desk,.seat .desk3{filter:brightness(.78);transition:filter .25s}
.seat.on .bust,.seat.on .desk,.seat.on .desk3{filter:none}
.seat svg{display:block;width:100%;height:auto}
.bust{position:relative}
.desk{background:var(--wood);border-top:3px solid var(--wood-hi);position:relative;z-index:1}

#judge{top:17%;bottom:0;left:50%;width:50%;transform:translateX(-50%)}
#judge .bust{width:34%}
/* 裁判長の机はコマの下まで続く。見上げるほど高い壇 */
#judge .desk{flex:1;width:100%;margin-top:-8px;border-radius:4px 4px 0 0;border-top:4px solid var(--gold);display:flex;align-items:flex-start;justify-content:center;gap:8px;padding-top:9px;
  background:repeating-linear-gradient(90deg,transparent 0 31%,rgba(0,0,0,.18) 31% 32%),linear-gradient(#6d4f33,#3b2a1b 85%)}
#judge .desk span{font-size:10px;color:#e9d9b8;letter-spacing:.1em;line-height:11px}
.pips{display:flex;gap:5px}
.pips i{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(217,178,95,.7);transition:.3s}
.pips i.off{background:transparent;box-shadow:inset 0 0 0 2px #8a6c48}

#pros,#def{top:39%;bottom:0;width:40%;z-index:1}
#pros{left:0}#def{right:0}
#pros .bust,#def .bust{width:80%}
/* 斜めの机: 外側が手前、中央側が奥。前面はコマの下の帯まで伸びる */
.desk3{flex:1;width:108%;margin-top:-26px;position:relative;z-index:1}
.desk3 i{position:absolute;inset:0}
.desk3 .top{background:var(--d-top);clip-path:polygon(0 20px,86% 0,100% 10px,8% 32px)}
.desk3 .front{background:var(--d-front);clip-path:polygon(8% 32px,100% 10px,100% 100%,8% 100%)}
.desk3 .sidef{background:var(--d-side);clip-path:polygon(0 20px,8.2% 32px,8.2% 100%,0 100%)}
/* 検事席=黒漆に銀の縁と書類の束。被告人席=白木の格子に朱の縁と湯のみ */
.desk3 .trim{background:var(--d-trim);clip-path:polygon(8% 32px,100% 10px,100% 15px,8% 37px)}
.desk3 .tag{position:absolute;left:36%;top:41px;padding:0 9px 1px;font-family:var(--display);font-weight:800;font-size:13px;line-height:1.5;letter-spacing:.2em;border:1px solid var(--d-trim);border-radius:2px;background:var(--d-tagbg);color:var(--d-tagfg);transform:skewY(-8deg)}
.desk3 .item{position:absolute}
.papers{left:34%;top:9px;width:26%;height:9px;background:#f3ecdc;transform:skewY(-8deg) skewX(-32deg);box-shadow:2px -3px 0 #cfc5ae,0 -6px 0 #f3ecdc,3px -9px 0 #cfc5ae}
.cup{left:52%;top:0;width:13px;height:15px;background:#55793a;border-radius:2px 2px 5px 5px;border-top:3px solid #7fa05a}
#pros .desk3{--d-top:#4a5270;--d-front:linear-gradient(#262c40,#10131c);--d-side:linear-gradient(#171b28,#0b0d14);--d-trim:#b9c7dc;--d-tagbg:#10131c;--d-tagfg:#d7e3f2}
#def .desk3{--d-top:#d2a86e;--d-front:repeating-linear-gradient(90deg,transparent 0 13px,rgba(60,36,14,.42) 13px 16px),linear-gradient(#b0834f,#7a5630);--d-side:linear-gradient(#7a5630,#4e3519);--d-trim:#c9432b;--d-tagbg:#f3ecdc;--d-tagfg:#7a2a1c}
#def .desk3 .tag{transform:skewY(-8deg) scaleX(-1)}
#pros .desk3{align-self:flex-start}
#def .desk3{align-self:flex-end;transform:scaleX(-1)}

#wit{bottom:0;left:50%;width:min(44%,210px);transform:translateX(-50%);z-index:2}
#wit.on{transform:translateX(-50%) scale(1.04);transform-origin:50% 100%}
#wit .bust{width:100%}
#wit .desk{width:124%;height:26px;margin-top:-14px;border-radius:60px 60px 0 0}

/* 汗 */
.drop{position:absolute;width:9px;height:13px;background:#bfe1ff;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;opacity:0}
.d1{left:22%;top:26%}.d2{right:20%;top:34%}.d3{left:30%;top:10%}
#wit[data-sweat="1"] .d1,#wit[data-sweat="2"] .d1,#wit[data-sweat="2"] .d2,#wit[data-sweat="3"] .drop{opacity:1;animation:drip 1.3s infinite ease-in}
.d2{animation-delay:.4s!important}.d3{animation-delay:.8s!important}
#wit[data-sweat="3"] .bust{animation:tremble .18s infinite}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes tremble{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}

/* 反応 */
#wit.shock{animation:wshake .5s}
@keyframes wshake{0%,100%{margin-left:0}20%{margin-left:-10px}40%{margin-left:9px}60%{margin-left:-6px}80%{margin-left:4px}}
#pros.recoil .bust{animation:recoil 1.1s cubic-bezier(.2,1.4,.4,1)}
@keyframes recoil{0%{transform:none}18%,70%{transform:translate(-9%,-8%) rotate(-20deg)}100%{transform:none}}
.mark{position:absolute;right:-4%;top:-6%;font-family:var(--display);font-weight:800;font-size:32px;color:var(--shu);opacity:0}
#pros.recoil .mark{animation:pop 1.1s}
@keyframes pop{0%{opacity:0;transform:scale(.3)}18%,70%{opacity:1;transform:scale(1)}100%{opacity:0}}

/* 右の席=弁護側。手前に弁護人、奥に被告 */
#def .b-def{position:absolute;width:50%;right:-6%;top:2%}
#def .b-you{z-index:1}
#def[data-on="you"] .b-you,#def[data-on="def"] .b-def,#def[data-on="you"] .desk3,#def[data-on="def"] .desk3{filter:none}
#def .b-you.lean{animation:lean .7s}
@keyframes lean{0%,100%{transform:none}25%,75%{transform:translate(-9%,3%) rotate(-9deg)}}
/* 事件ファイル: 肩を軸に振りかぶり、机へ叩きつける。当たる瞬間に机が揺れ、湯のみが跳ね、紙が舞い、朱印が出る */
#def .b-you.strike{animation:strike 1.3s;filter:none}
@keyframes strike{0%,100%{transform:none}30%,44%{transform:translate(5%,-3%) rotate(7deg)}54%,82%{transform:translate(-8%,5%) rotate(-9deg)}}
.swing{position:absolute;left:47%;top:4%;width:30%;height:66%;transform-origin:50% 100%;opacity:0;pointer-events:none}
.swing i{position:absolute;display:block}
.fl-arm{left:30%;width:40%;top:38%;height:62%;background:#2f6f5e;border-radius:8px}
.fl-file{left:-14%;width:128%;top:0;height:50%;background:#d9a441;border:2px solid #1e1b17;border-radius:3px;box-shadow:inset 8px 0 0 #f3ecdc,inset 10px 0 0 #1e1b17}
.fl-file::after{content:"";position:absolute;right:12%;top:20%;width:40%;height:30%;background:#f3ecdc;border-top:3px solid var(--shu)}
.b-you.strike .swing{animation:swing 1.3s}
@keyframes swing{0%{opacity:0;transform:rotate(0)}8%{opacity:1;transform:rotate(0)}30%,44%{opacity:1;transform:rotate(32deg)}54%,82%{opacity:1;transform:rotate(-100deg)}100%{opacity:0;transform:rotate(-100deg)}}
#def.slam .desk3{animation:jolt .35s}
@keyframes jolt{0%,100%{translate:0 0}30%{translate:0 6px}60%{translate:0 -2px}}
#def.slam .cup{animation:cuphop .5s}
@keyframes cuphop{0%,100%{translate:0 0;rotate:0deg}40%{translate:0 -16px;rotate:14deg}}
.fly{position:absolute;left:2%;top:58%;width:12px;height:15px;background:#f3ecdc;border:1px solid #1e1b17;opacity:0;z-index:3;pointer-events:none}
#def.slam .fly{animation:fly .85s ease-out}
#def.slam .f1{--fx:-46px;--fy:-64px;--fr:-220deg}
#def.slam .f2{--fx:14px;--fy:-82px;--fr:160deg}
#def.slam .f3{--fx:-78px;--fy:-30px;--fr:-140deg}
@keyframes fly{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr))}}
#def .b-def.droop{animation:droop 1.3s}
@keyframes droop{0%,100%{transform:none}25%,80%{transform:translateY(12%) rotate(10deg)}}
#def.joy .b-def{animation:hop .7s}
@keyframes hop{0%,50%,100%{transform:none}25%,75%{transform:translateY(-12%)}}

#note{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:var(--matcha);color:#fff;font-size:13px;font-weight:700;padding:4px 14px;border-radius:99px;white-space:nowrap}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* 発言 */
#box{background:var(--paper);color:var(--sumi);padding:14px 16px 12px;min-height:150px;border-top:4px solid var(--line);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
#box.testi{border-top-color:var(--matcha)}
#tag{font-size:12px;font-weight:700;letter-spacing:.08em;color:#6b6252;display:flex;gap:8px;align-items:center;min-height:20px}
#box.testi #tag{color:var(--matcha)}
#tag .done{font-weight:500;color:#8a8170}
#text{font-size:17px;line-height:1.75;font-weight:500;flex:1}
#box.testi #text{font-family:var(--display);font-weight:600;font-size:18px}
#text.think{color:#4a5f8a}
#dots{display:flex;gap:6px;justify-content:center}
#dots i{width:22px;height:4px;border-radius:2px;background:#cfc5ae}
#dots i.on{background:var(--matcha)}

/* 操作 */
/* 下段は常に同じ4マス。法廷記録は会話中も尋問中も右から2番目 */
#ctl{display:grid;grid-template-columns:52px 1fr 1fr 52px;gap:8px;padding:10px 16px 16px;background:var(--ink)}
#ctl button{min-height:52px;border-radius:8px;font-weight:700;font-size:16px;background:var(--panel);border:1px solid var(--line)}
#ctl .nav{flex:0 0 52px;font-size:20px}
#ctl .act{flex:1}
#ctl .press{background:#2f4f86;border-color:#4d72b5}
#ctl .show{background:var(--shu);border-color:#e8674f;color:#fff}
#ctl.two{grid-template-columns:34% 1fr}
#ctl.one{grid-template-columns:1fr}
#ctl .span2{grid-column:span 2}
#ctl .recb{background:transparent;border:2px solid var(--paper);color:var(--paper)}
#ctl .close{flex:0 0 34%}
#ctl .next{flex:1;background:var(--paper);color:var(--sumi);border-color:var(--paper)}
#ctl button:disabled{opacity:.35;cursor:default}

/* 矛盾の演出: 白い閃光 → 朱の帯が斜めに走る → 左から「矛」、右から「盾」が突っ込み、中央でぶつかって火花 */
#stamp{position:absolute;inset:0;z-index:20;overflow:hidden;pointer-events:none;background:rgba(21,26,45,.5)}
#stamp i,#stamp b{position:absolute;display:block}
.flash{inset:0;background:#fff;opacity:0;animation:flash .28s both}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.slash{position:absolute;left:-20%;right:-20%;top:50%;height:0;transform:rotate(-8deg);animation:slashout .16s 1.02s both}
@keyframes slashout{from{opacity:1;scale:1}to{opacity:0;scale:1.25}}
.band{left:0;right:0;top:0;height:min(42vw,190px);transform:translateY(-50%);transform-origin:0 50%;
  background:repeating-linear-gradient(0deg,transparent 0 13px,rgba(30,27,23,.16) 13px 15px),linear-gradient(90deg,#b3321d,var(--shu) 30%,#e8674f 50%,var(--shu) 70%,#b3321d);
  border-top:5px solid var(--paper);border-bottom:5px solid var(--paper);box-shadow:0 0 0 3px var(--sumi),0 0 40px rgba(209,67,43,.6);animation:band .2s .03s both cubic-bezier(.2,.9,.3,1)}
@keyframes band{from{scale:0 1}to{scale:1 1}}
.k{top:0;font-family:var(--display);font-weight:800;font-size:min(30vw,150px);line-height:1;color:var(--paper);-webkit-text-stroke:2px var(--sumi);text-shadow:5px 6px 0 var(--sumi);transform:translateY(-52%) skewX(-8deg)}
.k1{right:50%;margin-right:2px;animation:k1 .2s .15s both cubic-bezier(.3,1.5,.5,1)}
.k2{left:50%;margin-left:2px;animation:k2 .2s .25s both cubic-bezier(.3,1.5,.5,1)}
@keyframes k1{from{translate:-110vw 0}to{translate:0 0}}
@keyframes k2{from{translate:110vw 0}to{translate:0 0}}
.spark{left:50%;top:0;width:min(56vw,250px);aspect-ratio:1;margin:calc(min(56vw,250px)/-2) 0 0 calc(min(56vw,250px)/-2);opacity:0;
  background:radial-gradient(circle,#fff 0 22%,#ffe9a8 23% 55%,rgba(255,233,168,.6) 56%);
  clip-path:polygon(50% 0,57% 36%,90% 14%,65% 44%,100% 50%,65% 56%,90% 86%,57% 64%,50% 100%,43% 64%,10% 86%,35% 56%,0 50%,35% 44%,10% 14%,43% 36%);animation:spark .34s .4s both}
@keyframes spark{0%{opacity:1;scale:.1;rotate:0deg}45%{opacity:1;scale:1}100%{opacity:0;scale:1.35;rotate:20deg}}
#stage.quake{animation:quake .3s}
@keyframes quake{0%,100%{translate:0 0}20%{translate:-7px 3px}40%{translate:6px -4px}60%{translate:-4px 2px}80%{translate:3px -1px}}

#app.bad{animation:shake .4s}

/* カード(開廷・判決) */
#overlay{position:absolute;inset:0;z-index:30;background:rgba(21,26,45,.9);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{background:var(--paper);color:var(--sumi);border-radius:10px;padding:22px 20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.card .eyebrow{font-size:12px;letter-spacing:.18em;color:#6b6252;font-weight:700}
.card h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.25;text-wrap:balance}
.card p{font-size:15px}
.card ul{padding-left:1.2em;font-size:14px;display:flex;flex-direction:column;gap:4px}
.card .go{min-height:52px;border-radius:8px;background:var(--shu);color:#fff;font-weight:700;font-size:17px}
.back{align-self:center;font-size:14px;font-weight:700;color:#6b6252;padding:4px 8px}
#pauseTrigger{flex:none;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rank{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--shu)}
.card table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.card td{padding:6px 0;border-bottom:1px solid #d8cdb4}
.card td:last-child{text-align:right;font-weight:700}

/* 法廷記録: 舞台の上に重ねる。証言の紙と下段の操作は隠さない */
#sheet{position:absolute;inset:0;z-index:5;background:var(--panel);display:flex;flex-direction:column;gap:10px;padding:12px 16px;overflow:auto}
.shead{font-family:var(--display);font-size:15px;color:var(--gold);letter-spacing:.1em}
#evlist{display:flex;gap:8px}
#evlist button{flex:1;min-width:0;min-height:54px;border-radius:8px;background:var(--paper);color:var(--sumi);font-family:var(--display);font-weight:800;font-size:22px;border:3px solid transparent;opacity:.55}
#evlist button[aria-pressed="true"]{border-color:var(--gold);opacity:1;box-shadow:0 0 0 2px var(--gold)}
#evdesc{flex:1;background:var(--paper);color:var(--sumi);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.65;overflow:auto}
#evdesc b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}

@media (min-height:760px){#box{min-height:180px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><small>CASE 01</small><b id="phase">月夜の番頭</b></div>
    <button id="pauseTrigger" type="button" aria-label="一時停止">中断</button>
  </header>

  <div id="stage">
    <div id="note" hidden></div>
    <div id="upper">

 after:[

/* ---------- 状態 ---------- */
const MAXLIFE=5;

let queue=[],onDone=null,typing=null,full='',sel='outage',busy=false,recOpen=false;

/* ---------- 音 ---------- */
let AC=null;
function beep(f,d,type,v){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={tick:()=>beep(520,.05,'square',.025),hit:()=>{beep(140,.35,'sawtooth',.08);setTimeout(()=>beep(90,.4,'sawtooth',.08),90);},bad:()=>beep(110,.4,'square',.06),slam:()=>beep(70,.22,'sawtooth',.1),add:()=>{beep(660,.1,'triangle',.06);setTimeout(()=>beep(880,.15,'triangle',.06),100);}};

/* ---------- 表示 ---------- */
function pips(){let h='';for(let i=0;i<MAXLIFE;i++)h+='<i class="'+(i<S.life?'':'off')+'"></i>';$('pips').innerHTML=h;$('pips').setAttribute('aria-label','裁判長の信頼 '+S.life+' / '+MAXLIFE);}
function speaker(k){['judge','pros','wit'].forEach(x=>$(x).classList.toggle('on',x===k));$('def').dataset.on=k==='you'?'you':k==='def'?'def':'';}
function pulse(el,c,ms){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),ms);}
function sweat(n){$('wit').dataset.sweat=Math.min(3,n===undefined?S.ti+(S.unlocked?1:0):n);}
function type(text){
  clearInterval(typing);typing=null;full=text;const el=$('text');
  if(reduce){el.textContent=text;return;}
  let i=0;el.textContent='';
  typing=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);if(i>=text.length){clearInterval(typing);typing=null;}},30);
}
function finishType(){if(typing){clearInterval(typing);typing=null;$('text').textContent=full;return true;}return false;}
function note(msg){const n=$('note');n.textContent=msg;n.hidden=false;setTimeout(()=>{n.hidden=true;},2200);}

function showLine(who,text){
  $('box').classList.remove('testi');$('dots').innerHTML='';
  speaker(who);
  $('tag').textContent=who==='narr'?'':WHO[who].n;
  $('text').classList.toggle('think',who==='you'&&text.charAt(0)==='(');
  type(text);
}
function ctlTalk(){
  $('ctl').className='';
  $('ctl').innerHTML='<button class="next span2" id="nx" type="button">次へ</button><button class="recb" id="rc" type="button">法廷記録</button><button class="nav" id="nx2" type="button" aria-label="次へ">▶</button>';
  $('nx').onclick=advance;$('nx2').onclick=advance;$('rc').onclick=openRec;
}
function ctlExam(){
  $('ctl').className='';
  $('ctl').innerHTML='<button class="nav" id="pv" type="button" aria-label="前の証言">◀</button>'+
   '<button class="act press" id="ps" type="button">問いただす</button>'+
   '<button class="recb" id="sh" type="button">法廷記録</button>'+
   '<button class="nav" id="nv" type="button" aria-label="次の証言">▶</button>';
  $('pv').disabled=S.si===0;
  $('pv').onclick=()=>move(-1);$('nv').onclick=()=>move(1,true);
  $('ps').onclick=press;$('sh').onclick=openRec;
}
function ctlRec(){
  if(S.mode==='exam'){
    $('ctl').className='two';
    $('ctl').innerHTML='<button class="close" id="cl" type="button">閉じる</button><button class="act show" id="go" type="button">突きつける</button>';
    $('go').onclick=()=>{const id=sel;recOpen=false;$('sheet').hidden=true;ctl();present(id);};
  }else{$('ctl').className='one';$('ctl').innerHTML='<button class="next" id="cl" type="button">閉じる</button>';}
  $('cl').onclick=closeRec;
}
function ctl(){if(recOpen)ctlRec();else if(S.mode==='exam')ctlExam();else ctlTalk();}
function talk(lines,done){S.mode='talk';queue=lines.slice();onDone=done;ctl();step();}
function step(){
  if(!queue.length){const d=onDone;onDone=null;if(d)d();return;}
  const l=queue.shift();showLine(l[0],l[1]);
}
function advance(){
  if(busy||recOpen)return;
  if(finishType())return;
  if(S.mode==='talk'){sfx.tick();step();}
  else if(S.mode==='exam'){move(1,true);}
}

/* ---------- 尋問 ---------- */
function startTestimony(i){
  S.ti=i;S.si=0;S.unlocked=false;sweat();
  S.sts=T[i].st.map(s=>({k:s.k,t:s.t,p:s.p,add:s.add,done:false}));
  $('phase').textContent=T[i].title;
  talk([['narr','尋問開始 「'+T[i].title+'」  証言を読み、あやしい発言は問いただす。証拠と食い違う発言には、法廷記録から突きつける。']],exam);
}
function exam(){
  S.mode='exam';const st=S.sts[S.si],n=S.sts.length;
  speaker('wit');
  $('box').classList.add('testi');$('text').classList.remove('think');
  $('tag').innerHTML='証言 '+(S.si+1)+' / '+n+(st.done?' <span class="done">問いただし済み</span>':'');
  let d='';for(let i=0;i<n;i++)d+='<i class="'+(i===S.si?'on':'')+'"></i>';$('dots').innerHTML=d;
  type(st.t);
  ctl();
}
function move(d,loop){
  if(S.mode!=='exam'||busy||recOpen)return;const n=S.sts.length;let i=S.si+d;
  if(i<0)return;if(i>=n){if(!loop)return;i=0;}
  S.si=i;sfx.tick();exam();
}
function press(){
  if(busy)return;
  const st=S.sts[S.si];st.done=true;S.press++;sfx.tick();pulse(document.querySelector('.b-you'),'lean',750);
  talk(st.p,()=>{
    if(st.add&&!S.unlocked){S.unlocked=true;sweat();S.sts.splice(S.si+1,0,{k:st.add.k,t:st.add.t,p:st.add.p,done:false});S.si++;sfx.add();note('証言が追加された');}
    else if(S.si<S.sts.length-1)S.si++;
    exam();
  });
}
function present(id){
  const t=T[S.ti],st=S.sts[S.si],h=t.hit;
  if(id===h.ev&&h.need&&!S.unlocked){talk(t.needLines,exam);return;}
  if(id===h.ev&&h.keys.indexOf(st.k)>=0){success();return;}
  const soft=(t.soft||[]).find(s=>s.ev===id);
  if(soft){talk(soft.lines,exam);return;}
  wrong();
}
function success(){
  /* ファイルを振りかぶる → 机に叩きつける → 一拍おいて矛盾の演出と周りの反応 */
  busy=true;
  const s=$('stamp'),p=$('pros'),w=$('wit'),d=$('def'),t0=reduce?0:700,t1=reduce?0:900;
  pulse(document.querySelector('.b-you'),'strike',1350);
  setTimeout(()=>{pulse(d,'slam',900);sfx.slam();},t0);
  setTimeout(()=>{
    sfx.hit();s.hidden=false;
    [p,w,d].forEach(e=>{e.classList.remove('recoil','shock','joy');void e.offsetWidth;});
    p.classList.add('recoil');w.classList.add('shock');d.classList.add('joy');sweat(S.ti+1);
    if(!reduce)setTimeout(()=>pulse($('stage'),'quake',320),420);
    setTimeout(()=>{
      s.hidden=true;[p,w,d].forEach(e=>e.classList.remove('recoil','shock','joy'));busy=false;
      talk(T[S.ti].after,()=>{if(S.ti<T.length-1)startTestimony(S.ti+1);else verdict();});
    },reduce?700:1250);
  },t1);
}
function wrong(){
  S.life--;S.miss++;pips();sfx.bad();pulse(document.querySelector('.b-def'),'droop',1350);
  const a=$('app');a.classList.remove('bad');void a.offsetWidth;a.classList.add('bad');
  talk([['judge','弁護人。その証拠は、いまの発言と食い違っていないようです。'],['you','(しまった。裁判長の心証が悪くなった…。)']],()=>{if(S.life<=0)gameOver();else exam();});
}

/* ---------- 法廷記録 ---------- */
function pick(id){
  sel=id;const ev=EV.find(x=>x.id===id);
  $('evlist').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===id?'true':'false'));
  $('evdesc').innerHTML='<b>'+ev.n+'</b>'+ev.d;
}
function openRec(){
  if(busy||(S.mode!=='talk'&&S.mode!=='exam'))return;
  finishType();recOpen=true;
  $('evlist').innerHTML=EV.map(e=>'<button type="button" data-id="'+e.id+'" aria-label="'+e.n+'" aria-pressed="false">'+e.g+'</button>').join('');
  pick(sel);$('sheet').hidden=false;ctl();sfx.tick();
}
function closeRec(){recOpen=false;$('sheet').hidden=true;ctl();}
$('evlist').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;pick(b.dataset.id);sfx.tick();});
$('box').onclick=advance;

/* ---------- カード ---------- */
const BACK='<a class="back" href="../index.html">← ゲームせんたくにもどる</a>';
function best(){try{return JSON.parse(localStorage.getItem('jinmon01-best'));}catch(e){return null;}}
const ORDER='CBAS';
function showTitle(){
  const b=best();
  $('card').innerHTML='<p class="eyebrow">CASE 01 ・ 尋問</p><h1>月夜の番頭</h1>'+
   '<p>老舗の和菓子店「月乃屋」から、門外不出のレシピ帳が消えた。疑われたのは見習い職人。あなたは弁護人として、目撃者の証言を崩す。</p>'+
   '<ul><li><b>問いただす</b> 発言をくわしく聞く。何度でもできる。</li><li><b>法廷記録</b> 証拠を読む。証拠と食い違う発言の上でえらんで、突きつける。外すと信頼が減る。</li><li>信頼が尽きると有罪。</li></ul>'+
   (b?'<p class="eyebrow">自己ベスト ランク '+b.rank+'</p>':'')+
   '<button class="go" id="start" type="button">開廷する</button>'+BACK;
  $('overlay').hidden=false;$('start').onclick=begin;
}
function begin(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  S={mode:'talk',ti:0,si:0,life:MAXLIFE,miss:0,press:0,unlocked:false,sts:[]};
  pips();sweat(0);$('phase').textContent='月夜の番頭';$('overlay').hidden=true;
  talk(INTRO,()=>startTestimony(0));
}
function verdict(){
  S.mode='end';
  const rank=S.miss===0?'S':S.miss===1?'A':S.miss<=3?'B':'C';
  const b=best();let rec=false;
  if(!b||ORDER.indexOf(rank)>ORDER.indexOf(b.rank)){rec=true;try{localStorage.setItem('jinmon01-best',JSON.stringify({rank:rank}));}catch(e){}}
  $('card').innerHTML='<p class="eyebrow">CASE 01 月夜の番頭 ・ 判決</p>'+
   '<div class="verdict"><h1>無罪</h1><span class="rank">'+rank+'</span></div>'+
   '<p>レシピ帳は餡堂の自宅から見つかった。ハルは店に戻り、今日も餡を炊いている。「先生、今度うちの豆大福を食べに来てください！」</p>'+
   '<table><tr><td>外した証拠</td><td>'+S.miss+' 回</td></tr><tr><td>問いただした回数</td><td>'+S.press+' 回</td></tr><tr><td>弁護評価'+(rec?'(自己ベスト更新)':'')+'</td><td>'+rank+'</td></tr></table>'+
   '<button class="go" id="start" type="button">もう一度弁護する</button>'+BACK;
  $('overlay').hidden=false;$('start').onclick=begin;
}
function gameOver(){
  S.mode='end';
  $('card').innerHTML='<p class="eyebrow">CASE 01 月夜の番頭</p><h1>有罪</h1>'+
   '<p>裁判長の信頼を失い、弁護は打ち切られた。</p>'+
   '<p>手がかり: 発言を問いただすと、証人は細かいことを口にします。その細部を法廷記録と見くらべてください。</p>'+
   '<button class="go" id="start" type="button">この証言からやり直す</button>'+BACK;
  $('overlay').hidden=false;
  $('start').onclick=()=>{S.life=MAXLIFE;pips();$('overlay').hidden=true;startTestimony(S.ti);};
}

addEventListener('keydown',e=>{
  if(!$('overlay').hidden||recOpen)return;
  if(e.key==='ArrowRight'){e.preventDefault();if(S.mode==='exam')move(1,true);else advance();}
  if(e.key==='ArrowLeft'&&S.mode==='exam'){e.preventDefault();move(-1);}
});

/* 開いた時点で法廷が見えるように */
pips();speaker('wit');$('tag').textContent=WHO.wit.n;$('text').textContent='餡堂徳次。月乃屋の番頭を三十年つとめております。';ctl();
showTitle();
})();
</script>
<script>window.PAUSE_UI_CONFIG = { trigger: '#pauseTrigger' };</script>
<script src="../pause-ui.js"></script>
