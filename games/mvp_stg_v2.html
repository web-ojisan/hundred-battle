<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>3色協力弾幕STG（囲みレイアウト）</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #06060c;
    touch-action: none;
    overscroll-behavior: none;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
  }
  #game { display: block; width: 100vw; height: 100vh; background: #06060c; }
  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    font-size: 12px; color: rgba(255,255,255,0.75);
    z-index: 10;
    letter-spacing: 1px;
  }
  #fusionCount { font-size: 13px; font-weight: bold; color: #fff; }
  #msg {
    position: fixed; top: 30px; left: 0; width: 100%;
    text-align: center; color: rgba(255,255,255,0.45); font-size: 11px;
    pointer-events: none; z-index: 10; line-height: 1.5;
    padding: 0 90px;
  }
  #rotateOverlay {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: #06060c;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    color: #fff; font-size: 18px; text-align: center; line-height: 1.6;
  }
  #rotateOverlay .icon { font-size: 52px; animation: spin 1.4s ease-in-out infinite alternate; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotateOverlay { display: flex; } }
</style>
</head>
<body>

<div id="rotateOverlay">
  <div class="icon">📱</div>
  <div>タブレットを<strong>横向き</strong>にしてください</div>
</div>

<div id="hud">
  <div>🔴RED / 🔵BLUE / 🟢GREEN</div>
  <div id="fusionCount">FUSION: 0</div>
</div>
<div id="msg">自分の辺を指でなぞってスライド移動（よける）！なぞり続けると連射、その場でホールド→離すとチャージ開始、チャージ中に2回タップで自機を前方へ発射（貫通攻撃）</div>
<canvas id="game"></canvas>

<script>
// 横向きロック試行
if (screen.orientation && screen.orientation.lock) {
  screen.orientation.lock('landscape').catch(() => {});
}

// ダブルタップ・スワイプ等のブラウザ操作を全面封鎖
document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove',  e => e.preventDefault(), { passive: false });
document.addEventListener('touchend',   e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    layoutTurrets();
    layoutBoss();
  }

  const COLORS = {
    red:   { hex: '#ff4d5e', glow: 'rgba(255,77,94,0.6)' },
    blue:  { hex: '#4da3ff', glow: 'rgba(77,163,255,0.6)' },
    green: { hex: '#4dff88', glow: 'rgba(77,255,136,0.6)' }
  };

  // ---- 3辺の囲みレイアウト ----
  // bottom = P1(緑/正面)、left = P2(赤/左辺)、right = P3(青/右辺)
  // inward = そのプレイヤーの発射方向（常に内側=中央向き固定）、tangent = スライド方向
  const EDGES = {
    bottom: { inward: { x: 0,  y: -1 }, tangent: { x: 1, y: 0 } },
    left:   { inward: { x: 1,  y: 0  }, tangent: { x: 0, y: 1 } },
    right:  { inward: { x: -1, y: 0  }, tangent: { x: 0, y: 1 } },
  };
  const GLYPH_ANGLE = { bottom: 0, left: Math.PI/2, right: -Math.PI/2 };
  const EDGE_MARGIN = 50;   // 画面端から自機ラインまでの距離
  const LANE_INSET = 0.16;  // レーン両端の余白（隣の辺と干渉しないように）
  const LANE_HALF_W = 42;   // レーン帯の見た目の太さ(半分)
  const LANE_CAPTURE = 90;  // レーンからこの距離以内ならタッチを捕捉

  const turrets = {
    bottom: { edge: 'bottom', color: 'green', shape: '✌️' },
    left:   { edge: 'left',   color: 'red',   shape: '✊' },
    right:  { edge: 'right',  color: 'blue',  shape: '✋' },
  };
  for (const key in turrets){ turrets[key].dir = EDGES[turrets[key].edge].inward; }

  function laneToXY(lane, pos){
    return lane.axis === 'x' ? { x: pos, y: lane.fixed } : { x: lane.fixed, y: pos };
  }

  function layoutTurrets(){
    const laneDefs = {
      bottom: { axis: 'x', min: W*LANE_INSET, max: W*(1-LANE_INSET), fixed: H - EDGE_MARGIN },
      left:   { axis: 'y', min: H*LANE_INSET, max: H*(1-LANE_INSET), fixed: EDGE_MARGIN },
      right:  { axis: 'y', min: H*LANE_INSET, max: H*(1-LANE_INSET), fixed: W - EDGE_MARGIN },
    };
    for (const key in turrets){
      const t = turrets[key];
      t.lane = laneDefs[key];
      if (t.slidePos === undefined) t.slidePos = (t.lane.min + t.lane.max) / 2;
      t.slidePos = Math.max(t.lane.min, Math.min(t.lane.max, t.slidePos));
      t.home = laneToXY(t.lane, t.slidePos);
      if (!t.state){
        t.state = 'idle';         // idle | outbound | return
        t.charge = 0;
        t.charging = false;
        t.activePointerId = null;
        t.downPos = null;
        t.dragStarted = false;
        t.lastTapTime = 0;
        t.pos = { x: t.home.x, y: t.home.y };
        t.hp = 5;
        t.maxHp = 5;
        t.hitFlash = 0;
        t.fireCooldown = 0;
      } else if (t.state === 'idle'){
        t.pos = { x: t.home.x, y: t.home.y };
      }
    }
  }
  window.addEventListener('resize', resize);

  const TURRET_R = 18;
  const SHIP_R = 15;
  const SPEED = 7.2;
  const FUSION_DIST = 34;
  const TAP_MOVE_THRESHOLD = 9;
  const DOUBLE_TAP_MS = 380;
  const CHARGE_TIME_FRAMES = 255; // ~4.2s at 60fps
  const BULLET_R = 9;
  const HOME_HIT_R = TURRET_R + BULLET_R;
  const SHIP_INTERCEPT_R = SHIP_R + BULLET_R + 2;
  const EXPLODE_FRAMES = 100; // 復帰までの時間 (約1.6秒)
  const PLAYER_BULLET_R = 4;
  const PLAYER_BULLET_SPEED = 9;
  const PLAYER_FIRE_COOLDOWN = 8; // なぞっている間の連射間隔(フレーム)
  // グー(red) > チョキ(green) > パー(blue) > グー(red)
  const BEATS = { red: 'green', green: 'blue', blue: 'red' };

  let fusionCount = 0;
  let particles = [];
  let shockwaves = [];
  let enemyBullets = [];
  let playerBullets = [];
  let enemies = [];
  let alerts = [];
  let enemySpawnTimer = 0;
  let elapsed = 0;
  const colorKeys = ['red','blue','green'];
  const edgeKeys = ['bottom','left','right'];
  const ENEMY_TYPES = ['straight','diagonal','zigzag'];
  const ALERT_FRAMES = 180; // 出現前のカラーアラート表示時間(約3秒)
  const ENEMY_SIZES = {
    small:  { r: 10, speedMult: 0.675, hp: 2 },
    medium: { r: 14, speedMult: 0.5,   hp: 4 },
    large:  { r: 20, speedMult: 0.3,   hp: 7 }
  };
  function pickEnemySize(){
    const r = Math.random();
    if (r < 0.4) return 'small';
    if (r < 0.75) return 'medium';
    return 'large';
  }

  // ---- 中央固定ボス ----
  let boss = null;
  const BOSS_PATTERN_ORDER = ['sequential','stagnant'];
  const BOSS_PATTERN_DURATION = { sequential: 420, stagnant: 480 };
  const BOSS_EXPLODE_FRAMES = 90;

  function arenaCenter(){
    return { x: W*0.5, y: H*0.46 };
  }

  function layoutBoss(){
    const c = arenaCenter();
    if (!boss){
      boss = {
        x: c.x, y: c.y, r: 30,
        hp: 90, maxHp: 90,
        color: colorKeys[Math.floor(Math.random()*3)],
        state: 'active', // active | destroyed
        pattern: 'sequential',
        patternTimer: 0,
        spawnTimer: 0,
        seqAngle: 0,
        hitFlash: 0,
        explodeTimer: 0
      };
    } else {
      boss.x = c.x; boss.y = c.y;
    }
  }

  function triggerExplosion(t){
    t.state = 'destroyed';
    t.explodeTimer = EXPLODE_FRAMES;
    t.pos = { x: t.home.x, y: t.home.y };
    addShockwave(t.home.x, t.home.y, '#ffffff');
    addShockwave(t.home.x, t.home.y, COLORS[t.color].hex);
    burst(t.home.x, t.home.y, COLORS[t.color].hex, 26);
    burst(t.home.x, t.home.y, '#ffffff', 18);
  }

  function burst(x, y, hex, n){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 1.5 + Math.random()*4;
      particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 30, maxLife: 30, hex });
    }
  }
  function addShockwave(x, y, hex){
    shockwaves.push({ x, y, r: 6, maxR: 90, life: 26, maxLife: 26, hex });
  }
  function rotateVec(v, deg){
    const r = deg*Math.PI/180;
    const cos = Math.cos(r), sin = Math.sin(r);
    return { x: v.x*cos - v.y*sin, y: v.x*sin + v.y*cos };
  }

  function distanceToLane(t, x, y){
    const lane = t.lane;
    if (lane.axis === 'x'){
      const dy = Math.abs(y - lane.fixed);
      const dx = x < lane.min ? lane.min - x : x > lane.max ? x - lane.max : 0;
      return Math.hypot(dx, dy);
    } else {
      const dx = Math.abs(x - lane.fixed);
      const dy = y < lane.min ? lane.min - y : y > lane.max ? y - lane.max : 0;
      return Math.hypot(dx, dy);
    }
  }

  function nearestIdleLane(x, y){
    let best = null, bestDist = Infinity;
    for (const key in turrets){
      const t = turrets[key];
      if (t.state !== 'idle' || t.activePointerId !== null) continue;
      const d = distanceToLane(t, x, y);
      if (d <= LANE_CAPTURE && d < bestDist){ bestDist = d; best = key; }
    }
    return best;
  }

  function triggerLaunch(t){
    if (t.state !== 'idle') return;
    t.outSpeed = SPEED + t.charge * 6; // チャージが多いほど往路が速い(=無防備時間が短い)
    t.charge = 0;
    t.charging = false;
    t.state = 'outbound';
    t.pos = { x: t.home.x, y: t.home.y };
  }

  // ---- Pointer events (covers mouse + multitouch on modern browsers) ----
  function findTurretByPointer(pointerId){
    for (const key in turrets){
      if (turrets[key].activePointerId === pointerId) return turrets[key];
    }
    return null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const key = nearestIdleLane(e.clientX, e.clientY);
    if (!key) return;
    const t = turrets[key];
    t.activePointerId = e.pointerId;
    t.downPos = { x: e.clientX, y: e.clientY };
    t.dragStarted = false;
  });

  canvas.addEventListener('pointermove', (e) => {
    const t = findTurretByPointer(e.pointerId);
    if (!t) return;
    const d = Math.hypot(e.clientX - t.downPos.x, e.clientY - t.downPos.y);
    if (d > TAP_MOVE_THRESHOLD) t.dragStarted = true;
    if (t.dragStarted){
      const raw = t.lane.axis === 'x' ? e.clientX : e.clientY;
      t.slidePos = Math.max(t.lane.min, Math.min(t.lane.max, raw));
      t.home = laneToXY(t.lane, t.slidePos);
      if (t.state === 'idle') t.pos = { x: t.home.x, y: t.home.y };
      t.charging = false;
      t.charge = 0;
    }
  });

  function releasePointer(e){
    const t = findTurretByPointer(e.pointerId);
    if (!t) return;
    const now = performance.now();
    if (!t.dragStarted){
      // tap
      if (now - t.lastTapTime < DOUBLE_TAP_MS){
        triggerLaunch(t);
        t.lastTapTime = 0;
      } else {
        t.lastTapTime = now;
      }
    } else {
      t.charging = true;
      t.lastTapTime = 0;
    }
    t.activePointerId = null;
    t.downPos = null;
    t.dragStarted = false;
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);

  // ---- Drawing helpers ----
  function drawLane(t){
    const c = COLORS[t.color];
    const usable = t.state === 'idle';
    const lane = t.lane;
    ctx.save();
    ctx.fillStyle = c.hex;
    ctx.globalAlpha = !usable ? 0.04 : (t.activePointerId !== null ? 0.14 : 0.07);
    if (lane.axis === 'x'){
      ctx.fillRect(lane.min, lane.fixed - LANE_HALF_W, lane.max - lane.min, LANE_HALF_W*2);
    } else {
      ctx.fillRect(lane.fixed - LANE_HALF_W, lane.min, LANE_HALF_W*2, lane.max - lane.min);
    }
    ctx.globalAlpha = usable ? 0.35 : 0.12;
    ctx.strokeStyle = c.hex;
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    if (lane.axis === 'x') ctx.strokeRect(lane.min, lane.fixed - LANE_HALF_W, lane.max - lane.min, LANE_HALF_W*2);
    else ctx.strokeRect(lane.fixed - LANE_HALF_W, lane.min, LANE_HALF_W*2, lane.max - lane.min);
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawAimLine(t){
    const c = COLORS[t.color];
    ctx.save();
    ctx.strokeStyle = c.hex;
    ctx.globalAlpha = t.activePointerId !== null ? 0.9 : 0.35;
    ctx.lineWidth = t.activePointerId !== null ? 3 : 2;
    ctx.setLineDash(t.activePointerId !== null ? [] : [6,6]);
    ctx.beginPath();
    ctx.moveTo(t.home.x, t.home.y);
    ctx.lineTo(t.home.x + t.dir.x*110, t.home.y + t.dir.y*110);
    ctx.stroke();
    ctx.restore();
  }

  function drawChargeRing(t){
    if (t.charge <= 0) return;
    const c = COLORS[t.color];
    ctx.save();
    ctx.strokeStyle = c.hex;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(t.home.x, t.home.y, TURRET_R + 8, -Math.PI/2, -Math.PI/2 + t.charge*Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function drawShapeGlyph(x, y, shape, r, angle){
    ctx.save();
    ctx.translate(x, y);
    if (angle) ctx.rotate(angle);
    ctx.font = Math.round(r*1.35) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(shape, 0, r*0.06);
    ctx.restore();
  }

  function drawTurretBase(t){
    const c = COLORS[t.color];
    if (t.hitFlash > 0) t.hitFlash--;
    const angle = GLYPH_ANGLE[t.edge];
    ctx.save();
    if (t.state === 'idle'){
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = t.activePointerId !== null ? 26 : 14;
      ctx.fillStyle = t.hitFlash > 0 ? '#ffffff' : c.hex;
      ctx.beginPath();
      ctx.arc(t.home.x, t.home.y, TURRET_R, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      drawShapeGlyph(t.home.x, t.home.y, t.shape, TURRET_R, angle);
    } else if (t.state === 'destroyed'){
      // 破壊された跡地 + 復帰までのカウントダウンリング
      const progress = 1 - (t.explodeTimer / EXPLODE_FRAMES);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3,4]);
      ctx.beginPath();
      ctx.arc(t.home.x, t.home.y, TURRET_R, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = c.hex;
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(t.home.x, t.home.y, TURRET_R + 8, -Math.PI/2, -Math.PI/2 + progress*Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('REPAIR', t.home.x, t.home.y + 3);
    } else {
      // empty / vulnerable marker
      ctx.strokeStyle = t.hitFlash > 0 ? '#ffffff' : c.hex;
      ctx.globalAlpha = t.hitFlash > 0 ? 0.9 : 0.35;
      ctx.lineWidth = 2;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.arc(t.home.x, t.home.y, TURRET_R, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('EMPTY', t.home.x, t.home.y + 3);
    }
    ctx.restore();
  }

  function drawShip(t){
    if (t.state === 'idle' || t.state === 'destroyed') return;
    const c = COLORS[t.color];
    ctx.save();
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 22;
    ctx.fillStyle = c.hex;
    ctx.beginPath();
    ctx.arc(t.pos.x, t.pos.y, SHIP_R, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    drawShapeGlyph(t.pos.x, t.pos.y, t.shape, SHIP_R, GLYPH_ANGLE[t.edge]);
    ctx.restore();
    // trail
    particles.push({ x: t.pos.x, y: t.pos.y, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5, life: 12, maxLife: 12, hex: c.hex });
  }

  function updateTurret(t){
    if (t.state === 'destroyed'){
      t.explodeTimer--;
      if (t.explodeTimer <= 0){
        t.hp = t.maxHp;
        t.state = 'idle';
        t.pos = { x: t.home.x, y: t.home.y };
        addShockwave(t.home.x, t.home.y, COLORS[t.color].hex);
        burst(t.home.x, t.home.y, '#ffffff', 16);
      }
      return;
    }
    if (t.charging && t.state === 'idle'){
      t.charge = Math.min(1, t.charge + 1/CHARGE_TIME_FRAMES);
    }
    if (t.state === 'outbound'){
      t.pos.x += t.dir.x * t.outSpeed;
      t.pos.y += t.dir.y * t.outSpeed;
      const margin = SHIP_R + 4;
      if (t.pos.x <= margin || t.pos.x >= W - margin || t.pos.y <= margin || t.pos.y >= H - margin){
        t.pos.x = Math.max(margin, Math.min(W - margin, t.pos.x));
        t.pos.y = Math.max(margin, Math.min(H - margin, t.pos.y));
        t.state = 'return';
      }
    } else if (t.state === 'return'){
      const dx = t.home.x - t.pos.x, dy = t.home.y - t.pos.y;
      const dist = Math.hypot(dx, dy);
      if (dist < SPEED){
        t.pos.x = t.home.x; t.pos.y = t.home.y;
        t.state = 'idle';
        t.charge = 0;
      } else {
        t.pos.x += dx/dist*SPEED;
        t.pos.y += dy/dist*SPEED;
      }
    }
  }

  function spawnAlert(){
    const color = colorKeys[Math.floor(Math.random()*3)];
    const type = ENEMY_TYPES[Math.floor(Math.random()*3)];
    const size = pickEnemySize();
    const edge = edgeKeys[Math.floor(Math.random()*3)];
    const lane = turrets[edge].lane;
    const lanePos = lane.min + Math.random()*(lane.max - lane.min);
    alerts.push({ edge, lanePos, color, type, size, life: ALERT_FRAMES, maxLife: ALERT_FRAMES });
  }

  function spawnEnemyFromAlert(a){
    const speedBase = 1.7 + Math.random()*0.6 + Math.min(elapsed/3200, 1.3);
    const sizeInfo = ENEMY_SIZES[a.size];
    const mult = sizeInfo.speedMult;
    const outward = { x: -EDGES[a.edge].inward.x, y: -EDGES[a.edge].inward.y };
    const tangent = EDGES[a.edge].tangent;
    const c = arenaCenter();
    const lane = turrets[a.edge].lane;
    const laneMid = (lane.min + lane.max) / 2;
    const tanBase = a.lanePos - laneMid; // 予告されていた到達予定地点(接線方向オフセット)
    const enemy = {
      edge: a.edge, type: a.type, color: a.color, size: a.size,
      outward, tangent, tanBase, laneMin: lane.min - laneMid, laneMax: lane.max - laneMid,
      x: c.x, y: c.y, travel: 0, tanOffset: tanBase,
      fireTimer: 40 + Math.random()*30,
      r: sizeInfo.r, hp: sizeInfo.hp, maxHp: sizeInfo.hp
    };
    if (a.type === 'straight'){
      enemy.vOut = (speedBase + 0.7) * mult;
      enemy.vTan = 0;
    } else if (a.type === 'diagonal'){
      enemy.vOut = (speedBase * 0.85) * mult;
      enemy.vTan = (Math.random() < 0.5 ? -1 : 1) * (speedBase * 0.85 + 0.4) * mult;
    } else { // zigzag
      enemy.vOut = (speedBase * 0.65) * mult;
      enemy.phase = Math.random()*Math.PI*2;
      enemy.freq = 0.017;
      enemy.amplitude = Math.min(Math.max(W,H)*0.20, 130);
    }
    enemies.push(enemy);
  }

  function updateEnemySpawning(){
    enemySpawnTimer++;
    const interval = Math.max(48, 130 - Math.floor(elapsed/12)) * 4;
    if (enemySpawnTimer > interval){ enemySpawnTimer = 0; spawnAlert(); }

    alerts.forEach(a => { a.life--; });
    alerts.filter(a => a.life <= 0).forEach(a => spawnEnemyFromAlert(a));
    alerts = alerts.filter(a => a.life > 0);
  }

  function drawAlerts(){
    const c = arenaCenter();
    alerts.forEach(a => {
      const pulse = 0.5 + 0.5*Math.sin(a.life*0.55);
      const col = COLORS[a.color];
      const scale = ENEMY_SIZES[a.size].r / 14;
      const outward = { x: -EDGES[a.edge].inward.x, y: -EDGES[a.edge].inward.y };
      const tangent = EDGES[a.edge].tangent;
      const lane = turrets[a.edge].lane;
      const laneMid = (lane.min + lane.max) / 2;
      const tanBase = (a.lanePos - laneMid) * 0.4; // 着地予定地点をうっすら示す(接線方向)
      const ox = c.x + outward.x*44 + tangent.x*tanBase, oy = c.y + outward.y*44 + tangent.y*tanBase;
      const ang = Math.atan2(-outward.x, outward.y); // 三角形の初期の向き(下向き)を outward に合わせる
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(ang);
      ctx.shadowColor = col.glow;
      ctx.shadowBlur = 14;
      ctx.globalAlpha = 0.55 + 0.35*pulse;
      ctx.fillStyle = col.hex;
      ctx.beginPath();
      ctx.moveTo(0, 12*scale);
      ctx.lineTo(-10*scale, -8*scale);
      ctx.lineTo(10*scale, -8*scale);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });
  }

  function fireEnemyBullets(e){
    const speed = (1.9 + Math.random()*0.7 + Math.min(elapsed/3600, 1.2)) / 3;
    if (e.size === 'large'){
      // 拡散弾幕
      const count = 5;
      const spread = 70; // 度
      for (let i=0;i<count;i++){
        const angleDeg = -spread/2 + (spread/(count-1))*i;
        const d = rotateVec(e.outward, angleDeg);
        enemyBullets.push({
          x: e.x + e.outward.x*12, y: e.y + e.outward.y*12,
          vx: d.x*speed, vy: d.y*speed,
          color: e.color
        });
      }
    } else {
      enemyBullets.push({
        x: e.x + e.outward.x*12, y: e.y + e.outward.y*12,
        vx: e.outward.x*speed, vy: e.outward.y*speed,
        color: e.color
      });
    }
  }

  function updateEnemies(){
    const c = arenaCenter();
    enemies.forEach(e => {
      e.travel += e.vOut;
      if (e.type === 'diagonal'){
        e.tanOffset += e.vTan;
        if (e.tanOffset < e.laneMin || e.tanOffset > e.laneMax) e.vTan *= -1;
        e.tanOffset = Math.max(e.laneMin, Math.min(e.laneMax, e.tanOffset));
      } else if (e.type === 'zigzag'){
        e.tanOffset = e.tanBase + Math.sin(e.travel*e.freq + e.phase) * e.amplitude;
      }
      e.x = c.x + e.outward.x*e.travel + e.tangent.x*e.tanOffset;
      e.y = c.y + e.outward.y*e.travel + e.tangent.y*e.tanOffset;
      e.fireTimer--;
      if (e.fireTimer <= 0 && e.travel > 30){
        fireEnemyBullets(e);
        e.fireTimer = Math.max(26, 60 - Math.floor(elapsed/60)) + (e.size === 'large' ? 20 : 0);
      }
    });
    const limit = Math.max(W,H);
    enemies = enemies.filter(e => e.travel < limit + 40 && !e.dead);
  }

  function drawEnemies(){
    enemies.forEach(e => {
      const c = COLORS[e.color];
      ctx.save();
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = 16;
      ctx.fillStyle = c.hex;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = Math.round(e.r*0.8) + 'px sans-serif';
      ctx.textAlign = 'center';
      const label = e.type === 'straight' ? '➤' : e.type === 'diagonal' ? '➘' : '〜';
      ctx.fillText(label, e.x, e.y+3);
      ctx.restore();

      // HPバー(耐久値が2以上の個体のみ表示)
      if (e.maxHp > 1){
        const barW = e.r*1.8;
        const bx = e.x - barW/2;
        const by = e.y - e.r - 9;
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(bx, by, barW, 3);
        ctx.fillStyle = c.hex;
        ctx.fillRect(bx, by, barW * (e.hp/e.maxHp), 3);
        ctx.restore();
      }
    });
  }

  // --- ボス弾幕パターン ---
  function fireSequentialShot(){
    const color = colorKeys[Math.floor(Math.random()*3)];
    const speed = (5.2 + Math.min(elapsed/6000, 1.3)) / 3;
    const rad = boss.seqAngle * Math.PI/180;
    enemyBullets.push({
      x: boss.x, y: boss.y,
      vx: Math.cos(rad)*speed, vy: Math.sin(rad)*speed,
      color
    });
    boss.seqAngle += 9; // 中央から全方位へゆっくり回転しながら発射
    if (boss.seqAngle >= 360) boss.seqAngle -= 360;
  }

  function spawnStagnantCluster(){
    const color = colorKeys[Math.floor(Math.random()*3)];
    const c = arenaCenter();
    const count = 8;
    for (let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const dist = 70 + Math.random()*90;
      const x = c.x + Math.cos(ang)*dist;
      const y = c.y + Math.sin(ang)*dist;
      enemyBullets.push({
        x, y,
        vx: (Math.random()-0.5)*0.2,
        vy: (Math.random()-0.5)*0.2,
        color,
        lingerTimer: 110 + Math.floor(Math.random()*20),
        released: false,
        releaseAng: ang
      });
    }
  }

  function triggerBossExplosion(){
    boss.state = 'destroyed';
    boss.explodeTimer = BOSS_EXPLODE_FRAMES;
    addShockwave(boss.x, boss.y, '#ffffff');
    addShockwave(boss.x, boss.y, COLORS[boss.color].hex);
    burst(boss.x, boss.y, COLORS[boss.color].hex, 34);
    burst(boss.x, boss.y, '#ffffff', 22);
  }

  function updateBoss(){
    if (!boss) return;
    if (boss.hitFlash > 0) boss.hitFlash--;

    if (boss.state === 'destroyed'){
      boss.explodeTimer--;
      if (boss.explodeTimer <= 0){
        boss.hp = boss.maxHp;
        boss.state = 'active';
        boss.pattern = 'sequential';
        boss.patternTimer = 0;
        boss.spawnTimer = 0;
        boss.seqAngle = 0;
        addShockwave(boss.x, boss.y, COLORS[boss.color].hex);
        burst(boss.x, boss.y, '#ffffff', 18);
      }
      return;
    }

    boss.patternTimer++;
    const duration = BOSS_PATTERN_DURATION[boss.pattern];
    if (boss.patternTimer > duration){
      const idx = BOSS_PATTERN_ORDER.indexOf(boss.pattern);
      boss.pattern = BOSS_PATTERN_ORDER[(idx+1) % BOSS_PATTERN_ORDER.length];
      boss.patternTimer = 0;
      boss.spawnTimer = 999; // 切り替え直後に即スポーンさせる
      if (boss.pattern === 'sequential'){ boss.seqAngle = 0; }
    }

    boss.spawnTimer++;
    if (boss.pattern === 'sequential'){
      if (boss.spawnTimer > 12){ boss.spawnTimer = 0; fireSequentialShot(); }
    } else if (boss.pattern === 'stagnant'){
      if (boss.spawnTimer > 240){ boss.spawnTimer = 0; spawnStagnantCluster(); }
    }
  }

  const PATTERN_LABEL = { sequential: '全方位', stagnant: '滞留' };

  function drawBoss(){
    if (!boss) return;
    const c = COLORS[boss.color];
    ctx.save();
    if (boss.state === 'active'){
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = 24;
      ctx.fillStyle = boss.hitFlash > 0 ? '#ffffff' : c.hex;
      ctx.beginPath();
      ctx.arc(boss.x, boss.y, boss.r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(PATTERN_LABEL[boss.pattern] || '', boss.x, boss.y + boss.r + 16);

      // HPバー
      const barW = boss.r*2.4;
      const bx = boss.x - barW/2, by = boss.y - boss.r - 14;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(bx, by, barW, 5);
      ctx.fillStyle = c.hex;
      ctx.fillRect(bx, by, barW*(boss.hp/boss.maxHp), 5);
    } else {
      const progress = 1 - (boss.explodeTimer / BOSS_EXPLODE_FRAMES);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3,4]);
      ctx.beginPath();
      ctx.arc(boss.x, boss.y, boss.r, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = c.hex;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(boss.x, boss.y, boss.r+10, -Math.PI/2, -Math.PI/2 + progress*Math.PI*2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('REPAIR', boss.x, boss.y + 4);
    }
    ctx.restore();
  }

  function drawHpPips(t){
    const c = COLORS[t.color];
    const total = t.maxHp;
    const spacing = 10;
    ctx.save();
    if (t.lane.axis === 'x'){
      const startX = t.home.x - (total-1)*spacing/2;
      const y = t.home.y - TURRET_R - 14;
      for (let i=0;i<total;i++){
        ctx.beginPath();
        ctx.arc(startX + i*spacing, y, 3.2, 0, Math.PI*2);
        ctx.fillStyle = i < t.hp ? c.hex : 'rgba(255,255,255,0.15)';
        ctx.fill();
      }
    } else {
      const startY = t.home.y - (total-1)*spacing/2;
      const x = t.home.x + (t.edge === 'left' ? TURRET_R+14 : -(TURRET_R+14));
      for (let i=0;i<total;i++){
        ctx.beginPath();
        ctx.arc(x, startY + i*spacing, 3.2, 0, Math.PI*2);
        ctx.fillStyle = i < t.hp ? c.hex : 'rgba(255,255,255,0.15)';
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function updateEnemyBullets(){
    enemyBullets.forEach(b => {
      if (b.lingerTimer !== undefined){
        if (b.lingerTimer > 0){
          b.lingerTimer--;
        } else if (!b.released){
          b.released = true;
          const releaseSpeed = 1.2;
          b.vx = Math.cos(b.releaseAng)*releaseSpeed;
          b.vy = Math.sin(b.releaseAng)*releaseSpeed;
        }
      }
      b.x += (b.vx || 0);
      b.y += b.vy;
      if (b.dead) return;

      // 1. 味方の飛翔中の機体が触れたら迎撃(支援)
      for (const key in turrets){
        const t = turrets[key];
        if (t.state !== 'outbound' && t.state !== 'return') continue;
        if (Math.hypot(t.pos.x-b.x, t.pos.y-b.y) < SHIP_INTERCEPT_R){
          b.dead = true;
          burst(b.x, b.y, COLORS[t.color].hex, 8);
          burst(b.x, b.y, '#ffffff', 4);
          return;
        }
      }
      if (b.dead) return;

      // 2. 砲台(在/不在、現在のスライド位置)への到達判定
      for (const key in turrets){
        const t = turrets[key];
        if (t.state === 'destroyed') continue;
        if (Math.hypot(t.home.x-b.x, t.home.y-b.y) < HOME_HIT_R){
          b.dead = true;
          if (t.state === 'idle' && t.color === b.color){
            // 同色は無害吸収
            burst(b.x, b.y, '#ffffff', 6);
          } else {
            // 異色ヒット、または不在(EMPTY)への直撃
            t.hp = Math.max(0, t.hp - 1);
            t.hitFlash = 14;
            burst(b.x, b.y, COLORS[b.color].hex, 14);
            if (t.hp <= 0){ triggerExplosion(t); }
          }
          return;
        }
      }
    });
    enemyBullets = enemyBullets.filter(b => !b.dead && b.x > -600 && b.x < W+600 && b.y > -600 && b.y < H+600);
  }

  function drawEnemyBullets(){
    enemyBullets.forEach(b => {
      const pulsing = b.lingerTimer > 0;
      const r = pulsing ? BULLET_R * (1 + 0.15*Math.sin(elapsed*0.15 + b.x)) : BULLET_R;
      ctx.save();
      ctx.shadowColor = COLORS[b.color].glow;
      ctx.shadowBlur = pulsing ? 18 : 12;
      ctx.fillStyle = COLORS[b.color].hex;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  function updatePlayerFiring(t){
    if (t.dragStarted && t.state === 'idle'){
      t.fireCooldown--;
      if (t.fireCooldown <= 0){
        playerBullets.push({
          x: t.home.x + t.dir.x*(TURRET_R+6),
          y: t.home.y + t.dir.y*(TURRET_R+6),
          vx: t.dir.x*PLAYER_BULLET_SPEED,
          vy: t.dir.y*PLAYER_BULLET_SPEED,
          color: t.color
        });
        t.fireCooldown = PLAYER_FIRE_COOLDOWN;
      }
    } else {
      t.fireCooldown = Math.min(t.fireCooldown, 2); // 離したらほぼ即座に撃てる状態に戻す
    }
  }

  function resolveEnemyHit(pb, en){
    if (BEATS[pb.color] === en.color){
      // 勝ち: ダメージ2、自機弾は貫通継続
      en.hp -= 2;
      burst(pb.x, pb.y, COLORS[pb.color].hex, 6);
    } else if (pb.color === en.color){
      // あいこ: ダメージ1、自機弾は消える
      en.hp -= 1;
      pb.dead = true;
      burst(pb.x, pb.y, '#ffffff', 8);
    } else {
      // 負け: ダメージ0、自機弾は消える
      pb.dead = true;
      burst(pb.x, pb.y, COLORS[en.color].hex, 8);
    }
    if (en.hp <= 0 && !en.dead){
      en.dead = true;
      addShockwave(en.x, en.y, COLORS[en.color].hex);
      addShockwave(en.x, en.y, '#ffffff');
      burst(en.x, en.y, COLORS[en.color].hex, 22);
    }
  }

  function resolveBossHit(pb){
    if (BEATS[pb.color] === boss.color){
      boss.hp -= 2;
      boss.hitFlash = 8;
      burst(pb.x, pb.y, COLORS[pb.color].hex, 6);
    } else if (pb.color === boss.color){
      boss.hp -= 1;
      boss.hitFlash = 8;
      pb.dead = true;
      burst(pb.x, pb.y, '#ffffff', 8);
    } else {
      pb.dead = true;
      burst(pb.x, pb.y, COLORS[boss.color].hex, 8);
    }
    if (boss.hp <= 0 && boss.state === 'active'){
      triggerBossExplosion();
    }
  }

  function updatePlayerBullets(){
    playerBullets.forEach(pb => {
      pb.x += pb.vx; pb.y += pb.vy;
      if (pb.dead) return;
      for (const eb of enemyBullets){
        if (eb.dead) continue;
        if (Math.hypot(pb.x-eb.x, pb.y-eb.y) < PLAYER_BULLET_R + BULLET_R){
          const mx = (pb.x+eb.x)/2, my = (pb.y+eb.y)/2;
          if (pb.color === eb.color){
            // 同色 = あいこで対消滅
            pb.dead = true; eb.dead = true;
            burst(mx, my, '#ffffff', 8);
          } else if (BEATS[pb.color] === eb.color){
            // 自機弾の勝ち: 相手を消して貫通継続
            eb.dead = true;
            burst(eb.x, eb.y, COLORS[pb.color].hex, 8);
          } else {
            // 自機弾の負け: 自分が消される
            pb.dead = true;
            burst(pb.x, pb.y, COLORS[eb.color].hex, 8);
          }
          break;
        }
      }
      if (pb.dead) return;
      for (const en of enemies){
        if (en.dead) continue;
        if (Math.hypot(pb.x-en.x, pb.y-en.y) < en.r + PLAYER_BULLET_R){
          resolveEnemyHit(pb, en);
          if (pb.dead) break;
        }
      }
      if (pb.dead) return;
      if (boss && boss.state === 'active' && Math.hypot(pb.x-boss.x, pb.y-boss.y) < boss.r + PLAYER_BULLET_R){
        resolveBossHit(pb);
      }
    });
    playerBullets = playerBullets.filter(pb => !pb.dead && pb.x > -20 && pb.x < W+20 && pb.y > -20 && pb.y < H+20);
    enemies = enemies.filter(en => !en.dead);
  }

  function drawPlayerBullets(){
    playerBullets.forEach(pb => {
      ctx.save();
      ctx.shadowColor = COLORS[pb.color].glow;
      ctx.shadowBlur = 8;
      ctx.fillStyle = COLORS[pb.color].hex;
      ctx.beginPath();
      ctx.arc(pb.x, pb.y, PLAYER_BULLET_R, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  function checkFusions(){
    const keys = Object.keys(turrets).filter(k => turrets[k].state === 'outbound');
    for (let i=0;i<keys.length;i++){
      for (let j=i+1;j<keys.length;j++){
        const a = turrets[keys[i]], b = turrets[keys[j]];
        const d = Math.hypot(a.pos.x-b.pos.x, a.pos.y-b.pos.y);
        if (d < FUSION_DIST){
          const mx = (a.pos.x+b.pos.x)/2, my = (a.pos.y+b.pos.y)/2;
          addShockwave(mx, my, '#ffffff');
          burst(mx, my, COLORS[a.color].hex, 10);
          burst(mx, my, COLORS[b.color].hex, 10);
          a.state = 'idle'; a.charge = 0; a.pos = {x:a.home.x,y:a.home.y};
          b.state = 'idle'; b.charge = 0; b.pos = {x:b.home.x,y:b.home.y};
          fusionCount++;
          document.getElementById('fusionCount').textContent = 'FUSION: ' + fusionCount;
        }
      }
    }
  }

  function loop(){
    elapsed++;
    ctx.fillStyle = 'rgba(6,6,12,0.4)';
    ctx.fillRect(0,0,W,H);

    for (const key in turrets){
      const t = turrets[key];
      drawLane(t);
      if (t.state === 'idle'){
        drawAimLine(t);
        drawChargeRing(t);
      }
      updateTurret(t);
      updatePlayerFiring(t);
      drawTurretBase(t);
      drawHpPips(t);
      drawShip(t);
    }
    checkFusions();

    updateBoss();
    drawBoss();

    updateEnemySpawning();
    drawAlerts();
    updateEnemies();
    drawEnemies();
    updateEnemyBullets();
    updatePlayerBullets();
    enemyBullets = enemyBullets.filter(b => !b.dead);
    drawEnemyBullets();
    drawPlayerBullets();

    // shockwaves
    shockwaves.forEach(s => {
      s.r += (s.maxR - s.r) * 0.18;
      s.life--;
      ctx.save();
      ctx.globalAlpha = Math.max(0, s.life / s.maxLife) * 0.8;
      ctx.strokeStyle = s.hex;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    });
    shockwaves = shockwaves.filter(s => s.life > 0);

    // particles
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.life--;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * 0.8;
      ctx.fillStyle = p.hex;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
    particles = particles.filter(p => p.life > 0);

    requestAnimationFrame(loop);
  }
  resize();
  loop();
})();
</script>

<script>
// オフラインで遊べるようにキャッシュを準備するService Workerを登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch((err) => {
      console.warn('[sw] register failed:', err);
    });
  });
}
</script>
