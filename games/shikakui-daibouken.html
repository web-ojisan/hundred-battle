<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しかくいせかいの大ぼうけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout: one narrow column like a handheld game screen: side-view picture, story text, big choice blocks */
:root{
  color-scheme: light;
  --soil:#3b2a1d;        /* page background, dug earth */
  --paper:#fff6dc;       /* story panel */
  --ink:#2a2118;         /* text */
  --grass:#4f9a34;       /* primary action */
  --grass-dark:#35701f;
  --stone:#8d949c;       /* secondary */
  --lava:#d9432c;        /* wrong answer, lost fight */
  --gold:#ffd447;        /* rewards */
  --font-display:"DotGothic16","Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{
  background:var(--soil);
  background-image:
    linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),
    linear-gradient(90deg,rgba(0,0,0,.12) 2px,transparent 2px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:500;
  padding:16px;
}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--paper)}
h1{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.endings{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:14px}
.endings i{width:16px;height:16px;background:#5a4635;border:2px solid #241910;display:block}
.endings i.on{background:var(--gold)}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;border:4px solid #1a120b}
.panel{background:var(--paper);border:4px solid #1a120b;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px}
.badge{font-family:var(--font-display);font-size:20px;background:var(--gold);border:3px solid #1a120b;padding:4px 10px;align-self:flex-start}
.badge.miss{background:var(--lava);color:#fff}
.story{font-size:21px;line-height:2.3;display:flex;flex-direction:column;gap:6px}
.story p{margin:0}
.story p.sign{background:#c79a5b;border:3px solid #6b4423;padding:2px 12px;font-family:var(--font-display);font-size:22px;align-self:flex-start}
.hint{font-size:18px;line-height:2.2;border-top:3px dashed #c9b88a;padding-top:8px;display:flex;flex-direction:column;gap:4px}
.hint p{margin:0}
ruby{ruby-position:over}
rt{font-size:.5em;font-weight:700;color:#7a4a1e;user-select:none}
ruby.hid{border-bottom:3px dotted var(--stone);cursor:pointer}
ruby.hid rt{visibility:hidden}
ruby.hid.peek rt{visibility:visible}
.items{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:15px;min-height:34px}
.items .group{display:flex;align-items:center;gap:6px}
.items .chip{font-family:var(--font-display);font-size:18px;background:#e7dcb8;border:2px solid #1a120b;padding:0 8px;line-height:1.6}
.items .chip.gem{background:var(--gold)}
.items .chip.mat{background:#cfe3c2}
.items .chip.num{background:#1a120b;color:var(--gold);min-width:1.6em;text-align:center}
.hearts{display:flex;gap:3px;flex-wrap:wrap}
.hearts i{width:18px;height:18px;border:2px solid #1a120b;background:var(--lava);display:block}
.hearts i.off{background:#e7dcb8}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools:empty{display:none}
.tool{font-size:17px;font-weight:700;line-height:2;background:var(--gold);border:3px solid #1a120b;padding:2px 10px}
.tool[disabled]{opacity:.45;cursor:default}
.tag{display:block;width:fit-content;font-size:16px;line-height:2;background:#1a120b;color:var(--gold);padding:0 8px;margin-top:2px}
.tag rt{color:var(--gold)}
.bookbtn{font-family:var(--font-display);font-size:16px;line-height:2;background:var(--gold);color:var(--ink);border:3px solid #1a120b;padding:0 10px}
.book{gap:4px}
.book h2{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:2;margin:0}
.book h3{font-family:var(--font-display);font-weight:400;font-size:18px;line-height:2;margin:10px 0 0;background:#e7dcb8;padding:0 8px}
.entry{display:flex;flex-direction:column;border-bottom:2px dashed #c9b88a;padding:4px 0}
.entry .nm{font-size:20px;font-weight:700;line-height:2.1}
.entry .ds{font-size:16px;line-height:2.1}
.entry.locked .nm{font-family:var(--font-display);color:var(--stone)}
.book .choice{margin-top:12px}
.choices{display:flex;flex-direction:column;gap:10px}
button{font-family:inherit;color:inherit;cursor:pointer}
.choice{
  font-size:21px;font-weight:700;line-height:2.1;text-align:left;
  background:var(--grass);color:#fff;border:4px solid #1a120b;
  box-shadow:inset 0 -6px 0 var(--grass-dark), inset 0 4px 0 rgba(255,255,255,.25);
  padding:6px 16px 12px;
}
.choice rt{color:#eaffd9}
.choice.quiz{font-size:30px;letter-spacing:.04em}
.choice.back{background:var(--stone);box-shadow:inset 0 -6px 0 #5d646c, inset 0 4px 0 rgba(255,255,255,.25)}
.choice.next{background:#2f6fb0;box-shadow:inset 0 -6px 0 #1f4f80, inset 0 4px 0 rgba(255,255,255,.25)}
.choice.next small{font-family:var(--font-display);font-size:15px;font-weight:400;margin-left:8px}
.choice.done{background:var(--stone);box-shadow:none;cursor:default;opacity:.8}
.tag.mark{background:#fff6dc;color:var(--ink)}
.choice:active{transform:translateY(2px)}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
footer{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;color:var(--paper);font-size:14px}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg button,.reset{font-size:14px;background:#5a4635;color:var(--paper);border:2px solid #1a120b;padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.back-link{color:var(--gold);font-size:16px;line-height:2;align-self:flex-start}
.note{color:#d9c9a8;font-size:13px;line-height:1.7;margin:0}
@media (max-width:400px){
  .story{font-size:19px}.choice{font-size:19px}.choice.quiz{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.choice:active{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>しかくいせかいの 大ぼうけん</h1>
    <div class="endings" id="endings" aria-label="みつけた おわりかた"></div>
    <button type="button" class="bookbtn" id="bookbtn"></button>
  </header>

  <canvas id="art" width="320" height="160" role="img" aria-label="ばめんの え"></canvas>

  <section class="panel" id="main" aria-live="polite">
    <div id="badge" class="badge" hidden></div>
    <div id="story" class="story"></div>
    <div id="hint" class="hint" hidden></div>
    <div class="items" id="items"></div>
    <div class="tools" id="tools"></div>
    <div class="choices" id="choices"></div>
  </section>

  <section class="panel book" id="book" hidden></section>

  <footer>
    <div class="seg" role="group" aria-label="ふりがな">
      <span>ふりがな</span>
      <button type="button" id="ruby-auto" data-mode="auto">じどう</button>
      <button type="button" id="ruby-always" data-mode="always">いつも</button>
      <button type="button" id="ruby-never" data-mode="never">なし</button>
    </div>
    <button type="button" class="reset" id="reset">きろくを ぜんぶ けす</button>
  </footer>
  <a href="../index.html" class="back-link">← ゲームせんたくにもどる</a>
  <p class="note">おうちの方へ:たびの きろくは この たんまつに のこり、さいごの しょうの ないようが かわります。かてない あいてからは にげて、べつの ばしょで ざいりょうを さがすか、村で ぶきを つくれます。体力が なくなると ざいりょうと アイテムを おとし、ベッドで 休んで いなければ 出発地点に もどります。おとした ざいりょうは 村で かえって きます。「じどう」では、もんだいで せいかいした かん字の ふりがなが つぎから きえます。てん線の ことばは タッチすると ふりがなが 出ます。</p>
</main>

<script>
/* ---------- helpers that read the journey so far ---------- */
const AREAS=['forest','desert','snow','cave'];
const AREA_NAME={forest:'{森|もり}',desert:'{砂原|すなはら}',snow:'{雪山|ゆきやま}',cave:'{洞窟|どうくつ}'};
const PAL={forest:'{犬|いぬ}',desert:'{鳥|とり}',snow:'{雪|ゆき}だるま',cave:'{骸骨|がいこつ}'};
const PAL_CHIP={forest:'犬',desert:'鳥',snow:'雪だるま',cave:'骸骨'};
const COUNT=['','{一|いっ}こ','{二|に}こ','{三|さん}こ','{四|よん}こ'];
const WEAPON={
  wood:{name:'{木|き}の {剣|けん}',atk:2,need:['木'],hit:'{木|き}の {剣|けん}で、{王|おう}の {足|あし}を ぽかりと たたいた。\n{王|おう}は ぴょんぴょん とびはねた。'},
  bow:{name:'{金|きん}の {弓矢|ゆみや}',atk:3,need:['木','金'],hit:'{金|きん}の {矢|や}が {光|ひか}って とび、{王|おう}の {冠|かんむり}を はじきとばした。'},
  spear:{name:'{氷|こおり}の {槍|やり}',atk:3,need:['木','こおり'],hit:'{氷|こおり}の {槍|やり}を ゆかに つきさすと、ゆかが こおって、{王|おう}は つるんと ころんだ。'},
  sword:{name:'{鉱石|こうせき}の {剣|けん}',atk:4,need:['木','鉱石'],hit:'{鉱石|こうせき}の {剣|けん}が きらりと {光|ひか}り、{王|おう}の マントを まっぷたつに した。'}
};
const ARMOR={
  shield:{name:'{木|き}の {盾|たて}',def:1,need:['木']},
  gold:{name:'{金|きん}の {鎧|よろい}',def:2,need:['金']},
  ore:{name:'{鉱石|こうせき}の {鎧|よろい}',def:3,need:['金','鉱石']}
};
const BASEHP=3;
const atk=r=>WEAPON[r.weapon]?WEAPON[r.weapon].atk:1;
const def=r=>ARMOR[r.armor]?ARMOR[r.armor].def:0;
const maxHp=r=>BASEHP+def(r);

/* ---------- picture book: a record that survives new journeys ---------- */
const MATR={'木':'{木|き}','金':'{金|きん}','こおり':'{氷|こおり}','鉱石':'{鉱石|こうせき}'};
const recipe=x=>x.need.map(m=>MATR[m]).join('と ')+'で つくれる。';
const BOOK=[
  {title:'ぶき',items:Object.keys(WEAPON).map(id=>({id:'w_'+id,name:WEAPON[id].name,
    desc:'{攻撃力|こうげきりょく} '+WEAPON[id].atk+'。'+recipe(WEAPON[id]),hint:recipe(WEAPON[id])}))},
  {title:'ぼうぐ',items:Object.keys(ARMOR).map(id=>({id:'a_'+id,name:ARMOR[id].name,
    desc:'{防御力|ぼうぎょりょく} '+ARMOR[id].def+'。'+recipe(ARMOR[id]),hint:recipe(ARMOR[id])}))},
  {title:'{仲間|なかま}',items:[
    {id:'p_forest',name:'{犬|いぬ}',desc:'{森|もり}の しげみで ふるえていた。{川|かわ}の あさい ところを {見|み}つける。',hint:'{森|もり}に いる。'},
    {id:'p_desert',name:'{赤|あか}い {鳥|とり}',desc:'はねを いためていた。{空|そら}から {泉|いずみ}を {見|み}つける。',hint:'{砂原|すなはら}に いる。'},
    {id:'p_snow',name:'{雪|ゆき}だるま',desc:'さびしがりや。{雪|ゆき}で {階段|かいだん}を つくる。',hint:'{雪山|ゆきやま}に いる。'},
    {id:'p_cave',name:'{骸骨|がいこつ}',desc:'{蜘蛛|くも}が こわい。{溶岩|ようがん}の あつさは へいき。',hint:'{洞窟|どうくつ}に いる。'}]},
  {title:'ばんにんと {王|おう}',items:[
    {id:'g_cave',name:'{大|おお}{蜘蛛|ぐも}',desc:'つよさ 2。{腐|くさ}った {肉|にく}が だいすき。',hint:'{洞窟|どうくつ}の {宝箱|たからばこ}を まもっている。かつと のる。'},
    {id:'g_snow',name:'{氷|こおり}{男|おとこ}',desc:'つよさ 3。{火|ひ}と まぶしい {光|ひかり}が にがて。',hint:'{雪山|ゆきやま}の さかの {上|うえ}に いる。かつと のる。'},
    {id:'g_desert',name:'{火|ひ}とかげ',desc:'つよさ 4。つめたい ものが にがて。',hint:'{砂原|すなはら}の {泉|いずみ}を まもっている。かつと のる。'},
    {id:'g_king',name:'カゲぼうずの {王|おう}',desc:'つよさ 3。ほんとうは さびしがりや。',hint:'{空|そら}の {城|しろ}に いる。{旅|たび}を おえると のる。'}]},
  {title:'おわりかた',items:[
    {id:'e_end_team',name:'{仲間|なかま}エンド',desc:'{仲間|なかま}を {二人|ふたり}いじょう つれて、{王|おう}に かった。',hint:'{仲間|なかま}を {二人|ふたり}いじょう つれて、{王|おう}に かつ。'},
    {id:'e_end_pair',name:'{相棒|あいぼう}エンド',desc:'{仲間|なかま}を {一人|ひとり}だけ つれて、{王|おう}に かった。',hint:'{仲間|なかま}を {一人|ひとり}だけ つれて、{王|おう}に かつ。'},
    {id:'e_end_solo',name:'ひとり{旅|たび}エンド',desc:'だれも つれずに、{王|おう}に かった。',hint:'だれも つれずに、{王|おう}に かつ。'},
    {id:'e_end_friend',name:'ともだちエンド',desc:'{王|おう}の はなしを きいた。',hint:'たたかわずに おわる {道|みち}が ある。'}]}
];
const ENTRIES=BOOK.flatMap(s=>s.items);
const GUARD={d5:'g_desert',s5:'g_snow',c5:'g_cave'};
const isDone=(r,a)=>!!(r.areas[a]&&r.areas[a].done);
const isReached=(r,a)=>!!(r.areas[a]&&r.areas[a].reached&&!r.areas[a].done);
const doneAreas=r=>AREAS.filter(a=>isDone(r,a));
const pals=r=>AREAS.filter(a=>r.areas[a]&&r.areas[a].comp);
const palNames=r=>pals(r).map(a=>PAL[a]).join('と ');
const has=(r,m)=>r.mats.includes(m);
const tool=r=>WEAPON[r.weapon]||null;

function epilogue(r){
  const left=AREAS.filter(a=>!isDone(r,a));
  const lines=[];
  lines.push(left.length
    ? 'とおくに、まだ かけらを {見|み}つけていない '+left.map(a=>AREA_NAME[a]).join('と ')+'が {見|み}える。つぎの {旅|たび}で いってみよう。'
    : '{世界|せかい}の すみずみまで、ぜんぶ あかるく なった。');
  lines.push(r.misses===0
    ? 'かん{字|じ}を {一|ひと}つも まちがえなかった。きみは かん{字|じ}めいじんだ!'
    : 'まちがえた かん{字|じ}も、もう おぼえたね。');
  lines.push('{攻撃力|こうげきりょく} '+atk(r)+'、{防御力|ぼうぎょりょく} '+def(r)+'で {旅|たび}を おえた。');
  if(r.kos===0) lines.push('いちども たおれずに {旅|たび}を おえた。きみは {強|つよ}い!');
  return lines.join('\n');
}

/* ---------- story data ---------- */
const ENDINGS=['end_team','end_pair','end_solo','end_friend'];

const NODES={
  hub:{art:'map',
    text:r=>{
      const n=doneAreas(r).length;
      const fled=AREAS.some(a=>isReached(r,a));
      const L=[];
      if(n===0&&!fled) L.push('ここは しかくい ブロックの {世界|せかい}。','カゲぼうずの {王|おう}が、{空|そら}の {城|しろ}から {世界|せかい}を くらく しようと している。','かけらを {二|ふた}つ あつめると、{城|しろ}への みちが ひらく。');
      else if(n===0) L.push('かけらは まだ ない。');
      else L.push('かけらは いま '+COUNT[n]+'。');
      if(n>=2) L.push('{空|そら}の {城|しろ}への みちが ひらいた!');
      if(fled) L.push('にげて きた ばしょには、{材料|ざいりょう}を もって もどれる。');
      if(r.dropped.length) L.push('おとした {材料|ざいりょう}は、{村|むら}に あるかも しれない。');
      L.push('どこへ いく?');
      return L.join('\n');
    },
    choices:r=>{
      const c=[];
      if(!isDone(r,'forest')) c.push({t:'{森|もり}へ いく',to:'f1'});
      if(!isDone(r,'desert')) c.push(isReached(r,'desert')?{t:'{砂原|すなはら}に もどる',to:'d5'}:{t:'{砂原|すなはら}へ いく',to:'d1'});
      if(!isDone(r,'snow')) c.push(isReached(r,'snow')?{t:'{雪山|ゆきやま}に もどる',to:'s5'}:{t:'{雪山|ゆきやま}へ いく',to:'s1'});
      if(!isDone(r,'cave')) c.push(isReached(r,'cave')?{t:'{洞窟|どうくつ}に もどる',to:'c5'}:{t:'{洞窟|どうくつ}へ いく',to:'c1'});
      if(doneAreas(r).length>=2) c.push({t:'{空|そら}の {城|しろ}へ いく',to:'z1'});
      c.push({t:'{村|むら}へ いく',to:'v1'});
      return c;
    }},

  ko:{art:'map',lose:'たおれた!',heal:true,
    text:r=>'{体力|たいりょく}が なくなって、きみは たおれた……。\n'+
      (r.bed==='v1'?'きがつくと、{村|むら}の やどやの ベッドの {上|うえ}だった。'
        :r.bed?'きがつくと、{小屋|こや}の ベッドの {上|うえ}だった。'
        :'きがつくと、{旅|たび}を はじめた {世界地図|せかいちず}の まえだった。\nベッドで {休|やす}んで いなかったからだ。')+
      (r.lost?'\nもっていた {材料|ざいりょう}や アイテムは、おとして しまった。\n{材料|ざいりょう}は {村人|むらびと}が ひろって くれている かも しれない。':'')+
      '\nぶきと ぼうぐと かけらは ぶじだ。{体力|たいりょく}も ぜんぶ もどった。',
    choices:r=>r.bed?[{t:'ベッドから おきあがる',to:r.bed}]:[{t:'たちあがる',to:'hub'}]},

  /* forest: material 木 */
  f1:{art:'forest',
    text:'{森|もり}に ついた。{木|き}が たくさん ある。\nまずは {材料|ざいりょう}が いる。「き」を きろう。\nどっちの「き」?',
    choices:[{t:'木を きる',quiz:true,to:'f2',learn:'木'},{t:'気を きる',quiz:true,to:'f1m'}]},
  f1m:{art:'forest',miss:true,back:'f1',
    text:'「気」は きもちの「気」。\nきろうと しても きれない!\nきみの やる気が ちょっと へった……。'},
  f2:{art:'forestNpc',mat:'木',
    text:'{木|き}を きって、{材料|ざいりょう}の {木|き}を {手|て}に {入|い}れた!\nしげみの {中|なか}で、{小|ちい}さな {犬|いぬ}が ふるえている。',
    choices:[{t:'{犬|いぬ}を {仲間|なかま}に する',to:'f3c'},{t:'ひとりで さきへ いく',to:'f3s'},{t:'しげみの {薬草|やくそう}を つむ',pick:'herb',once:'f2herb'}]},
  f3c:{art:'river',join:'forest',
    text:'{犬|いぬ}は しっぽを ふって ついてきた。\n{大|おお}きな {川|かわ}が みちを ふさいでいる。\n{犬|いぬ}が あさい ところを {見|み}つけて、ワン!と ないた。',
    choices:[{t:'{犬|いぬ}に ついて {川|かわ}を わたる',to:'f4'}]},

function palHint(r,key){
  const ps=pals(r);
  return ps.length
    ? '{仲間|なかま}の '+PAL[ps[0]]+'が、きみに ささやいた。\n「'+HINT[key]+'」\n'
    : 'おしえて くれる {仲間|なかま}は いない。じぶんで かんがえよう。\n';
}
function guard(key,first,second,strength,again){
  return r=>{
    const tail=palHint(r,key)+'そばの {小屋|こや}には ベッドが ある。\nもっている {材料|ざいりょう}や ぶきで、どうする?';
    return r.again?[again+'\n'+strength+'\n'+tail]:[first,second+'\n'+strength,tail];
  };
}

}

/* ---------- ruby rendering ---------- */
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hideRuby(word){
  if(save.mode==='always') return false;
  if(save.mode==='never') return true;
  return [...word].every(ch=>save.known[ch]);
}
function rubyHtml(s){
  return esc(s).replace(/\{([^|}]+)\|([^}]+)\}/g,(m,w,r)=>
    '<ruby'+(hideRuby(w)?' class="hid" tabindex="0"':'')+'>'+w+'<rt>'+r+'</rt></ruby>');
}
function linesHtml(s){
  return s.split('\n').map(line=>{
    const sign=/^【.*】$/.test(line);
    return '<p'+(sign?' class="sign"':'')+'>'+rubyHtml(sign?line.slice(1,-1):line)+'</p>';
  }).join('');
}

    g.fillStyle='rgba(0,0,0,.2)';g.fillRect(px,py+U-2,U,2);g.fillRect(px+U-2,py,2,U);
  }
}

  caveBoss(r){cavebg();bed();box(12);b(11,2,3,2,'#2b2b33');b(10,3,1,1,'#2b2b33');b(14,3,1,1,'#2b2b33');eyes(12,2,P.bird);party(r,7);},
  caveEnd(r){cavebg();box(12);b(12,4,1,1,'#b46bff');party(r,7);},
  village(r){sky(P.sky);ground(P.grass,P.dirt);b(9,3,3,3,P.board);b(8,2,5,1,P.bird);b(10,4,1,2,P.dark);b(13,4,2,2,P.board);b(13,3,2,1,P.bird);b(7,4,1,1,P.skin);b(7,5,1,1,P.dogd);party(r,4);},
  castle(r){hall();b(8,2,8,4,P.stone);b(9,3,2,3,P.dark);b(13,3,2,3,P.dark);party(r,6);},
  craft(r){hall();b(9,1,5,3,P.board);b(10,5,3,1,P.wood);party(r,6);},
  boss(r){hall();king(11,2);party(r,6);},
  dawn(r){sky(P.eve);b(12,3,2,2,P.sun);ground(P.grass,P.dirt);tree(1);party(r,8);},
  dawnKing(r){sky(P.eve);b(12,2,2,2,P.sun);ground(P.grass,P.dirt);party(r,8);b(10,4,1,2,P.shadow);b(10,3,1,1,P.gold);}
};

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
const val=(v,r)=>typeof v==='function'?v(r):v;
function renderEndings(){
  $('endings').innerHTML='おわり '+ENDINGS.map(e=>'<i class="'+(save.endings.includes(e)?'on':'')+'"></i>').join('')+
    ' '+save.endings.length+'/'+ENDINGS.length;
  renderBook();
}
function renderMode(){
  document.querySelectorAll('.seg button').forEach(bn=>bn.setAttribute('aria-pressed',String(bn.dataset.mode===save.mode)));
}
function pruneUnfinished(){
  AREAS.forEach(a=>{const x=save.run.areas[a]; if(x&&!x.done&&!x.reached) delete save.run.areas[a];});
}
let revealed=false, flash='', page=0, seenHere={};
const PG='\n@@\n';
function toPages(t){return (Array.isArray(t)?t.join(PG):t).split(PG);}
function onLast(){return page>=toPages(val(NODES[node].text,save.run)).length-1;}
function outcome(c){
  if(c.rest) return 'たおれた ときに、ここで {目|め}が さめる';
  if(c.disabled) return '';
  if(c.pick) return 'アイテムが {手|て}に {入|はい}る';
  const T=NODES[c.to];
  if(c.cost) return '{体力|たいりょく}が へるが、いい ことが ある';
  if(T.dmg) return '{体力|たいりょく}が へる';
  if(T.win) return 'かてる';
  if(T.join) return '{仲間|なかま}が ふえる';
  if(T.lose) return T.back?'うまく いかない':'にげられる';
  return 'あんぜん';
}
function choicesOf(n,r){
  return val(n.choices,r).filter(c=>(!c.if||c.if(r))&&!(c.once&&r.got[c.once]));
}
function choose(c){
  const r=save.run;
  if(c.disabled) return;
  if(c.pick){
    r.got[c.once]=1;r.herb++;
    flash='{薬草|やくそう}を {一|ひと}つ {手|て}に {入|い}れた!';
    persist();render();return;
  }
  if(c.rest){
    r.bed=node;r.bedArea=NODES[node].reach||null;
    if(node==='v1') r.hp=maxHp(r);
    flash=node==='v1'?'やどやで ぐっすり {休|やす}んだ。{体力|たいりょく}が ぜんぶ もどった。\nたおれても、つぎは ここで {目|め}が さめる。':'ベッドで {休|やす}んだ。たおれても、つぎは ここで {目|め}が さめる。';
    persist();render();return;
  }
  if(c.cost) r.hp-=c.cost;
  go(c.to,c);
}
function isUnlocked(id){return !!save.book[id]||(id.slice(0,2)==='e_'&&save.endings.includes(id.slice(2)));}
function unlock(id){
  const e=ENTRIES.find(x=>x.id===id);
  if(!e||save.book[id]) return;
  save.book[id]=1;
  flash+=(flash?'\n':'')+'{図鑑|ずかん}に「'+e.name+'」が のった!';
}
function go(id,choice){
  const r=save.run, n=NODES[id];
  revealed=false;flash='';page=0;
  if(id==='hub') seenHere={};
  r.again=!!seenHere[id]||!!(n.reach&&r.areas[n.reach]&&r.areas[n.reach].reached);
  seenHere[id]=1;
  if(VISIT[id]){r.visited=r.visited||{};r.visited[VISIT[id]]=1;}
  if(choice&&choice.weapon) unlock('w_'+choice.weapon);
  if(choice&&choice.armor) unlock('a_'+choice.armor);
  if(n.join) unlock('p_'+n.join);
  if(n.win) unlock(GUARD[id.slice(0,2)]);
  if(n.end) unlock('g_king');
  if(choice&&choice.learn) save.known[choice.learn]=(save.known[choice.learn]||0)+1;
  if(choice&&choice.weapon) r.weapon=choice.weapon;
  if(choice&&choice.armor){const before=def(r);r.armor=choice.armor;r.hp=Math.max(1,r.hp+def(r)-before);}
  if(id==='v1'){r.back=r.dropped.length>0;r.dropped.forEach(m=>{if(!r.mats.includes(m))r.mats.push(m);});r.dropped=[];}
  if(n.miss) r.misses++;
  if(n.dmg) r.hp=Math.max(0,r.hp-n.dmg);
  if(n.heal) r.hp=maxHp(r);
  if(n.herb) r.herb+=n.herb;
  if(n.eye){r.eye+=n.eye;r.got.eye=1;}
  if(id==='ko'){
    r.kos++;r.lost=r.herb>0||r.eye>0||r.mats.length>0;
    r.mats.forEach(m=>{if(!r.dropped.includes(m))r.dropped.push(m);});
    r.mats=[];r.herb=0;r.eye=0;r.got={};
  }
  if(n.mat&&!r.mats.includes(n.mat)) r.mats.push(n.mat);
  if(n.join) r.areas[n.join]={comp:true,done:false};
  if(n.alone) r.areas[n.alone]={comp:false,done:false};
  if(n.reach&&r.areas[n.reach]) r.areas[n.reach].reached=true;
  if(n.done&&r.areas[n.done]) r.areas[n.done].done=true;
  if(n.done&&r.bedArea===n.done){r.bed=null;r.bedArea=null;}
  if(id==='hub') pruneUnfinished();
  if(n.end&&!save.endings.includes(id)) save.endings.push(id);
  node=id;persist();render();
  window.scrollTo(0,0);
}
function newJourney(){save.run=freshRun();go('hub');}
function isDown(){const n=NODES[node];return save.run.hp<=0&&!n.end&&node!=='ko';}
function canUseEye(){
  const r=save.run,n=NODES[node];
  if(r.eye<=0||revealed||n.end||n.back||isDown()||!onLast()) return false;
  const cs=choicesOf(n,r);
  return cs.some(c=>!c.disabled)&&!cs.some(c=>c.quiz);
}
function useHerb(){
  const r=save.run;
  if(r.herb>0&&r.hp<maxHp(r)&&!isDown()){r.herb--;r.hp++;flash='{薬草|やくそう}を たべて、{体力|たいりょく}が {一|ひと}つ もどった。';persist();render();}
}
function useEye(){
  if(canUseEye()){save.run.eye--;revealed=true;persist();render();}
}
function render(){
  const r=save.run, n=NODES[node], down=isDown();
  ART[n.art](r);
  const badge=$('badge');
  if(n.end){badge.hidden=false;badge.className='badge';badge.innerHTML=rubyHtml(n.end);}
  else if(n.miss||n.lose){badge.hidden=false;badge.className='badge miss';badge.textContent=n.miss?'ざんねん!':n.lose;}
  else badge.hidden=true;
  const pages=toPages(val(n.text,r));
  if(page>pages.length-1) page=pages.length-1;
  const last=page===pages.length-1;
  let text=pages[page];
  if(last&&n.dmg) text+='\n{体力|たいりょく}が {一|ひと}つ へった。';
  if(last&&typeof n.heal==='string') text+='\n'+n.heal;
  if(last&&flash) text+='\n'+flash;
  $('story').innerHTML=linesHtml(text);
  const hint=$('hint');
  if(n.hint&&last){hint.hidden=false;hint.innerHTML=linesHtml(val(n.hint,r));}else hint.hidden=true;

  const groups=[];
  let hearts='';
  for(let i=0;i<maxHp(r);i++) hearts+='<i class="'+(i<r.hp?'':'off')+'"></i>';
  groups.push(rubyHtml('{体力|たいりょく}')+' <span class="hearts" aria-label="'+r.hp+'">'+hearts+'</span>');
  groups.push(rubyHtml('{攻撃力|こうげきりょく}')+' <span class="chip num">'+atk(r)+'</span>');
  groups.push(rubyHtml('{防御力|ぼうぎょりょく}')+' <span class="chip num">'+def(r)+'</span>');
  const ps=pals(r), ds=doneAreas(r).length;
  if(r.mats.length) groups.push('ざいりょう '+r.mats.map(m=>'<span class="chip mat">'+m+'</span>').join(''));
  if(ps.length) groups.push('なかま '+ps.map(a=>'<span class="chip">'+PAL_CHIP[a]+'</span>').join(''));
  if(ds) groups.push('かけら <span class="chip gem">'+ds+'</span>');
  $('items').innerHTML=groups.map(x=>'<span class="group">'+x+'</span>').join('');

  const tools=$('tools');tools.innerHTML='';
  const addTool=(html,enabled,fn)=>{
    const bt=document.createElement('button');bt.type='button';bt.className='tool';bt.innerHTML=html;
    bt.disabled=!enabled;bt.addEventListener('click',fn);tools.appendChild(bt);
  };
  if(r.herb>0) addTool('<ruby>薬草<rt>やくそう</rt></ruby>を たべる(のこり '+r.herb+')',r.hp<maxHp(r)&&!down,useHerb);
  if(r.eye>0) addTool('<ruby>眼鏡<rt>めがね</rt></ruby>で さきを <ruby>見<rt>み</rt></ruby>る(のこり '+r.eye+')',canUseEye(),useEye);

  const box=$('choices');box.innerHTML='';
  const add=(html,cls,fn)=>{
    const bt=document.createElement('button');bt.type='button';bt.className='choice '+cls;bt.innerHTML=html;
    bt.addEventListener('click',fn);box.appendChild(bt);return bt;
  };
  if(!last) add('つぎへ ▶ <small>'+(page+1)+'/'+pages.length+'</small>','next',()=>{page++;render();window.scrollTo(0,0);});
  else if(n.end) add('あたらしい たびに <ruby>出<rt>で</rt></ruby>る','back',newJourney);
  else if(down) add('<ruby>目<rt>め</rt></ruby>の まえが まっくらに なった……','back',()=>go('ko'));
  else if(n.back) add(n.miss?'もういちど えらぶ':'もういちど かんがえる','back',()=>go(n.back));
  else choicesOf(n,r).forEach(c=>{
    const label=(c.quiz?esc(c.t):rubyHtml(c.t))+
      (c.mark?'<span class="tag mark">'+c.mark+'</span>':'')+
      (revealed&&!c.disabled?'<span class="tag">→ '+rubyHtml(outcome(c))+'</span>':'');
    const bt=add(label,(c.quiz?'quiz':'')+(c.disabled?' done':''),()=>choose(c));
    if(c.disabled) bt.disabled=true;
  });
  renderEndings();
}

let bookOpen=false;
function renderBook(){
  const got=ENTRIES.filter(e=>isUnlocked(e.id)).length;
  $('bookbtn').innerHTML='<ruby>図鑑<rt>ずかん</rt></ruby> '+got+'/'+ENTRIES.length;
  $('bookbtn').setAttribute('aria-expanded',String(bookOpen));
  $('main').hidden=bookOpen;$('book').hidden=!bookOpen;
  if(!bookOpen) return;
  $('book').innerHTML='<h2><ruby>図鑑<rt>ずかん</rt></ruby> '+got+'/'+ENTRIES.length+'</h2>'+
    BOOK.map(s=>'<h3>'+rubyHtml(s.title)+'</h3>'+s.items.map(e=>isUnlocked(e.id)
      ? '<div class="entry"><span class="nm">'+rubyHtml(e.name)+'</span><span class="ds">'+rubyHtml(e.desc)+'</span></div>'
      : '<div class="entry locked"><span class="nm">???</span><span class="ds">ヒント:'+rubyHtml(e.hint)+'</span></div>').join('')).join('')+
    '<button type="button" class="choice back" id="bookclose">とじる</button>';
}
$('bookbtn').addEventListener('click',()=>{bookOpen=!bookOpen;renderBook();window.scrollTo(0,0);});
$('book').addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('#bookclose')){bookOpen=false;renderBook();return;}
  peek(e);
});

/* tap a dotted word to peek at its reading */
function peek(e){
  const rb=e.target.closest('ruby.hid');
  if(!rb) return;
  if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ') return;
  rb.classList.toggle('peek');
}
['story','hint'].forEach(id=>{$(id).addEventListener('click',peek);$(id).addEventListener('keydown',peek);});

document.querySelectorAll('.seg button').forEach(bn=>bn.addEventListener('click',()=>{
  save.mode=bn.dataset.mode;persist();renderMode();render();
}));
$('reset').addEventListener('click',()=>{
  save={known:{},endings:[],book:{},mode:save.mode,run:freshRun()};node='hub';revealed=false;flash='';bookOpen=false;page=0;seenHere={};persist();render();
});

pruneUnfinished();renderMode();render();
</script>
<script src="../pause-ui.js"></script>
</body>
</html>
