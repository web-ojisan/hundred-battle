<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0D14">
<title>10秒ちょうどでぶっとばす！</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D14;
    --line:#1C2333;
    --ink:#F3F5FA;
    --ink-dim:#7C8397;
    --p1:#FF3B5C;
    --p2:#2EC4FF;
    --p3:#C6FF3B;
    --p4:#FF7A3B;
    --p5:#B36BFF;
    --gold:#FFD23B;
  }
  html,body{
    position:fixed; inset:0; width:100%; height:100%;
    margin:0; padding:0; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    background:var(--bg);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  *{ box-sizing:border-box; }
  body{ font-family:'Zen Kaku Gothic New',system-ui,sans-serif; color:var(--ink); }

  #app{
    position:absolute; inset:0;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    display:grid; gap:6px; background:var(--bg);
  }
  #app.layout-3{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1.15fr; grid-template-areas:"z2 z3" "z1 z1"; }
  #app.layout-4{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; grid-template-areas:"z2 z3" "z1 z4"; }
  #app.layout-5{ grid-template-columns:1fr 1fr; grid-template-rows:0.85fr 0.85fr 1.2fr; grid-template-areas:"z2 z3" "z4 z5" "z1 z1"; }

  .zone{
    position:relative; overflow:hidden; border-radius:18px;
    background:#10141F; border:2px solid var(--line);
    transition:background .12s ease, border-color .12s ease;
  }
  .rotor{
    position:absolute; top:50%; left:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .zone[data-p="1"]{ --accent:var(--p1); }
  .zone[data-p="2"]{ --accent:var(--p2); }
  .zone[data-p="3"]{ --accent:var(--p3); }
  .zone[data-p="4"]{ --accent:var(--p4); }
  .zone[data-p="5"]{ --accent:var(--p5); }
  .zone.armed{ border-color:var(--accent); }
  .zone.flash{ animation:flashPulse .5s ease-out; }
  @keyframes flashPulse{
    0%{ box-shadow:0 0 0 0 rgba(255,255,255,.5) inset; }
    100%{ box-shadow:0 0 0 60px transparent inset; }
  }
  .zone.foul{ background:#2A0F14; }
  @keyframes dmgFlash{
    0%{ background:rgba(210,20,50,.85); }
    60%{ background:rgba(160,12,30,.45); }
    100%{ background:#10141F; }
  }
  .zone.dmg-flash{ animation:dmgFlash 1s ease-out forwards; }
  .zone.grave{ filter:grayscale(1) brightness(.5); pointer-events:none; }
  .zone.grave .p-name{ opacity:.45; }
  .zone.grave .score{ opacity:.4; }
  .zone.grave .p-status{ font-size:clamp(30px,7vw,60px); }
  .zone.tapped{ filter:brightness(.92); }
  .zone.sleep{ filter:grayscale(.6) brightness(.7); }

  /* ── タイミングゲーム専用 ── */
  @keyframes perfectPulse{
    0%  { box-shadow:0 0 0   0 rgba(255,210,59,.0) inset; }
    25% { box-shadow:0 0 120px 10px rgba(255,210,59,.85) inset; }
    100%{ box-shadow:0 0 0   0 rgba(255,210,59,.0) inset; }
  }
  .zone.perfect-flash{ animation:perfectPulse 1.4s ease-out forwards !important; }
  .zone.perfect-flash .p-status{ color:var(--gold) !important; text-shadow:0 0 20px rgba(255,210,59,.9); }

  @keyframes greatPulse{
    0%  { box-shadow:0 0 60px rgba(46,196,255,.7) inset; }
    100%{ box-shadow:0 0 0  0 rgba(46,196,255,.0) inset; }
  }
  .zone.great-flash{ animation:greatPulse 0.9s ease-out forwards !important; }
  .zone.great-flash .p-status{ color:var(--p2) !important; }

  .perfect-banner{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(26px,7vw,56px); font-weight:900;
    color:var(--gold);
    text-shadow:0 0 30px rgba(255,210,59,1),0 0 70px rgba(255,210,59,.6);
    animation:perfectBannerAnim 2.2s ease-out forwards;
  }
  @keyframes perfectBannerAnim{
    0%  { transform:scale(.25); opacity:0; }
    18% { transform:scale(1.25); opacity:1; }
    38% { transform:scale(1.0); opacity:1; }
    80% { opacity:1; }
    100%{ opacity:0; transform:scale(1.08); }
  }

  /* ── 背景テーマ ── */
  @keyframes arenaBreath{
    0%,100%{ box-shadow:0 0 60px rgba(200,80,0,.18) inset; }
    50%{ box-shadow:0 0 80px rgba(220,100,0,.28) inset; }
  }
  @keyframes bossAura{
    0%,100%{ box-shadow:0 0 60px rgba(80,0,200,.22) inset; }
    40%{ box-shadow:0 0 90px rgba(100,0,240,.34) inset; }
    70%{ box-shadow:0 0 50px rgba(60,0,160,.18) inset; }
  }
  body.arena-bg, body.arena-bg #app{ background:#1A0B04; }
  body.boss-bg,  body.boss-bg  #app{ background:#06020F; }
  body.arena-bg .zone{ background:#1C100A; border-color:rgba(160,75,10,.5); animation:arenaBreath 3.2s ease-in-out infinite; }
  body.boss-bg  .zone{ background:#0B0818; border-color:rgba(90,20,160,.55); animation:bossAura 4.5s ease-in-out infinite; }
  body.arena-bg .zone.armed, body.boss-bg .zone.armed{ border-color:var(--accent); animation:none; }
  body.arena-bg .zone.go,    body.boss-bg .zone.go   { animation:none; }
  body.arena-bg .zone.winner,body.boss-bg .zone.winner{ animation:none; }
  body.arena-bg .zone.foul,  body.boss-bg .zone.foul { animation:none; }
  body.arena-bg .zone.grave, body.boss-bg .zone.grave{ animation:none; }

  .zone[data-p="1"].go{ background:#7A0E22; }
  .zone[data-p="2"].go{ background:#0E4F66; }
  .zone[data-p="3"].go{ background:#5E6E14; }
  .zone[data-p="4"].go{ background:#7A3A0E; }
  .zone[data-p="5"].go{ background:#3A1A66; }
  .zone[data-p="1"].winner{ background:#3A121C; }
  .zone[data-p="2"].winner{ background:#123542; }
  .zone[data-p="3"].winner{ background:#2E3712; }
  .zone[data-p="4"].winner{ background:#3A220E; }
  .zone[data-p="5"].winner{ background:#241233; }

  /* ── エフェクト ── */
  .fx{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .fx .flash{
    position:absolute; inset:0; opacity:0;
    background:radial-gradient(circle at 50% 52%, rgba(255,255,255,.95), rgba(255,120,40,.65) 38%, rgba(255,60,40,.25) 60%, transparent 72%);
    animation:boomFlash .6s ease-out forwards;
  }
  @keyframes boomFlash{
    0%{ opacity:0; transform:scale(.25); }
    18%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.5); }
  }
  .fx .particle{
    position:absolute; left:50%; top:52%; width:9px; height:9px; border-radius:2px;
    transform:translate(0,0) rotate(0deg); opacity:1;
    animation:particleBurst .75s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes particleBurst{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.25); opacity:0; }
  }
  .zone-inner.shake{ animation:shakeZone .45s ease; }
  @keyframes shakeZone{
    10%,90%{ transform:translate3d(-1px,-1px,0); }
    20%,80%{ transform:translate3d(3px,2px,0); }
    30%,50%,70%{ transform:translate3d(-6px,3px,0); }
    40%,60%{ transform:translate3d(6px,-3px,0); }
  }
  .fx .zzz{
    position:absolute; bottom:42%; transform:translateX(-50%);
    font-weight:900; color:#fff; opacity:0;
    font-family:'Space Grotesk',sans-serif;
    animation:zzzFloat 1.8s ease-out forwards;
    text-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  @keyframes zzzFloat{
    0%{ opacity:0; transform:translate(-50%,0) scale(.6); }
    15%{ opacity:.9; }
    100%{ opacity:0; transform:translate(-50%,-70px) scale(1.3); }
  }

  /* ── bigFx ── */
  #bigFx{ position:absolute; inset:0; z-index:20; pointer-events:none; overflow:hidden; display:none; }
  #bigFx.show{ display:block; }
  .bigfx-flash{ position:absolute; inset:0; opacity:0; }
  .bigfx-flash.boss{
    background:radial-gradient(circle at 50% 50%, rgba(150,20,210,.9), rgba(40,0,60,.88) 45%, rgba(0,0,0,.92) 78%);
    animation:bigFlashBoss 1.5s ease-out forwards;
  }
  @keyframes bigFlashBoss{ 0%{ opacity:0; } 10%{ opacity:1; } 70%{ opacity:.9; } 100%{ opacity:0; } }
  .bigfx-flash.party{
    background:radial-gradient(circle at 50% 50%, #fff, #FFE9A8 35%, rgba(255,210,59,.45) 60%, transparent 80%);
    animation:bigFlashParty 1.4s ease-out forwards;
  }
  @keyframes bigFlashParty{ 0%{ opacity:0; } 12%{ opacity:1; } 70%{ opacity:.85; } 100%{ opacity:0; } }
  .bigfx-ray{ position:absolute; top:50%; left:50%; width:6px; height:130vmax; transform-origin:top center; opacity:0; }
  .bigfx-ray.boss{
    background:linear-gradient(to bottom,rgba(210,70,255,.95),rgba(120,0,180,0));
    filter:blur(1px); animation:rayBoss 1.15s ease-out forwards;
  }
  @keyframes rayBoss{
    0%{ opacity:0; transform:translate(-50%,0) rotate(var(--ang)) scaleY(0); }
    28%{ opacity:1; transform:translate(-50%,0) rotate(var(--ang)) scaleY(1); }
    100%{ opacity:0; transform:translate(-50%,0) rotate(var(--ang)) scaleY(1); }
  }
  .bigfx-ray.party{ width:9px; filter:blur(.5px); animation:rayParty 1.05s ease-out forwards; }
  @keyframes rayParty{
    0%{ opacity:0; transform:translate(-50%,0) rotate(var(--ang)) scaleY(0); }
    25%{ opacity:1; transform:translate(-50%,0) rotate(var(--ang)) scaleY(1); }
    75%{ opacity:1; transform:translate(-50%,0) rotate(var(--ang)) scaleY(.55); }
    100%{ opacity:0; transform:translate(-50%,0) rotate(var(--ang)) scaleY(.15); }
  }
  .bigfx-ring{
    position:absolute; top:50%; left:50%; width:10px; height:10px;
    transform:translate(-50%,-50%); border:3px solid rgba(210,90,255,.85);
    border-radius:50%; box-shadow:0 0 30px 6px rgba(160,40,220,.6);
    animation:ringGrow 1.35s ease-out forwards;
  }
  @keyframes ringGrow{ 0%{ width:10px; height:10px; opacity:0; } 20%{ opacity:1; } 100%{ width:150vmax; height:150vmax; opacity:0; } }
  #app.bigshake{ animation:appShake .6s ease; }
  @keyframes appShake{
    10%,90%{ transform:translate3d(-3px,-2px,0); }
    20%,80%{ transform:translate3d(6px,4px,0); }
    30%,50%,70%{ transform:translate3d(-10px,6px,0); }
    40%,60%{ transform:translate3d(10px,-6px,0); }
  }

  /* ── ゾーン内テキスト ── */
  .zone-inner{ text-align:center; width:100%; padding:10px 14px; }
  .p-name{
    font-family:'Space Grotesk','Zen Kaku Gothic New',sans-serif;
    font-weight:700; font-size:clamp(13px,2.4vw,20px);
    letter-spacing:.06em; color:var(--accent);
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.04);
  }
  .p-name .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .p-status{
    margin-top:10px; font-weight:900; font-size:clamp(22px,6vw,52px);
    line-height:1.05; letter-spacing:.02em; min-height:1.2em;
  }
  .p-sub{
    margin-top:6px; color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(12px,2.4vw,18px);
  }
  .score{ margin-top:10px; display:flex; gap:6px; justify-content:center; }
  .score i{ width:10px; height:10px; border-radius:50%; border:1.5px solid var(--accent); background:transparent; }
  .score i.on{ background:var(--accent); }
  .hp-label{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(11px,1.8vw,14px); color:var(--ink-dim); }
  .hp-grid{ display:flex; flex-wrap:wrap; gap:3px; justify-content:center; max-width:160px; margin:5px auto 0; }
  .hp-cell{ width:13px; height:13px; border-radius:2px; border:1.5px solid var(--accent); background:transparent; transition:background .25s; }
  .hp-cell.on{ background:var(--accent); }
  @keyframes hpDamage{
    0%  { background:#FF3B5C; border-color:#FF3B5C; transform:scale(1.35); box-shadow:0 0 8px #FF3B5C; }
    55% { background:#FF3B5C; border-color:#FF3B5C; transform:scale(1.1);  box-shadow:0 0 4px #FF3B5C; }
    100%{ background:transparent; border-color:var(--accent); transform:scale(1); box-shadow:none; }
  }
  .hp-cell.damaged{ animation:hpDamage .7s ease-out forwards; }
  .char-img{
    display:block; height:clamp(80px,18vmin,130px); width:auto;
    margin:4px auto 2px; border-radius:6px;
    image-rendering:pixelated; image-rendering:crisp-edges;
    transition:filter .2s;
  }

  /* ── confetti ── */
  .confetti-wrap{ position:absolute; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
  .confetti-piece{
    position:absolute; top:-14px; border-radius:2px;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    80%{ opacity:1; }
    100%{ transform:translateY(110%) rotate(720deg); opacity:0; }
  }

  /* ── fight button / champ actions ── */
  #fightBtn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:6; width:min(26vw,130px); height:min(26vw,130px); border-radius:50%;
    background:var(--gold); color:#0A0D14;
    font-family:inherit; font-weight:900; font-size:clamp(16px,3vw,24px);
    letter-spacing:.04em; border:4px solid rgba(255,255,255,.3);
    box-shadow:0 8px 26px rgba(0,0,0,.55);
    display:none; align-items:center; justify-content:center;
    cursor:pointer; -webkit-appearance:none; appearance:none; outline:none;
    -webkit-tap-highlight-color:transparent;
  }
  #fightBtn.show{ display:flex; animation:fightPulse 1.8s ease-in-out infinite; }
  @keyframes fightPulse{
    0%,100%{ box-shadow:0 8px 26px rgba(0,0,0,.55),0 0 0 0 rgba(255,210,59,.5); }
    50%{ box-shadow:0 8px 26px rgba(0,0,0,.55),0 0 0 16px rgba(255,210,59,0); }
  }
  #champActions{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:6; display:none; flex-direction:column; align-items:center; gap:14px;
  }
  #champActions.show{ display:flex; }
  #retryBtn{
    width:min(26vw,130px); height:min(26vw,130px); border-radius:50%;
    background:var(--gold); color:#0A0D14;
    font-family:inherit; font-weight:900; font-size:clamp(16px,3vw,24px);
    letter-spacing:.04em; border:4px solid rgba(255,255,255,.3);
    box-shadow:0 8px 26px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-appearance:none; appearance:none; outline:none;
    -webkit-tap-highlight-color:transparent;
    animation:fightPulse 1.8s ease-in-out infinite;
  }
  #modeBtn{
    font-family:inherit; font-weight:700; font-size:clamp(13px,2vw,16px);
    color:var(--ink); background:rgba(255,255,255,.06);
    border:1.5px solid rgba(255,255,255,.22); border-radius:999px;
    padding:10px 26px; letter-spacing:.04em;
    cursor:pointer; -webkit-appearance:none; appearance:none; outline:none;
  }

  /* ── slash ── */
  #slash{ position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; z-index:5; }
  #slash .bar{
    position:absolute; width:180%; height:6px;
    background:linear-gradient(90deg,transparent,#fff,transparent);
    transform:rotate(-18deg) scaleX(0); opacity:0; box-shadow:0 0 24px 4px #fff;
  }
  #slash.show .bar{ animation:slashGo .32s ease-out forwards; }
  @keyframes slashGo{
    0%{ transform:rotate(-18deg) scaleX(0); opacity:1; }
    60%{ transform:rotate(-18deg) scaleX(1); opacity:1; }
    100%{ transform:rotate(-18deg) scaleX(1); opacity:0; }
  }

  /* ── overlay ── */
  #overlay{
    position:absolute; inset:0; z-index:10;
    background:rgba(6,8,13,.86); backdrop-filter:blur(6px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top));
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  #overlay.hidden{ display:none; pointer-events:none; }
  #overlay.flipped{ transform:rotate(180deg); }
  .title{ font-weight:900; font-size:clamp(30px,6vw,54px); letter-spacing:.08em; }
  .title small{ display:block; font-size:.36em; color:var(--ink-dim); font-weight:700; letter-spacing:.3em; margin-top:6px; }
  .lead{ color:var(--ink-dim); font-size:clamp(13px,2vw,16px); max-width:480px; }
  .btn{ font-family:inherit; font-weight:900; font-size:clamp(16px,2.6vw,22px); color:#0A0D14; background:var(--gold); border:none; border-radius:999px; padding:16px 40px; letter-spacing:.06em; cursor:pointer; }
  .btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line); font-size:clamp(12px,1.8vw,15px); padding:10px 22px; font-weight:700; }
  .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .stepper{ display:flex; align-items:center; gap:10px; color:var(--ink-dim); font-family:'Space Grotesk',sans-serif; }
  .stepper button{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:#10141F; color:var(--ink); font-size:18px; font-weight:700; cursor:pointer; }
  .stepper span{ min-width:2ch; text-align:center; color:var(--ink); font-weight:700; }
  .mode-toggle{ display:flex; gap:8px; align-items:center; justify-content:center; }
  .mode-btn{ font-family:inherit; font-weight:700; font-size:13px; padding:9px 18px; border-radius:999px; border:1.5px solid var(--line); background:#10141F; color:var(--ink-dim); cursor:pointer; -webkit-appearance:none; appearance:none; outline:none; }
  .mode-btn.active{ background:var(--gold); color:#0A0D14; border-color:transparent; }
  .hint{ font-size:12px; color:var(--ink-dim); max-width:420px; }
  #rotateHint{
    position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:20; font-size:12px; color:var(--ink-dim);
    background:rgba(16,20,31,.9); border:1px solid var(--line);
    padding:6px 14px; border-radius:999px; display:none;
  }
  @media (orientation:portrait){ #rotateHint{ display:block; } }
</style>
</head>
<body>

<div id="app"></div>
<button id="fightBtn" type="button">勝負！</button>
<div id="champActions">
  <button id="retryBtn" type="button">もう一回！</button>
  <button id="modeBtn"  type="button">モードを選ぶ</button>
</div>
<div id="slash"><div class="bar"></div></div>
<div id="bigFx"></div>
<div id="rotateHint">横向きにするとプレイしやすくなります</div>
<div id="overlay"></div>

<script>
(function(){
  'use strict';

  /* ── ジェスチャー対策 ── */
  var EDGE_PX = 24;
  document.addEventListener('touchstart', function(e){
    for (var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      if (t.clientX <= EDGE_PX || t.clientX >= window.innerWidth - EDGE_PX){ e.preventDefault(); break; }
    }
  }, {passive:false});
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

  /* ── WebAudio ── */
  var actx = null;
  var sfxBuffers = { sword: null, magic: null, fire: null };
  var sfxRaw = {};
  (function(){
    var files = { sword:'img/swordattak.mp3', magic:'img/magckatack.mp3', fire:'img/fireatack.mp3' };
    Object.keys(files).forEach(function(k){

  /* ── ゲームステート ── */
  var el = { overlay: $('overlay'), slash: $('slash') };

  function goToSelect(){
    stopBgm();
    document.body.classList.remove('arena-bg','boss-bg');

    adjustPlayersArray();
    buildBoard(); renderNames(); renderScores();

  function startMatch(){
    showChampActions(false); showFightButton(false);
    document.body.classList.remove('arena-bg','boss-bg');
    document.body.classList.add(MODE==='boss'?'boss-bg':'arena-bg');

  function nextRound(){
    if (state==='champion') return;
    stopLiveTimer();
    clearTimeout(signalTimeout); clearTimeout(autoResolveTimer); clearTimeout(cooldownTimer);
    resetRoundVisuals();
    state = 'ready'; roundBusy = false; inCooldown = true;
    players.forEach(function(pl){ pl.reactionMs = null; });

    var hasGrave = players.some(function(pl){ return pl.eliminated; });
    if (hasGrave) playBellChime();

    players.forEach(function(pl){ if (!pl.eliminated) setStatus(pl.id,'🙌','手をはなして…'); });

    cooldownTimer = setTimeout(function(){
      if (state !== 'ready') return;
      inCooldown = false;

      // HP-based ready text
      players.forEach(function(pl){
        if (pl.eliminated) return;
        zoneEl(pl.id).classList.add('armed');
        var readyText;
        if (MODE === 'boss'){
          var hp = pl.hp != null ? pl.hp : maxHpFor(pl);
          var half = maxHpFor(pl) / 2;
          if (pl.id === 1) readyText = hp<=1 ? 'くっ…意地でも倒れん…！' : hp<=half ? '貴様らに負けぬ…！' : '来るぞ…！';
          else             readyText = hp<=1 ? 'ここで死んでたまるか…！' : hp<=half ? 'まだ負けない…！' : '来るぞ…！';
        } else { readyText = '準備して！'; }
        setStatus(pl.id, readyText, 'カウントスタート↓');
      });

      // 3-2-1 countdown then signal
      beep(440, 0.12, 'sine', 0.06);
      var counts = ['3','2','1','GO！'];
      counts.forEach(function(val, i){
        signalTimeout = setTimeout(function(){
          players.forEach(function(pl){
            if (pl.eliminated) return;
            setStatus(pl.id, val, '');
          });
          playCountBeep(counts.length - 1 - i);
          if (i === counts.length - 1) setTimeout(fireSignal, 80);
        }, 600 + i * 800);
      });
    }, COOLDOWN_MS);
  }

  function fireSignal(){
    if (state !== 'ready') return;
    state = 'signal';
    signalTime = performance.now();
    el.slash.classList.remove('show'); void el.slash.offsetWidth; el.slash.classList.add('show');

    players.forEach(function(pl){
      if (pl.eliminated) return;
      var z = zoneEl(pl.id);
      z.classList.remove('armed');
      z.classList.add('go');
      setStatus(pl.id, '10秒ねらえ！', '');

      $('sub'+pl.id).style.color = '';

    autoResolveTimer = setTimeout(resolveTimingRound, TARGET_MS);
  }

  function startLiveTimer(){
    function tick(){
      if (state !== 'signal') return;
      var elapsed = performance.now() - signalTime;
      players.forEach(function(pl){
        if (pl.eliminated) return;
        if (pl.reactionMs !== null && pl.reactionMs !== undefined) return;
        var subEl = $('sub'+pl.id);
        if (elapsed < 3500){
          subEl.textContent = (elapsed/1000).toFixed(2)+' s';
          subEl.style.opacity = '1';
          subEl.style.color = '';
        } else if (elapsed < 4500){
          subEl.textContent = (elapsed/1000).toFixed(2)+' s';
          subEl.style.opacity = (Math.floor(elapsed/180)%2===0)?'1':'0.1';
          subEl.style.color = 'var(--gold)';
        } else if (elapsed < 5000){
          subEl.textContent = '消えるぞ…！';
          subEl.style.opacity = '1';
          subEl.style.color = 'var(--p1)';
        } else {
          subEl.textContent = '？';
          subEl.style.opacity = '0';
        }
      });
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);

  function stopLiveTimer(){ if (rafId!==null){ cancelAnimationFrame(rafId); rafId=null; } }

  function handleZoneTap(p){
    if (state==='select'){ cycleCharacter(p); return; }
    if (inCooldown) return;
    if (roundBusy) return;
    var actor = players.find(function(pl){ return pl.id===p; });
    if (!actor || actor.eliminated) return;
    if (state==='ready') return; // ignore during countdown

    if (state==='signal'){
      if (actor.reactionMs !== null && actor.reactionMs !== undefined) return;
      var elapsed = Math.round(performance.now() - signalTime);
      if (elapsed >= TARGET_MS) return; // past 10s
      actor.reactionMs = elapsed;
      var z = zoneEl(p);
      z.classList.remove('go','flash');
      z.classList.add('tapped');
      var subEl = $('sub'+p);
      subEl.style.opacity = '1'; subEl.style.color = '';
      subEl.textContent = elapsed + ' ms';
      playTapSound(); vibrate(12);

      var alive = players.filter(function(pl){ return !pl.eliminated; });
      var allIn = alive.every(function(pl){ return pl.reactionMs !== null && pl.reactionMs !== undefined; });
      if (allIn) resolveTimingRound();
    }

  function resolveTimingRound(){
    if (roundBusy) return;
    roundBusy = true;

    stopLiveTimer();
    state = 'result';

    else               resolveTimingFFARound();

  function timingDiff(reactionMs){
    if (reactionMs === null || reactionMs === undefined) return TARGET_MS;
    return Math.abs(reactionMs - TARGET_MS);
  }
  function timingLabel(diff, tapMs){
    if (diff <= 200) return 'PERFECT!!';
    if (diff <= 500) return 'GREAT!';
    return tapMs + ' ms';
  }

  function resolveTimingFFARound(){
    var alive = players.filter(function(pl){ return !pl.eliminated; });
    var winner = null, minDiff = Infinity;
    alive.forEach(function(pl){
      var d = timingDiff(pl.reactionMs);
      if (d < minDiff){ minDiff=d; winner=pl; }
    });
    clearZoneClasses();
    alive.forEach(function(pl){
      var z = zoneEl(pl.id);
      var missed = pl.reactionMs===null || pl.reactionMs===undefined;
      if (winner && pl.id===winner.id){
        z.classList.add('winner');
        var d = timingDiff(pl.reactionMs);
        setStatus(pl.id, d<=200?'PERFECT!!':d<=500?'GREAT!':'勝ち！', pl.reactionMs+' ms');
        setCharImg(pl.id,'atk');
        if (d<=200){ spawnPerfectEffect(pl.id); playPerfectFanfare(); }
        else if (d<=500) spawnGreatEffect(pl.id);
        else{ var sfx=WIN_SOUNDS[pl.charIndex]; if(sfx)sfx(); else beep(1200,.15,'square',.09); }
      } else {
        z.classList.add(missed?'foul':'dmg-flash');
        if (missed) setStatus(pl.id,'ミス…','間に合わず');
        else{
          var d2 = timingDiff(pl.reactionMs);
          var delta = pl.reactionMs - TARGET_MS;
          setStatus(pl.id, pl.reactionMs+' ms', (delta>0?'+':'')+delta+' ms');
        }
        setCharImg(pl.id,'dim');
      }
    });
    if (winner) winner.score++;
    renderScores(); vibrate(30);
    if (winner && winner.score >= TARGET){
      setTimeout(function(){ showChampion(winner); }, 1600);
    } else {
      setTimeout(function(){ if(state!=='champion') nextRound(); }, 3500);
    }
  }

  function resolveTimingBossRound(){
    var boss = players.find(function(pl){ return pl.id===1; });
    var party = players.filter(function(pl){ return pl.id!==1 && !pl.eliminated; });
    var oldHps = {};
    players.forEach(function(pl){ oldHps[pl.id]=pl.hp!=null?pl.hp:maxHpFor(pl); });
    var bossDiff = timingDiff(boss.reactionMs);
    var newlyDefeated = [];
    clearZoneClasses();
    var partyWins=0, bossWins=0;

    party.forEach(function(pl){
      var pDiff = timingDiff(pl.reactionMs);
      var z = zoneEl(pl.id);
      var missed = pl.reactionMs===null||pl.reactionMs===undefined;
      if (pDiff < bossDiff){
        partyWins++;
        boss.hp = Math.max(0,(boss.hp!=null?boss.hp:BOSS_HP_MAX)-1);
        z.classList.add('winner');
        var d=pDiff; var lbl=d<=200?'PERFECT!!':d<=500?'GREAT!':pick(PARTY_ATTACK_LINES);
        setStatus(pl.id, lbl, (missed?'':pl.reactionMs+' ms'));
        setCharImg(pl.id,'atk');
        if (d<=200) spawnPerfectEffect(pl.id);
        else if (d<=500) spawnGreatEffect(pl.id);
      } else {
        bossWins++;
        pl.hp = Math.max(0,(pl.hp!=null?pl.hp:PARTY_HP_MAX)-1);
        z.classList.add('foul');
        setStatus(pl.id, pick(PARTY_HIT_LINES), missed?'未入力':(pl.reactionMs+' ms'));
        setCharImg(pl.id,'dim');
        if (pl.hp<=0){ pl.eliminated=true; newlyDefeated.push(pl); }
      }
    });

    var bossZone = zoneEl(1);
    if (boss.reactionMs !== null && boss.reactionMs !== undefined){
      var bd = bossDiff;
      setStatus(1, bd<=200?'PERFECT…！':bd<=500?'GREAT…！':(boss.reactionMs+' ms'), boss.reactionMs+' ms');
    } else {
      setStatus(1,'不覚…','未入力');
    }
    if (partyWins>0 && bossWins===0){
      bossZone.classList.add('foul'); setCharImg(1,'dim');
      spawnBigEffect('party'); playPartyTurnBurst();
    } else if (bossWins>0 && partyWins===0){
      bossZone.classList.add('winner'); setCharImg(1,'atk');
      spawnBigEffect('boss'); playBossTurnMagic();
    } else {
      if (bossWins>0){ bossZone.classList.add('winner'); setCharImg(1,'atk'); playExplosion(); }
      else{ bossZone.classList.add('foul'); setCharImg(1,'dim'); }
    }

    renderScores();
    players.forEach(function(pl){
      if (oldHps[pl.id]!=null && pl.hp!=null && pl.hp<oldHps[pl.id]) flashHpDamage(pl.id,oldHps[pl.id],pl.hp);
    });
    vibrate(30);
    newlyDefeated.forEach(function(pl){ setTimeout(function(){ renderGrave(pl.id); }, 900); });

    if (boss.hp<=0){
      spawnBigEffect('party'); playPartyVictoryFanfare();
      setTimeout(function(){ showBossPartyVictory(); }, 1700); return;
    }
    var aliveParty = players.filter(function(pl){ return pl.id!==1&&!pl.eliminated; });
    if (aliveParty.length===0){
      spawnBigEffect('boss'); playBossVictoryTheme();
      setTimeout(function(){ showChampion(boss,'パーティーは全滅した…ボスの勝利！',boss.name+'大魔王の勝利！'); }, 1700); return;
    }
    setTimeout(function(){ if(state!=='champion') nextRound(); }, 3500);
  }

    $('incPlayers').addEventListener('pointerdown',function(e){ e.preventDefault(); PLAYER_COUNT=Math.min(5,PLAYER_COUNT+1); $('playersVal').textContent=PLAYER_COUNT; updateOverlayHint(); adjustPlayersArray(); buildBoard(); renderNames(); renderScores(); });
    var dt=$('decTarget'), it=$('incTarget');
    if(dt) dt.addEventListener('pointerdown',function(e){ e.preventDefault(); TARGET=Math.max(3,TARGET-1); $('targetVal').textContent=TARGET; renderScores(); });
    if(it) it.addEventListener('pointerdown',function(e){ e.preventDefault(); TARGET=Math.min(10,TARGET+1); $('targetVal').textContent=TARGET; renderScores(); });
    $('startBtn').addEventListener('pointerdown',function(e){ e.preventDefault(); goToSelect(); });
  }

  $('fightBtn').addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); startMatch(); });
  $('retryBtn').addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); goToSelect(); });
  $('modeBtn').addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); showChampActions(false); buildIdleOverlay(); showOverlay(true); });

  buildIdleOverlay();
  showOverlay(true);
})();
</script>
<script>
// オフラインで遊べるようにキャッシュを準備するService Workerを登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch((err) => {
      console.warn('[sw] register failed:', err);
    });
  });
}
</script>
